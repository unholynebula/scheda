function renderWorkout(){
  const root = document.getElementById('screen-root');
  root.innerHTML = '';
  const day = progDay(currentDay);

  const top = document.createElement('div');
  top.className = 'card';
  let doneSets=0, totSets=0;
  day.exercises.forEach(e=>{ if(skipped[e.id]) return; totSets+=e.sets; doneSets+=getWork(effExo(e)).filter(isSetDone).length; });
  const complete = totSets>0 && doneSets===totSets;
  const elapsedNow = activeWorkout ? (activeWorkout.elapsedMs + (activeWorkout.runningSince ? Date.now()-activeWorkout.runningSince : 0)) : 0;
  top.innerHTML =
    '<div class="tonnage-row">'+
      '<span class="tonnage-value">'+doneSets+'</span><span class="tonnage-unit">/ '+totSets+' serie</span>'+
      '<span class="session-time"><span class="session-dot">·</span><span id="workout-timer-live">'+formatClock(elapsedNow)+'</span></span>'+
      (complete ? '<span class="tonnage-delta up">completato</span>' : '')+
    '</div>';
  root.appendChild(top);

  if(deloadActive()){
    const dl = document.createElement('div');
    dl.className = 'deload-banner';
    dl.innerHTML = '<b>Scarico</b> · carichi ridotti, '+deloadDaysLeft()+' giorni rimasti';
    root.appendChild(dl);
  }

  const activeExo = day.exercises.filter(e=>!skipped[e.id] && !isExerciseComplete(effExo(e)))[0];
  const activeId = activeExo ? activeExo.id : null;

  day.exercises.forEach(baseExo=>{
    const exo = effExo(baseExo);
    const isSkipped = !!skipped[baseExo.id];
    const key = exKey(currentDay, exo.id);
    const isActive = exo.id===activeId;
    const expanded = (cardOverride[key]!==undefined) ? cardOverride[key] : isActive;
    const work = getWork(exo);
    const warmups = getWarmups(exo);
    const sug = computeSuggestions(currentDay, exo);

    const card = document.createElement('div');
    card.className = 'card exercise '+(expanded?'expanded':'collapsed')+(isActive?' is-active':'');

    // un "record" alla prima sessione non significa nulla: serve un confronto
    const variant = variantOf(exo);
    const prevEntries = entriesForVariant(currentDay, exo).filter(e=>e.date!==todayISO());
    const best = getBestE1rm(currentDay, exo.id, variant);
    let todayBest = 0;
    work.forEach(s=>{ if(s) todayBest = Math.max(todayBest, e1rm(s.w,s.r)); });
    const isPR = prevEntries.length>0 && todayBest>0 && (!best || todayBest>best.val);

    const done = work.filter(isSetDone).length;
    const head = document.createElement('div');
    head.className='exercise-header';
    const swapBadge = swaps[baseExo.id] ? '<span class="swap-badge">sostituito</span>' : '';
    const skipBadge = isSkipped ? '<span class="skip-badge">saltato</span>' : '';
    head.innerHTML =
      '<div style="min-width:0;flex:1;"><h3>'+exo.name+(isPR?'<span class="pr-badge">PR</span>':'')+swapBadge+skipBadge+'</h3>'+
      '<div class="target">'+(isSkipped ? 'non lo fai oggi' : (expanded
        ? exo.sets+' × '+exo.min+'-'+exo.max+' rip'
        : (done===exo.sets ? 'completato' : (done>0 ? done+'/'+exo.sets+' serie' : exo.sets+' × '+exo.min+'-'+exo.max+' rip'))))+
      '</div></div>'+
      '<button class="ex-menu" data-menu="'+baseExo.id+'">•••</button>'+
      '<div class="chevron">'+(expanded?'−':'+')+'</div>';
    head.addEventListener('click', (ev)=>{
      if(ev.target && ev.target.dataset && ev.target.dataset.menu){
        swapSheetFor = baseExo.id; renderApp(); return;
      }
      cardOverride[key] = !expanded; renderApp();
    });
    card.appendChild(head);
    if(isSkipped){ card.classList.add('is-skipped'); root.appendChild(card); return; }

    if(expanded){
      const restS = restSecondsFor(exo, false);
      const note = document.createElement('div');
      note.className = 'ex-note';
      const cue = cueFor(exo);
      note.innerHTML =
        '<div class="ex-note-rule"><b>Recupero '+Math.floor(restS/60)+':'+String(restS%60).padStart(2,'0')+'</b>'+
        ' \u00b7 '+effortCue(exo)+'</div>'+
        (cue ? '<div class="ex-note-cue">'+cue+'</div>' : '');
      card.appendChild(note);

      const goal = goalTextFor(currentDay, exo);
      if(goal){
        const g = document.createElement('div');
        g.className='goal-line';
        g.innerHTML = goal;
        card.appendChild(g);
      }

      const topW = topWorkWeight(currentDay, exo, sug);
      const ramp = warmupRamp(exo, topW);

      if(warmups.length>0){
        const wl = document.createElement('div');
        wl.className='col-labels';
        wl.innerHTML='<span>W</span><span>Kg</span><span>Rip</span><span></span><span></span>';
        card.appendChild(wl);
        warmups.forEach((wu,wi)=>{
          const row = document.createElement('div');
          row.className='set-row';
          const idx = document.createElement('div');
          idx.className='set-idx';
          idx.textContent = 'W'+(wi+1);
          const wCell = makeCell(exo.id, 'wu', wi, 'w', wu.w||null, 'kg');
          const rCell = makeCell(exo.id, 'wu', wi, 'r', wu.r||null, 'rip');
          const del = document.createElement('button');
          del.className='wu-remove'; del.textContent='×';
          del.addEventListener('click', ()=>{
            warmups.splice(wi,1);
            if(activeField && activeField.exoId===exo.id && activeField.kind==='wu') activeField=null;
            renderApp();
          });
          const sp = document.createElement('div');
          row.appendChild(idx); row.appendChild(wCell); row.appendChild(rCell); row.appendChild(del); row.appendChild(sp);
          card.appendChild(row);
        });
      }

      const addBtn = document.createElement('button');
      addBtn.className='btn-pill add-wu';
      addBtn.textContent='+ Warmup';
      addBtn.addEventListener('click', ()=>{
        const r = warmupRamp(exo, topW);
        const next = r.length ? r[Math.min(warmups.length, r.length-1)] : {w: roundToStep((topW||0)*0.5, increment(exo)), r:8};
        warmups.push({w:next.w, r:next.r});
        renderApp();
      });
      card.appendChild(addBtn);

      if(warmups.length===0 && ramp.length>0){
        const hint = document.createElement('div');
        hint.className='wu-hint';
        hint.textContent = 'Consigliati '+ramp.length+': '+ramp.map(x=>tidy(x.w)+'×'+x.r).join(' · ');
        card.appendChild(hint);
      } else if(warmups.length===0 && topW>0){
        const hint = document.createElement('div');
        hint.className='wu-hint';
        hint.textContent = 'Nessun avvicinamento necessario a questo carico.';
        card.appendChild(hint);
      } else if(warmups.length===0){
        const hint = document.createElement('div');
        hint.className='wu-hint';
        hint.textContent = 'Inserisci la serie 1 per avere i warmup consigliati.';
        card.appendChild(hint);
      }

      const cl = document.createElement('div');
      cl.className='col-labels';
      cl.innerHTML='<span>Set</span><span>Kg</span><span>Rip</span><span>RIR</span><span>Target</span>';
      card.appendChild(cl);

      const cur = firstUnfilled(exo);
      const last = getLastEntry(currentDay, exo.id);
      const lastWork = last ? last.work : null;

      for(let i=0;i<exo.sets;i++){
        const s = work[i];
        const row = document.createElement('div');
        row.className = 'set-row'+(i===cur?' current':'')+(isSetDone(s)?' done':'');

        const idx = document.createElement('div'); idx.className='set-idx'; idx.textContent=(i+1);

        const wCell = makeCell(exo.id, 'work', i, 'w',
          s && s.w ? s.w : null,
          (lastWork && lastWork[i] && lastWork[i].w) ? fmtNum(lastWork[i].w) : 'kg');
        const rCell = makeCell(exo.id, 'work', i, 'r',
          s && s.r ? s.r : null,
          (lastWork && lastWork[i] && lastWork[i].r) ? String(lastWork[i].r) : 'rip');

        const rirWrap = document.createElement('div');
        rirWrap.className = 'rir-cell'+(isSetPartial(s)?' needs-rir':'');
        rirWrap.textContent = (s && s.rir!==null && s.rir!==undefined) ? (s.rir===4?'4+':String(s.rir)) : '–';
        rirWrap.addEventListener('click', ()=>{
          activeField = {exoId:exo.id, kind:'work', index:i, field:'rir'};
          keypadBuffer = '';
          renderApp();
        });
        if(activeField && activeField.exoId===exo.id && activeField.kind==='work' && activeField.index===i && activeField.field==='rir'){
          rirWrap.classList.add('cell-active');
        }

        const sg = document.createElement('div');
        // il target si mostra solo sulla prossima serie da fare: ripeterlo su
        // tutte le righe e' rumore
        if(i===cur && sug[i]!==null && sug[i]!==undefined){ sg.className='suggest'; sg.textContent = fmtNum(sug[i])+'kg'; }
        else { sg.className='suggest muted'; sg.textContent=''; }

        row.appendChild(idx); row.appendChild(wCell); row.appendChild(rCell); row.appendChild(rirWrap); row.appendChild(sg);
        card.appendChild(row);
      }
    }
    root.appendChild(card);
  });

  const sw = document.createElement('div');
  sw.style.marginTop='16px';
  sw.innerHTML = '<button class="save" id="save-btn">Salva allenamento</button>';
  root.appendChild(sw);
  document.getElementById('save-btn').addEventListener('click', saveSession);
}

/* =========================================================
   SALVATAGGIO + RIEPILOGO
   ========================================================= */
async function saveSession(){
  const day = currentDay;
  const date = todayISO();

  let partial = false;
  progDay(day).exercises.forEach(baseExo=>{
    if(skipped[baseExo.id]) return;
    getWork(effExo(baseExo)).forEach(s=>{ if(isSetPartial(s)) partial = true; });
  });
  if(partial){ showToast('Completa il RIR di ogni serie iniziata.', true); return; }

  const priorBest = {}, hadHistory = {};
  progDay(day).exercises.forEach(baseExo=>{
    const exo = effExo(baseExo);
    priorBest[baseExo.id] = getBestE1rm(day, baseExo.id, variantOf(exo));
    hadHistory[baseExo.id] = entriesForVariant(day, exo).filter(e=>e.date!==todayISO()).length>0;
  });
  const swapNames = Object.keys(swaps).map(k=>swaps[k].name);

  let any = false;
  const prs = [];
  progDay(day).exercises.forEach(baseExo=>{
    if(skipped[baseExo.id]) return;
    const exo = effExo(baseExo);
    const work = getWork(exo);
    const wu = getWarmups(exo);
    const ws = [];
    let has = false, tb = 0;
    for(let i=0;i<exo.sets;i++){
      const s = work[i] || {w:0,r:0,rir:null};
      ws.push({w:s.w||0, r:s.r||0, rir:(s.rir===undefined?null:s.rir)});
      if((s.w||0)>0 && (s.r||0)>0){ has=true; tb = Math.max(tb, e1rm(s.w,s.r)); }
    }
    const wus = wu.filter(s=>s && s.w>0 && s.r>0).map(s=>({w:s.w, r:s.r}));
    if(has || wus.length>0) any = true;
    if(has || wus.length>0){
      const k = exKey(day, exo.id);
      if(!logData.entries[k]) logData.entries[k] = [];
      const arr = logData.entries[k];
      const entry = {date:date, work:ws, warmups:wus};
      if(swaps[baseExo.id]) entry.swappedTo = swaps[baseExo.id].name;
      if(arr.length && arr[arr.length-1].date===date) arr[arr.length-1] = entry;
      else arr.push(entry);
      if(arr.length>30) arr.shift();
    }
    const pb = priorBest[baseExo.id];
    if(hadHistory[baseExo.id] && tb>0 && (!pb || tb>pb.val)) prs.push(exo.name);
  });

  if(!any){ showToast('Registra almeno una serie completa.', true); return; }

  const tonnage = tonnageForDay(day);
  if(!logData.dayHistory[day]) logData.dayHistory[day] = [];
  const dh = logData.dayHistory[day];
  let prevTon = null;
  if(dh.length){
    prevTon = (dh[dh.length-1].date===date)
      ? (dh.length>1 ? dh[dh.length-2].tonnage : null)
      : dh[dh.length-1].tonnage;
  }
  const durStr = (function(ms){
    const t=Math.floor(ms/1000);
    const hh=String(Math.floor(t/3600)).padStart(2,'0');
    const mm=String(Math.floor((t%3600)/60)).padStart(2,'0');
    const ss=String(t%60).padStart(2,'0');
    return hh+':'+mm+':'+ss;
  })(activeWorkout ? (activeWorkout.elapsedMs + (activeWorkout.runningSince ? Date.now()-activeWorkout.runningSince : 0)) : 0);
  const readiness = activeWorkout ? (activeWorkout.readiness||null) : null;
  const prevEffort = (dh.filter(x=>x.date===date)[0]||{}).effort || null;
  if(dh.length && dh[dh.length-1].date===date) dh[dh.length-1] = {date:date, tonnage:tonnage, duration:durStr, readiness:readiness, effort:prevEffort};
  else dh.push({date:date, tonnage:tonnage, duration:durStr, readiness:readiness, effort:prevEffort});
  if(dh.length>30) dh.shift();

  const elapsed = activeWorkout ? (activeWorkout.elapsedMs + (activeWorkout.runningSince ? Date.now()-activeWorkout.runningSince : 0)) : 0;
  const setsDone = progDay(day).exercises.reduce((n,e)=> n + (skipped[e.id]?0:getWork(effExo(e)).filter(isSetDone).length), 0);

  const ok = await saveData();
  lastRecap = {day:day, tonnage:tonnage, prevTon:prevTon, elapsed:elapsed, prs:prs, setsDone:setsDone};
  restTimer = null;
  appView = 'recap';
  renderApp();
  if(!ok) showToast('Allenamento registrato, ma non salvato in modo permanente.', true);
}

function renderSwapSheet(){
  const root = document.getElementById('swap-sheet-root');
  if(!swapSheetFor){ root.innerHTML=''; return; }
  const base = progDay(currentDay).exercises.filter(e=>e.id===swapSheetFor)[0];
  if(!base){ root.innerHTML=''; return; }
  const alts = ALTERNATIVES[base.id] || [];
  const isSwapped = !!swaps[base.id];
  const isSkipped = !!skipped[base.id];

  let rows = '';
  if(isSwapped){
    rows += '<div class="sheet-row" data-act="restore"><div><div class="dsr-name">Ripristina '+base.name+'</div>'+
            '<div class="dsr-sub">torna all\u2019esercizio della scheda</div></div><div class="chevron">›</div></div>';
  }
  alts.forEach(a=>{
    const active = isSwapped && swaps[base.id].id===a.id;
    rows += '<div class="sheet-row'+(active?' row-active':'')+'" data-alt="'+a.id+'">'+
      '<div><div class="dsr-name">'+a.name+'</div>'+
      '<div class="dsr-sub">'+(a.iso?'isolamento':'multiarticolare')+' · scatti da '+fmtNum(a.inc)+'kg</div></div>'+
      '<div class="chevron">'+(active?'✓':'›')+'</div></div>';
  });
  if(alts.length===0 && !isSwapped){
    rows += '<div class="sheet-row" style="opacity:.5"><div class="dsr-name">Nessuna alternativa suggerita</div></div>';
  }
  rows += '<div class="sheet-row" data-act="skip"><div><div class="dsr-name">'+(isSkipped?'Rimetti in programma':'Salta oggi')+'</div>'+
          '<div class="dsr-sub">'+(isSkipped?'torna tra gli esercizi da fare':'non conta nel riepilogo')+'</div></div><div class="chevron">›</div></div>';

  root.innerHTML =
    '<div class="sheet-scrim" id="swap-scrim"></div>'+
    '<div class="day-sheet"><div class="sheet-handle"></div>'+
    '<div class="sheet-title">'+base.name+'</div>'+
    '<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">Vale solo per l\u2019allenamento di oggi. Lo storico resta legato allo slot della scheda.</div>'+
    rows+
    '<button class="sheet-cancel" id="swap-cancel">Annulla</button></div>';

  const close = ()=>{ swapSheetFor=null; renderApp(); };
  document.getElementById('swap-scrim').addEventListener('click', close);
  document.getElementById('swap-cancel').addEventListener('click', close);
  root.querySelectorAll('.sheet-row').forEach(r=>{
    r.addEventListener('click', ()=>{
      if(r.dataset.act==='restore'){ delete swaps[base.id]; }
      else if(r.dataset.act==='skip'){
        if(skipped[base.id]) delete skipped[base.id]; else skipped[base.id]=true;
      }
      else if(r.dataset.alt){
        const a = alts.filter(x=>x.id===r.dataset.alt)[0];
        if(a){ swaps[base.id] = a; delete skipped[base.id]; }
      }
      swapSheetFor = null;
      renderApp();
    });
  });
}


/* ===================== STORICO PER DATA ===================== */
function allSessions(){
  const out = [];
  Object.keys(logData.dayHistory||{}).forEach(day=>{
    (logData.dayHistory[day]||[]).forEach(h=>{
      out.push({date:h.date, day:day, tonnage:h.tonnage, duration:h.duration,
                effort:h.effort||null, readiness:h.readiness||null});
    });
  });
  out.sort((a,b)=> a.date < b.date ? 1 : (a.date > b.date ? -1 : 0));
  return out;
}
function sessionExercises(date, day){
  const out = [];
  progDay(day).exercises.forEach(exo=>{
    const e = getEntries(day, exo.id).filter(x=>x.date===date)[0];
    if(e) out.push({exo:exo, entry:e, name: e.swappedTo || exo.name});
  });
  return out;
}
/* Quanto hai spinto davvero in una sessione: media dei RIR registrati.
   E' un dato misurato, non un'impressione a fine allenamento. */
function sessionStats(date, day){
  let sets = 0, rirSum = 0, rirN = 0;
  progDay(day).exercises.forEach(exo=>{
    const e = getEntries(day, exo.id).filter(x=>x.date===date)[0];
    if(!e) return;
    (e.work||[]).forEach(st=>{
      if(!(st.w>0 && st.r>0)) return;
      sets++;
      if(st.rir!==null && st.rir!==undefined){ rirSum += st.rir; rirN++; }
    });
  });
  return { sets: sets, rir: rirN ? Math.round(rirSum/rirN*10)/10 : null };
}
function longDate(d){
  return new Date(d).toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

   STRUMENTI
   ========================================================= */
/* Export nello stesso formato dell'esportazione di Lyfta, cosi' il file
   puo' essere reimportato li' senza conversioni:
   Title,Date,Duration,Exercise,Superset id,Weight,Reps,Distance,Time,Set Type */
function csvCell(v){
  const t = String(v===null||v===undefined?'':v);
  return /[",\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
}
function buildLyftaCsv(){
  const rows = [[' Title','Date','Duration','Exercise','Superset id','Weight','Reps','Distance','Time','Set Type']];
  const byDate = {};
  Object.keys(PROGRAM).forEach(dayKey=>{
    progDay(dayKey).exercises.forEach(exo=>{
      getEntries(dayKey, exo.id).forEach(e=>{
        const k = e.date+'|'+dayKey;
        if(!byDate[k]) byDate[k] = {date:e.date, day:dayKey, items:[]};
        byDate[k].items.push({exo:exo, entry:e});
      });
    });
  });
  Object.keys(byDate).sort().forEach(k=>{
    const sess = byDate[k];
    const title = progDay(sess.day).label + ' workout';
    const stamp = sess.date + ' 12:00:00';
    const hist = (logData.dayHistory[sess.day]||[]).filter(x=>x.date===sess.date)[0];
    const dur = (hist && hist.duration) ? hist.duration : '01:00:00';
    sess.items.forEach(it=>{
      (it.entry.warmups||[]).forEach(wu=>{
        rows.push([title, stamp, dur, it.entry.swappedTo || it.exo.name, '', Number(wu.w).toFixed(3), wu.r, '', '', 'WARMUP_SET']);
      });
      (it.entry.work||[]).forEach(st=>{
        if(!(st.w>0) && !(st.r>0)) return;
        rows.push([title, stamp, dur, it.entry.swappedTo || it.exo.name, '', Number(st.w).toFixed(3), st.r, '', '', 'NORMAL_SET']);
      });
    });
  });
  return rows.map(r=>r.map(csvCell).join(',')).join('\n');
}
function downloadCsv(){
  const csv = buildLyftaCsv();
  const lines = csv.split('\n').length-1;
  if(lines<=0){ showToast('Non c\u2019è ancora nulla da esportare.', true); return; }
  try{
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'scheda-'+todayISO()+'.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast(lines+' serie esportate.');
  }catch(e){ showToast('Export non riuscito su questo dispositivo.', true); }
}

    '<button class="btn-pill danger-outline" id="t-reset" style="width:100%;">Azzera tutti i dati</button>'+
    '<div id="reset-confirm"></div>';
  container.appendChild(c);
  document.getElementById('t-export').addEventListener('click', downloadCsv);
  document.getElementById('t-reset').addEventListener('click', ()=>{
    const box = document.getElementById('reset-confirm');
    const sessions = Object.keys(logData.dayHistory||{}).reduce((n,k)=>n+(logData.dayHistory[k]||[]).length,0);
    if(box.innerHTML){ box.innerHTML=''; return; }
    box.innerHTML =
      '<div class="confirm-box">'+
        '<div class="confirm-title">Cancellare tutto lo storico?</div>'+
        '<div class="confirm-text">'+(sessions>0
            ? sessions+' allenamenti registrati andranno persi. L\u2019operazione non si può annullare: se ti servono, esportali prima.'
            : 'Non c\u2019è ancora nulla da cancellare.')+'</div>'+
        '<div class="confirm-actions">'+
          '<button class="btn-pill" id="reset-no">Annulla</button>'+
          '<button class="btn-pill danger-solid" id="reset-yes">Sì, cancella</button>'+
        '</div>'+
      '</div>';
    document.getElementById('reset-no').addEventListener('click', ()=>{ box.innerHTML=''; });
    document.getElementById('reset-yes').addEventListener('click', async ()=>{
      logData = {entries:{}, dayHistory:{}, meta:{}, config: logData.config};
      const ok = await saveData();
      showToast(ok?'Storico cancellato.':'Cancellati solo per questa sessione.', !ok);
      renderApp();
    });
  });
}

/* =========================================================
   EDITOR DELLA SCHEDA
   Tutto quello che l'app calcola parte da logData.config: qui lo si
   modifica. Lo storico e' legato alla coppia giorno+id esercizio, quindi
   rinominare e' sempre sicuro; cancellare invece stacca le sessioni gia'
   registrate dalla scheda, e la conferma lo dice esplicitamente.
   ========================================================= */
let cfgSaveTimer = null;
function cfgChanged(rerender){
  applyConfig();
  if(cfgSaveTimer) clearTimeout(cfgSaveTimer);
  cfgSaveTimer = setTimeout(function(){ saveData(); }, 400);
  if(rerender !== false) renderApp();
}
function cfgDay(key){
  return (logData.config.days||[]).filter(function(d){ return d.key===key; })[0] || null;
}
function cfgExo(dayKey, id){
  const d = cfgDay(dayKey);
  return d ? (d.exercises.filter(function(e){ return e.id===id; })[0] || null) : null;
}
function allDayKeys(){ return (logData.config.days||[]).map(function(d){ return d.key; }); }
function allExoIds(){
  const out = [];
  (logData.config.days||[]).forEach(function(d){
    d.exercises.forEach(function(e){ out.push(e.id); });
  });
  const alts = logData.config.alternatives || {};
  Object.keys(alts).forEach(function(k){
    out.push(k);
    (alts[k]||[]).forEach(function(a){ out.push(a.id); });
  });
  return out;
}
/* Gli id non cambiano mai dopo la creazione: sono la chiave dello storico.
   Vengono generati una volta sola, dal nome iniziale, resi unici col suffisso. */
function slugId(name, taken, fallback){
  let base = String(name || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  if(!base) base = fallback;
  let id = base, n = 2;
  while(taken.indexOf(id) >= 0){ id = base + '_' + n; n++; }
  return id;
}
function moveItem(arr, i, delta){
  const j = i + delta;
  if(j < 0 || j >= arr.length) return;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
}
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }
function fmtSecs(s){
  s = Math.max(0, Math.round(s));
  return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0');
}
/* I nomi finiscono dentro innerHTML in mezza app, sempre come testo e mai
   dentro un attributo: togliere le parentesi angolari mentre si scrive evita
   di dover ricordare l'escape in quindici punti diversi. */
function cleanName(v){ return String(v).replace(/[<>]/g, '').slice(0, 48); }

function edCard(title){
  const c = document.createElement('div');
  c.className = 'card';
  if(title){
    const l = document.createElement('div');
    l.className = 'section-label';
    l.textContent = title;
    c.appendChild(l);
  }
  return c;
}
function edFieldRow(label, control, hint){
  const row = document.createElement('div');
  row.className = 'ed-field';
  const l = document.createElement('div');
  l.className = 'ed-label';
  const t = document.createElement('div');
  t.textContent = label;
  l.appendChild(t);
  if(hint){
    const h = document.createElement('div');
    h.className = 'ed-hint';
    h.textContent = hint;
    l.appendChild(h);
  }
  row.appendChild(l);
  row.appendChild(control);
  return row;
}
function edTextInput(value, placeholder, onInput){
  const i = document.createElement('input');
  i.className = 'ed-input wide';
  i.type = 'text';
  i.value = value || '';
  i.placeholder = placeholder || '';
  i.addEventListener('input', function(){
    const c = cleanName(i.value);
    if(c !== i.value) i.value = c;
    onInput(c);
  });
  return i;
}
function edStepper(value, min, max, step, fmt, onChange, disabled){
  const wrap = document.createElement('div');
  wrap.className = 'ed-step';
  let v = value;
  const minus = document.createElement('button');
  minus.className = 'ed-btn'; minus.textContent = '−';
  const num = document.createElement('div');
  num.className = 'ed-num'; num.textContent = fmt(v);
  const plus = document.createElement('button');
  plus.className = 'ed-btn'; plus.textContent = '+';
  function bump(d){
    const nv = Math.round((v + d) * 1000) / 1000;
    if(nv < min || nv > max) return;
    v = nv;
    num.textContent = fmt(v);
    onChange(v);
  }
  if(disabled){ minus.disabled = true; plus.disabled = true; }
  else {
    minus.addEventListener('click', function(){ bump(-step); });
    plus.addEventListener('click', function(){ bump(step); });
  }
  wrap.appendChild(minus); wrap.appendChild(num); wrap.appendChild(plus);
  return wrap;
}
function edToggle(on, onChange, disabled){
  const b = document.createElement('button');
  b.className = 'ed-toggle' + (on ? ' on' : '');
  if(disabled){ b.disabled = true; b.style.opacity = '.3'; return b; }
  b.addEventListener('click', function(){
    on = !on;
    b.className = 'ed-toggle' + (on ? ' on' : '');
    onChange(on);
  });
  return b;
}
function edListRow(name, sub, opts){
  const row = document.createElement('div');
  row.className = 'ed-row';
  const main = document.createElement('div');
  main.className = 'ed-main';
  const n = document.createElement('div');
  n.className = 'ed-name'; n.textContent = name || '—';
  const s = document.createElement('div');
  s.className = 'ed-sub'; s.textContent = sub || '';
  main.appendChild(n); main.appendChild(s);
  if(opts.onOpen) main.addEventListener('click', opts.onOpen);
  row.appendChild(main);
  if(opts.reorder){
    const up = document.createElement('button');
    up.className = 'ed-btn'; up.textContent = '↑';
    if(!opts.onUp || opts.locked) up.disabled = true;
    else up.addEventListener('click', opts.onUp);
    row.appendChild(up);
    const dn = document.createElement('button');
    dn.className = 'ed-btn'; dn.textContent = '↓';
    if(!opts.onDown || opts.locked) dn.disabled = true;
    else dn.addEventListener('click', opts.onDown);
    row.appendChild(dn);
  }
  if(opts.onOpen){
    const ch = document.createElement('div');
    ch.className = 'chevron'; ch.textContent = '›';
    ch.addEventListener('click', opts.onOpen);
    row.appendChild(ch);
  }
  return row;
}
function edAddButton(label, locked, onClick){
  const b = document.createElement('button');
  b.className = 'btn-pill ed-add';
  b.textContent = label;
  if(locked) b.disabled = true;
  else b.addEventListener('click', onClick);
  return b;
}
function edNote(container, text){
  const n = document.createElement('div');
  n.className = 'ed-note';
  n.textContent = text;
  container.appendChild(n);
}
/* Conferma in linea, stesso schema del "azzera tutti i dati". */
function edConfirmBox(title, text, confirmLabel, onYes){
  const box = document.createElement('div');
  box.className = 'confirm-box';
  const t = document.createElement('div');
  t.className = 'confirm-title'; t.textContent = title;
  const x = document.createElement('div');
  x.className = 'confirm-text'; x.textContent = text;
  const a = document.createElement('div');
  a.className = 'confirm-actions';
  const no = document.createElement('button');
  no.className = 'btn-pill'; no.textContent = 'Annulla';
  no.addEventListener('click', function(){ edConfirm = null; renderApp(); });
  const yes = document.createElement('button');
  yes.className = 'btn-pill danger-solid'; yes.textContent = confirmLabel;
  yes.addEventListener('click', onYes);
  a.appendChild(no); a.appendChild(yes);
  box.appendChild(t); box.appendChild(x); box.appendChild(a);
  return box;
}
function edDangerButton(label, onClick){
  const b = document.createElement('button');
  b.className = 'btn-pill danger-outline';
  b.style.cssText = 'width:100%;';
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

/* --------------------------- schermate --------------------------- */
function renderEditor(){
  const root = document.getElementById('screen-root');
  root.innerHTML = '';

  const back = document.createElement('button');
  back.className = 'btn-pill';
  back.style.cssText = 'margin-bottom:14px;';
  back.textContent = (edExo || edDay || edSection) ? '‹ Indietro' : '‹ Torna alla dashboard';
  back.addEventListener('click', function(){
    edConfirm = null;
    if(edExo) edExo = null;
    else if(edDay) edDay = null;
    else if(edSection) edSection = null;
    else appView = 'dashboard';
    scrollTopWanted = true;
    renderApp();
  });
  root.appendChild(back);

  if(activeWorkout){
    const w = document.createElement('div');
    w.className = 'ed-warn';
    w.textContent = 'Allenamento in corso: la struttura della scheda resta bloccata. '
      + 'Chiudi o elimina la sessione aperta per aggiungere, spostare o togliere esercizi — '
      + 'cambiarla adesso sposterebbe le serie già inserite. Recuperi e parametri di calcolo si possono comunque toccare.';
    root.appendChild(w);
  }

  if(edSection === 'calcolo') renderEditorTuning(root);
  else if(edSection === 'recuperi') renderEditorRest(root);
  else if(edExo) renderEditorExercise(root);
  else if(edDay) renderEditorDay(root);
  else renderEditorHome(root);
}

function renderEditorHome(root){
  const locked = !!activeWorkout;
  const days = logData.config.days;

  const c = edCard('Giorni');
  days.forEach(function(d, i){
    const n = d.exercises.length;
    c.appendChild(edListRow(d.label, n + (n === 1 ? ' esercizio' : ' esercizi'), {
      reorder: true,
      locked: locked,
      onOpen: function(){ edDay = d.key; edConfirm = null; scrollTopWanted = true; renderApp(); },
      onUp: i > 0 ? function(){ moveItem(days, i, -1); cfgChanged(); } : null,
      onDown: i < days.length - 1 ? function(){ moveItem(days, i, 1); cfgChanged(); } : null
    }));
  });
  c.appendChild(edAddButton('+ Aggiungi giorno', locked, function(){
    const key = slugId('giorno', allDayKeys(), 'giorno');
    days.push({ key: key, label: 'Nuovo giorno', short: 'Nuovo', exercises: [] });
    edDay = key;
    scrollTopWanted = true;
    cfgChanged();
  }));
  root.appendChild(c);

  const c2 = edCard('Calcolo');
  c2.appendChild(edListRow('Carichi e progressione',
    'Quanto sale il peso, scarico, riscaldamento', {
    onOpen: function(){ edSection = 'calcolo'; edConfirm = null; scrollTopWanted = true; renderApp(); }
  }));
  c2.appendChild(edListRow('Tempi di recupero',
    'Valori predefiniti per multiarticolari, isolamenti e riscaldamento', {
    onOpen: function(){ edSection = 'recuperi'; edConfirm = null; scrollTopWanted = true; renderApp(); }
  }));
  root.appendChild(c2);

  const c3 = edCard('Ripristino');
  if(edConfirm === 'resetProgram'){
    c3.appendChild(edConfirmBox(
      'Tornare alla scheda originale?',
      'Giorni, esercizi, alternative e parametri tornano come all’inizio. Lo storico degli allenamenti non viene toccato, ma le sessioni registrate su esercizi che non esistono nella scheda originale spariranno dalle statistiche.',
      'Sì, ripristina',
      function(){
        logData.config = defaultConfig();
        edConfirm = null; edDay = null; edExo = null;
        cfgChanged();
        showToast('Scheda ripristinata.');
      }));
  } else {
    c3.appendChild(edDangerButton('Ripristina la scheda predefinita', function(){
      edConfirm = 'resetProgram'; renderApp();
    }));
  }
  root.appendChild(c3);

  edNote(root, 'Lo storico è legato allo slot, non al nome: puoi rinominare un esercizio quando vuoi senza perdere niente. '
    + 'Cancellarlo invece lo stacca dalle statistiche, anche se i dati restano salvati.');
}

function renderEditorDay(root){
  const locked = !!activeWorkout;
  const d = cfgDay(edDay);
  if(!d){ edDay = null; renderEditorHome(root); return; }
  const days = logData.config.days;

  const c = edCard('Giorno');
  c.appendChild(edFieldRow('Nome',
    edTextInput(d.label, 'Legs', function(v){ d.label = v; cfgChanged(false); }),
    'Come compare in dashboard, nello storico e nell’export.'));
  c.appendChild(edFieldRow('Sigla',
    edTextInput(d.short, 'Legs', function(v){ d.short = v; cfgChanged(false); }),
    'Versione corta, per i pulsanti stretti.'));
  root.appendChild(c);

  const c2 = edCard('Esercizi');
  if(!d.exercises.length){
    const empty = document.createElement('div');
    empty.className = 'ed-note';
    empty.style.margin = '0 2px 4px';
    empty.textContent = 'Ancora nessun esercizio in questo giorno.';
    c2.appendChild(empty);
  }
  d.exercises.forEach(function(e, i){
    const rest = e.rest > 0 ? fmtSecs(e.rest) : fmtSecs(restSecondsFor({ iso: e.iso, max: e.max, rest: 0 }, false));
    const sub = e.sets + ' × ' + e.min + '-' + e.max + ' rip · scatti da ' + fmtNum(e.inc) + 'kg · rec. ' + rest;
    c2.appendChild(edListRow(e.name, sub, {
      reorder: true,
      locked: locked,
      onOpen: function(){ edExo = e.id; edConfirm = null; scrollTopWanted = true; renderApp(); },
      onUp: i > 0 ? function(){ moveItem(d.exercises, i, -1); cfgChanged(); } : null,
      onDown: i < d.exercises.length - 1 ? function(){ moveItem(d.exercises, i, 1); cfgChanged(); } : null
    }));
  });
  c2.appendChild(edAddButton('+ Aggiungi esercizio', locked, function(){
    const id = slugId('nuovo esercizio', allExoIds(), 'esercizio');
    d.exercises.push({ id: id, name: 'Nuovo esercizio', sets: 3, min: 8, max: 10, iso: false, inc: 2.5, rest: 0 });
    edExo = id;
    scrollTopWanted = true;
    cfgChanged();
  }));
  root.appendChild(c2);

  const c3 = edCard(null);
  if(days.length <= 1){
    edNote(c3, 'La scheda deve avere almeno un giorno, quindi questo non si può eliminare.');
  } else if(edConfirm === 'day'){
    const sessions = (logData.dayHistory[d.key] || []).length;
    c3.appendChild(edConfirmBox(

        ? plural(sessions, 'sessione registrata', 'sessioni registrate') + ' su questo giorno '
          + (sessions === 1 ? 'sparirà' : 'spariranno') + ' da statistiche, grafici e storico.'
        : 'Nessuna sessione registrata su questo giorno.')
      + ' I dati restano nel salvataggio ma non saranno più raggiungibili dall’app.',
      'Sì, elimina',
      function(){
        d.exercises.forEach(function(e){ delete logData.config.alternatives[e.id]; });
        const i = days.indexOf(d);
        days.splice(i, 1);
        edConfirm = null; edDay = null; edExo = null;
        cfgChanged();
      }));
  } else {
    const b = edDangerButton('Elimina questo giorno', function(){ edConfirm = 'day'; renderApp(); });
    if(locked) b.disabled = true;
    c3.appendChild(b);
  }
  root.appendChild(c3);
}

          + (sessions === 1 ? 'sparirà' : 'spariranno') + ' dai grafici e dallo storico.'
        : 'Nessuna sessione registrata su questo esercizio.')
      + ' Se ti serve solo cambiare movimento, rinominalo invece di cancellarlo: così la progressione continua da dove sei.',
      'Sì, elimina',
      function(){
        delete logData.config.alternatives[e.id];
        d.exercises.splice(d.exercises.indexOf(e), 1);

        cfgChanged();

  root.appendChild(c3);

  const c4 = edCard('Riscaldamento');
  c4.appendChild(edFieldRow('Salto massimo tra step',
    edStepper(t.maxJumpKg, 10, 120, 5, function(v){ return fmtNum(v) + ' kg'; },
      function(v){ t.maxJumpKg = v; cfgChanged(false); }),
    'Più basso è, più serie di avvicinamento vengono proposte sui carichi alti.'));
  c4.appendChild(edFieldRow('Step massimi',
    edStepper(t.maxWarmups, 1, 10, 1, String, function(v){ t.maxWarmups = v; cfgChanged(false); }),
    'Tetto al numero di serie di riscaldamento, qualunque sia il carico.'));
  root.appendChild(c4);

  const c5 = edCard(null);
  if(edConfirm === 'resetTuning'){
    c5.appendChild(edConfirmBox(
      'Tornare ai valori consigliati?',
      'Progressione, scarico, riscaldamento e tempi di recupero tornano ai valori di partenza. La scheda non viene toccata.',
      'Sì, ripristina',
      function(){
        logData.config.tuning = cloneCfg(DEFAULT_TUNING);
        edConfirm = null;
        cfgChanged();
        showToast('Valori ripristinati.');
      }));
  } else {
    c5.appendChild(edDangerButton('Ripristina i valori consigliati', function(){
      edConfirm = 'resetTuning'; renderApp();
    }));
  }
  root.appendChild(c5);
}

function renderEditorRest(root){
  const t = logData.config.tuning;
  const row = function(card, label, key, hint, min, max){
    card.appendChild(edFieldRow(label,
      edStepper(t[key], min, max, 15, fmtSecs, function(v){ t[key] = v; cfgChanged(false); }),
      hint));
  };

  const c = edCard('Serie di lavoro');
  row(c, 'Multiarticolare pesante', 'restCompoundHeavy', 'Panca, squat, stacco e simili con range fino a 8 ripetizioni.', 30, 600);
  row(c, 'Multiarticolare', 'restCompound', 'Stessi movimenti con range oltre le 8 ripetizioni.', 30, 600);
  row(c, 'Isolamento', 'restIso', 'Curl, estensioni, alzate con range fino a 14 ripetizioni.', 15, 600);
  row(c, 'Isolamento ad alte ripetizioni', 'restIsoHighRep', 'Da 15 ripetizioni in su.', 15, 600);
  root.appendChild(c);

  const c2 = edCard('Riscaldamento');
  row(c2, 'Tra le serie di avvicinamento', 'restWarmup', '', 15, 300);
  root.appendChild(c2);

  edNote(root, 'Questi sono i valori di partenza. Un singolo esercizio può avere il suo tempo fisso: '
    + 'lo trovi nella sua scheda, sotto Recupero.');
  edNote(root, 'I riferimenti dietro ai valori originali: Schoenfeld 2016 (3 minuti battono 1 minuto su forza e ipertrofia '
    + 'negli allenati) e Grgic 2018 (almeno 2 minuti sui multiarticolari, 60-90 secondi sui monoarticolari).');
}

/* =========================================================
   ROOT
   ========================================================= */
function renderApp(){
  // l'app ridisegna tutto a ogni interazione: senza questo, ogni tocco
  // riporterebbe la pagina in cima e la striscia degli esercizi all'inizio
  const scrollY = window.scrollY;
  const chips = document.querySelector('.ex-chips');
  const chipScroll = chips ? chips.scrollLeft : null;

  renderHeader();
  if(appView==='dashboard') renderDashboard();
  else if(appView==='recap') renderRecap();
  else if(appView==='history') renderHistory();
  else if(appView==='editor') renderEditor();
  else renderWorkout();
  renderBottomBar();
  renderSwapSheet();
  renderKeypad();
  applyHeaderOffset();

  const chips2 = document.querySelector('.ex-chips');
  if(chips2){
    if(chipScrollWanted!==null){ chipScrollWanted=null; scrollChipIntoView(); }
    else if(chipScroll!==null) chips2.scrollLeft = chipScroll;
  }
  try{ window.scrollTo(0, scrollTopWanted ? 0 : scrollY); }catch(e){}
  scrollTopWanted = false;

  // quando cambia il campo selezionato, porta la sua riga sopra la tastiera
  const key = activeField ? (activeField.exoId+'|'+activeField.kind+'|'+activeField.index) : null;
  if(key !== lastFieldRowKey){
    lastFieldRowKey = key;
    if(key) requestAnimationFrame(scrollActiveRowIntoView);
  }
}
let lastFieldRowKey = null;
function scrollActiveRowIntoView(){
  const cell = document.querySelector('.cell-active');
  if(!cell) return;
  const row = cell.closest ? (cell.closest('.set-row') || cell) : cell;
  const kp = document.querySelector('.keypad');
  const kpH = kp ? kp.getBoundingClientRect().height : 0;
  const top = document.querySelector('.workout-top');
  const topH = top ? top.getBoundingClientRect().height : 0;
  const rect = row.getBoundingClientRect();
  const vh = window.innerHeight || 800;
  const bottomLimit = vh - kpH - 28;   // un po' sopra la tastiera
  const topLimit = topH + 16;
  let delta = 0;
  if(rect.bottom > bottomLimit) delta = rect.bottom - bottomLimit;
  else if(rect.top < topLimit) delta = rect.top - topLimit;
  if(delta === 0) return;
  try{ window.scrollBy({top:delta, behavior:'smooth'}); }
  catch(e){ try{ window.scrollTo(0, (window.scrollY||0)+delta); }catch(e2){} }
}
let chipScrollWanted = null;
function scrollChipIntoView(){
  const wrap = document.querySelector('.ex-chips');
  if(!wrap) return;
  const active = wrap.querySelector('.ex-chip.active');
  if(!active) return;
  const target = active.offsetLeft - (wrap.clientWidth - active.offsetWidth)/2;
  wrap.scrollLeft = Math.max(0, target);
}

// All'avvio, se non c'e' nessuno storico, l'app parte con dati di esempio gia'
// caricati: cosi' e' subito navigabile e il coach ha qualcosa da dire, senza
// dipendere da un salvataggio che in alcuni contesti non e' disponibile.
['pointerdown','touchstart','click','keydown'].forEach(ev=>{
  document.addEventListener(ev, unlockAudio, {passive:true});
});

loadData().then(renderApp);
</script>
