/* ===================== STORICO PER DATA ===================== */
function allSessions(){
  const out = [];
  Object.keys(logData.dayHistory||{}).forEach(day=>{
    (logData.dayHistory[day]||[]).forEach(h=>{
      out.push({date:h.date, day:day, tonnage:h.tonnage, duration:h.duration,
                effort:h.effort||null, readiness:h.readiness||null});
    });
  });
  out.sort((a,b)=> a.date < b.date ? 1 : (a.date > b.date ? -1 : 0));
  return out;
}
function sessionExercises(date, day){
  const out = [];
  PROGRAM[day].exercises.forEach(exo=>{
    const e = getEntries(day, exo.id).filter(x=>x.date===date)[0];
    if(e) out.push({exo:exo, entry:e, name: e.swappedTo || exo.name});
  });
  return out;
}
function longDate(d){
  return new Date(d).toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function effortLabel(v){ const o = EFFORT.filter(x=>x.v===v)[0]; return o?o.label:null; }
function readinessLabel(v){ const o = READINESS.filter(x=>x.v===v)[0]; return o?o.label:null; }

function renderHistory(){
  const root = document.getElementById('screen-root');
  root.innerHTML='';

  const back = document.createElement('button');
  back.className = 'btn-pill';
  back.style.cssText = 'margin-bottom:14px;';
  back.textContent = '‹ Torna alla scheda';
  back.addEventListener('click', ()=>{
    if(historyOpen){ historyOpen=null; activeField=null; keypadBuffer=''; }
    else appView='dashboard';
    renderApp();
  });
  root.appendChild(back);

  if(historyOpen){ renderHistoryDetail(root); return; }

  const sessions = allSessions();
  if(sessions.length===0){
    const c = document.createElement('div');
    c.className='card';
    c.innerHTML = '<div class="chart-empty">Nessun allenamento registrato.</div>';
    root.appendChild(c);
    return;
  }

  // riepilogo complessivo in cima
  const totKg = sessions.reduce((n,x)=>n+(x.tonnage||0),0);
  const head = document.createElement('div');
  head.className='stat-strip';
  head.innerHTML =
    '<div class="stat-cell"><div class="stat-val">'+sessions.length+'</div><div class="stat-lab">Allenamenti</div></div>'+
    '<div class="stat-cell"><div class="stat-val">'+Math.round(totKg/1000)+'k</div><div class="stat-lab">kg totali</div></div>'+
    '<div class="stat-cell"><div class="stat-val">'+new Set(sessions.map(x=>x.day)).size+'</div><div class="stat-lab">Tipi</div></div>';
  root.appendChild(head);

  const exp = document.createElement('button');
  exp.className='btn-pill';
  exp.style.cssText='width:100%;margin-bottom:16px;';
  exp.id='hist-export';
  exp.textContent='Esporta CSV';
  exp.addEventListener('click', downloadCsv);
  root.appendChild(exp);

  // raggruppati per mese, una sola card per mese
  const months = [];
  sessions.forEach(sess=>{
    const key = sess.date.slice(0,7);
    let m = months.filter(x=>x.key===key)[0];
    if(!m){ m = {key:key, label:new Date(sess.date).toLocaleDateString('it-IT',{month:'long', year:'numeric'}), items:[]}; months.push(m); }
    m.items.push(sess);
  });

  months.forEach(m=>{
    const kg = m.items.reduce((n,x)=>n+(x.tonnage||0),0);
    const lab = document.createElement('div');
    lab.className='month-head';
    lab.innerHTML = '<span class="month-name">'+m.label+'</span>'+
                    '<span class="month-sum">'+m.items.length+' · '+kg.toLocaleString('it-IT')+' kg</span>';
    root.appendChild(lab);

    const card = document.createElement('div');
    card.className='card hist-card';
    m.items.forEach(sess=>{
      const dt = new Date(sess.date);
      const row = document.createElement('div');
      row.className='hist-line';
      row.innerHTML =
        '<span class="hl-date">'+String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'</span>'+
        '<span class="hl-day">'+PROGRAM[sess.day].label+'</span>'+
        '<span class="hl-kg">'+(sess.tonnage||0).toLocaleString('it-IT')+'</span>'+
        (sess.effort ? '<span class="hl-dot e'+sess.effort+'" title="'+effortLabel(sess.effort)+'"></span>' : '<span class="hl-dot empty"></span>')+
        '<span class="chevron">›</span>';
      row.addEventListener('click', ()=>{ historyOpen={date:sess.date, day:sess.day}; histExpanded={}; renderApp(); });
      card.appendChild(row);
    });
    root.appendChild(card);
  });

  const legend = document.createElement('div');
  legend.className='install-tip';
  legend.textContent = 'Il pallino indica quanto è stata dura: più è pieno, più hai spinto.';
  root.appendChild(legend);
}

function renderHistoryDetail(root){
  const {date, day} = historyOpen;
  const sess = (logData.dayHistory[day]||[]).filter(x=>x.date===date)[0];
  const items = sessionExercises(date, day);

  const head = document.createElement('div');
  head.className='card';
  const bits = [];
  if(sess){
    bits.push((sess.tonnage||0).toLocaleString('it-IT')+' kg');
    if(sess.duration) bits.push(sess.duration);
  }
  const tags = [];
  if(sess && sess.readiness) tags.push('<span class="hist-badge">prima: '+readinessLabel(sess.readiness)+'</span>');
  if(sess && sess.effort) tags.push('<span class="hist-badge">dopo: '+effortLabel(sess.effort)+'</span>');
  head.innerHTML =
    '<div class="section-label">'+PROGRAM[day].label+'</div>'+
    '<div class="det-date">'+longDate(date)+'</div>'+
    '<div class="hist-sub">'+bits.join(' · ')+'</div>'+
    (tags.length ? '<div style="margin-top:8px;">'+tags.join(' ')+'</div>' : '');
  root.appendChild(head);

  items.forEach(it=>{
    const sets = (it.entry.work||[]).filter(st=>st.w>0 || st.r>0);
    const wus  = (it.entry.warmups||[]).filter(st=>st.w>0 || st.r>0);
    const open = !!histExpanded[it.exo.id];

    const c = document.createElement('div');
    c.className='card det-ex'+(open?' open':'');

    // riassunto compatto: quante serie, da che peso a che peso, la migliore
    let best = null;
    sets.forEach(st=>{ const v=e1rmOf(st); if(!best || v>best.v) best={v:v, w:st.w, r:st.r}; });
    const wRange = sets.length ? (sets[0].w===sets[sets.length-1].w
        ? fmtNum(sets[0].w)+'kg'
        : fmtNum(sets[0].w)+'→'+fmtNum(sets[sets.length-1].w)+'kg') : '—';
    const summary = sets.length
      ? sets.length+' serie · '+wRange+(best ? ' · top '+fmtNum(best.w)+'×'+best.r : '')
      : 'nessuna serie';

    const hd = document.createElement('div');
    hd.className='det-head';
    hd.innerHTML =
      '<div style="min-width:0;flex:1;">'+
        '<div class="det-name">'+it.name+(it.entry.swappedTo?'<span class="swap-badge">sostituito</span>':'')+'</div>'+
        '<div class="det-sum">'+summary+(wus.length?' · '+wus.length+' warmup':'')+'</div>'+
      '</div><div class="chevron">'+(open?'−':'+')+'</div>';
    hd.addEventListener('click', ()=>{ histExpanded[it.exo.id] = !open; renderApp(); });
    c.appendChild(hd);

    if(open){
      const labels = document.createElement('div');
      labels.className='col-labels';
      labels.style.marginTop='12px';
      labels.innerHTML='<span>Set</span><span>Kg</span><span>Rip</span><span>RIR</span><span></span>';
      c.appendChild(labels);
      wus.forEach((wu,wi)=>{
        const row = document.createElement('div');
        row.className='set-row';
        row.innerHTML = '<div class="set-idx">W'+(wi+1)+'</div>';
        row.appendChild(makeHistCell(day, it.exo.id, date, 'wu', wi, 'w', wu.w));
        row.appendChild(makeHistCell(day, it.exo.id, date, 'wu', wi, 'r', wu.r));
        row.appendChild(document.createElement('div'));
        row.appendChild(document.createElement('div'));
        c.appendChild(row);
      });
      (it.entry.work||[]).forEach((st,si)=>{
        if(!(st.w>0) && !(st.r>0)) return;
        const row = document.createElement('div');
        row.className='set-row';
        row.innerHTML = '<div class="set-idx">'+(si+1)+'</div>';
        row.appendChild(makeHistCell(day, it.exo.id, date, 'work', si, 'w', st.w));
        row.appendChild(makeHistCell(day, it.exo.id, date, 'work', si, 'r', st.r));
        const rirBox = document.createElement('div');
        rirBox.className='rir-cell';
        rirBox.textContent = (st.rir===null||st.rir===undefined)?'–':(st.rir===4?'4+':String(st.rir));
        row.appendChild(rirBox);
        row.appendChild(document.createElement('div'));
        c.appendChild(row);
      });
      const tip = document.createElement('div');
      tip.className='det-tip';
      tip.textContent = 'Tocca un valore per correggerlo.';
      c.appendChild(tip);
    }
    root.appendChild(c);
  });

  const del = document.createElement('div');
  del.className='card';
  del.innerHTML = '<button class="btn-pill danger-outline" id="hist-del" style="width:100%;">Elimina questo allenamento</button><div id="hist-del-confirm"></div>';
  root.appendChild(del);
  document.getElementById('hist-del').addEventListener('click', ()=>{
    const box = document.getElementById('hist-del-confirm');
    if(box.innerHTML){ box.innerHTML=''; return; }
    box.innerHTML =
      '<div class="confirm-box"><div class="confirm-title">Eliminare l\u2019allenamento del '+longDate(date)+'?</div>'+
      '<div class="confirm-text">Sparirà dallo storico e dai grafici. Non si può annullare.</div>'+
      '<div class="confirm-actions"><button class="btn-pill" id="hd-no">Annulla</button>'+
      '<button class="btn-pill danger-solid" id="hd-yes">Elimina</button></div></div>';
    document.getElementById('hd-no').addEventListener('click', ()=>{ box.innerHTML=''; });
    document.getElementById('hd-yes').addEventListener('click', async ()=>{
      PROGRAM[day].exercises.forEach(exo=>{
        const k = exKey(day, exo.id);
        if(logData.entries[k]) logData.entries[k] = logData.entries[k].filter(e=>e.date!==date);
      });
      logData.dayHistory[day] = (logData.dayHistory[day]||[]).filter(x=>x.date!==date);
      historyOpen = null; activeField = null; keypadBuffer='';
      await saveData();
      showToast('Allenamento eliminato.');
      renderApp();
    });
  });
}


function makeHistCell(day, exoId, date, kind, index, field, value){
  const cell = document.createElement('div');
  const f = activeField;
  const isActive = f && f.scope==='hist' && f.day===day && f.exoId===exoId && f.date===date
                   && f.kind===kind && f.index===index && f.field===field;
  cell.className = 'cell'+(isActive?' cell-active':'');
  if(isActive){
    cell.innerHTML = '<span>'+(keypadBuffer===''?'':keypadBuffer.replace('.', ','))+'</span><span class="caret"></span>';
  } else {
    cell.textContent = field==='w' ? fmtNum(value) : String(value);
  }
  cell.addEventListener('click', ()=>{
    if(activeField) commitBuffer();
    activeField = {scope:'hist', day:day, exoId:exoId, date:date, kind:kind, index:index, field:field};
    const cv = currentFieldValue();
    keypadBuffer = (cv==='0') ? '' : cv;
    renderApp();
  });
  return cell;
}

function renderDaySheet(){
  const root = document.getElementById('day-sheet-root');
  if(!daySheetOpen){ root.innerHTML=''; return; }
  let rows = '';
  Object.keys(PROGRAM).forEach(k=>{
    const h = logData.dayHistory[k] || [];
    const last = h.length ? h[h.length-1].date : null;

      '<div><div class="dsr-name">'+PROGRAM[k].label+'</div><div class="dsr-sub">'+daysSinceLabel(last)+' · '+PROGRAM[k].exercises.length+' esercizi</div></div>'+
      '<div class="chevron">›</div></div>';

    r.addEventListener('click', ()=>{ daySheetOpen=false; askReadiness(r.dataset.day); });
  });
}

/* =========================================================
   STRUMENTI
   ========================================================= */
/* Export nello stesso formato dell'esportazione di Lyfta, cosi' il file
   puo' essere reimportato li' senza conversioni:
   Title,Date,Duration,Exercise,Superset id,Weight,Reps,Distance,Time,Set Type */
function csvCell(v){
  const t = String(v===null||v===undefined?'':v);
  return /[",\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
}
function buildLyftaCsv(){
  const rows = [[' Title','Date','Duration','Exercise','Superset id','Weight','Reps','Distance','Time','Set Type']];
  const byDate = {};
  Object.keys(PROGRAM).forEach(dayKey=>{
    PROGRAM[dayKey].exercises.forEach(exo=>{
      getEntries(dayKey, exo.id).forEach(e=>{
        const k = e.date+'|'+dayKey;
        if(!byDate[k]) byDate[k] = {date:e.date, day:dayKey, items:[]};
        byDate[k].items.push({exo:exo, entry:e});
      });
    });
  });
  Object.keys(byDate).sort().forEach(k=>{
    const sess = byDate[k];
    const title = PROGRAM[sess.day].label + ' workout';
    const stamp = sess.date + ' 12:00:00';
    const hist = (logData.dayHistory[sess.day]||[]).filter(x=>x.date===sess.date)[0];
    const dur = (hist && hist.duration) ? hist.duration : '01:00:00';
    sess.items.forEach(it=>{
      (it.entry.warmups||[]).forEach(wu=>{
        rows.push([title, stamp, dur, it.entry.swappedTo || it.exo.name, '', Number(wu.w).toFixed(3), wu.r, '', '', 'WARMUP_SET']);
      });
      (it.entry.work||[]).forEach(st=>{
        if(!(st.w>0) && !(st.r>0)) return;
        rows.push([title, stamp, dur, it.entry.swappedTo || it.exo.name, '', Number(st.w).toFixed(3), st.r, '', '', 'NORMAL_SET']);
      });
    });
  });
  return rows.map(r=>r.map(csvCell).join(',')).join('\n');
}
function downloadCsv(){
  const csv = buildLyftaCsv();
  const lines = csv.split('\n').length-1;
  if(lines<=0){ showToast('Non c\u2019è ancora nulla da esportare.', true); return; }
  try{
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'scheda-'+todayISO()+'.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast(lines+' serie esportate.');
  }catch(e){ showToast('Export non riuscito su questo dispositivo.', true); }
}

  const c = document.createElement('div');

    '<button class="btn-pill danger-outline" id="t-reset" style="width:100%;">Azzera tutti i dati</button>'+
    '<div id="reset-confirm"></div>';

    box.innerHTML =

            : 'Non c\u2019è ancora nulla da cancellare.')+'</div>'+
        '<div class="confirm-actions">'+
          '<button class="btn-pill" id="reset-no">Annulla</button>'+
          '<button class="btn-pill danger-solid" id="reset-yes">Sì, cancella</button>'+
        '</div>'+
      '</div>';
    document.getElementById('reset-no').addEventListener('click', ()=>{ box.innerHTML=''; });
    document.getElementById('reset-yes').addEventListener('click', async ()=>{
      logData = {entries:{}, dayHistory:{}, meta:{}};
      const ok = await saveData();
      showToast(ok?'Storico cancellato.':'Cancellati solo per questa sessione.', !ok);
      renderApp();
    });

}

/* =========================================================
   ROOT
   ========================================================= */
function renderApp(){
  // l'app ridisegna tutto a ogni interazione: senza questo, ogni tocco
  // riporterebbe la pagina in cima e la striscia degli esercizi all'inizio
  const scrollY = window.scrollY;
  const chips = document.querySelector('.ex-chips');
  const chipScroll = chips ? chips.scrollLeft : null;

  renderHeader();
  if(appView==='dashboard') renderDashboard();
  else if(appView==='readiness') renderReadiness();
  else if(appView==='effort') renderEffortAsk();
  else if(appView==='recap') renderRecap();
  else if(appView==='history') renderHistory();
  else renderWorkout();
  renderBottomBar();
  renderDaySheet();
  renderSwapSheet();
  renderKeypad();
  applyHeaderOffset();

  const chips2 = document.querySelector('.ex-chips');
  if(chips2){
    if(chipScrollWanted!==null){ chipScrollWanted=null; scrollChipIntoView(); }
    else if(chipScroll!==null) chips2.scrollLeft = chipScroll;
  }
  try{ window.scrollTo(0, scrollY); }catch(e){}

  // quando cambia il campo selezionato, porta la sua riga sopra la tastiera
  const key = activeField ? (activeField.exoId+'|'+activeField.kind+'|'+activeField.index) : null;
  if(key !== lastFieldRowKey){
    lastFieldRowKey = key;
    if(key) requestAnimationFrame(scrollActiveRowIntoView);
  }
}
let lastFieldRowKey = null;
function scrollActiveRowIntoView(){
  const cell = document.querySelector('.cell-active');
  if(!cell) return;
  const row = cell.closest ? (cell.closest('.set-row') || cell) : cell;
  const kp = document.querySelector('.keypad');
  const kpH = kp ? kp.getBoundingClientRect().height : 0;
  const top = document.querySelector('.workout-top');
  const topH = top ? top.getBoundingClientRect().height : 0;
  const rect = row.getBoundingClientRect();
  const vh = window.innerHeight || 800;
  const bottomLimit = vh - kpH - 28;   // un po' sopra la tastiera
  const topLimit = topH + 16;
  let delta = 0;
  if(rect.bottom > bottomLimit) delta = rect.bottom - bottomLimit;
  else if(rect.top < topLimit) delta = rect.top - topLimit;
  if(delta === 0) return;
  try{ window.scrollBy({top:delta, behavior:'smooth'}); }
  catch(e){ try{ window.scrollTo(0, (window.scrollY||0)+delta); }catch(e2){} }
}
let chipScrollWanted = null;
function scrollChipIntoView(){
  const wrap = document.querySelector('.ex-chips');
  if(!wrap) return;
  const active = wrap.querySelector('.ex-chip.active');
  if(!active) return;
  const target = active.offsetLeft - (wrap.clientWidth - active.offsetWidth)/2;
  wrap.scrollLeft = Math.max(0, target);
}

// All'avvio, se non c'e' nessuno storico, l'app parte con dati di esempio gia'
// caricati: cosi' e' subito navigabile e il coach ha qualcosa da dire, senza
// dipendere da un salvataggio che in alcuni contesti non e' disponibile.
['pointerdown','touchstart','click','keydown'].forEach(ev=>{
  document.addEventListener(ev, unlockAudio, {passive:true});
});

loadData().then(renderApp);
