<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scheda">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Registro allenamenti con progressione dei carichi">
<title>Scheda</title>
<style>
  :root{
    --bg:#050506;
    --surface:#0e0f11;
    --surface-2:#17181b;
    --surface-3:#1f2124;
    --hairline: rgba(255,255,255,0.09);
    --hairline-strong: rgba(255,255,255,0.16);
    --text:#f5f5f6;
    --text-secondary: rgba(245,245,246,0.62);
    --text-muted: rgba(245,245,246,0.36);
    --accent:#c81e3a;
    --on-accent:#ffffff;
    --success:#34c76f;
    --danger:#ff453a;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{margin:0;padding:0;background:var(--bg);overflow-x:hidden;}
  body{margin:0;padding:0;background:var(--bg);}
  body{
    color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    min-height:100vh; padding-top:env(safe-area-inset-top);
  }
  body.workout-view{ padding-top:0; }
  .app{ max-width:480px; margin:0 auto; padding:18px 18px 120px; }

  .header{ margin-bottom:20px; }
  .eyebrow{ font-size:12px; font-weight:600; letter-spacing:0.02em; color:var(--accent); text-transform:uppercase; margin-bottom:2px; }
  h1.title{ font-size:30px; font-weight:700; letter-spacing:-0.02em; margin:0; }

  .workout-header{ display:flex; align-items:center; gap:6px; padding:4px 0 10px; }
  .back-btn{ background:none; border:none; color:var(--text-secondary); font-family:var(--font); font-weight:600; font-size:24px; line-height:1; width:32px; min-height:44px; padding:0; cursor:pointer; flex-shrink:0; }
  .workout-header-title{ font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .workout-timer{ font-family:var(--font-mono); font-weight:700; font-size:16px; color:var(--accent); }

  .card{ background:var(--surface); border:1px solid var(--hairline); border-radius:18px; padding:16px; margin-bottom:12px; transition:border-color .18s; }

  .hero{ background:var(--surface); border:1px solid var(--hairline-strong); border-radius:20px; padding:18px; margin-bottom:14px; }
  .hero-eyebrow{ font-size:11px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
  .hero-day{ font-size:26px; font-weight:700; letter-spacing:-0.02em; margin-bottom:3px; }
  .hero-meta{ font-size:13px; color:var(--text-secondary); margin-bottom:16px; }
  .hero-preview{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .hero-chip{ font-size:11.5px; color:var(--text-secondary); background:var(--surface-2); border:1px solid var(--hairline); border-radius:999px; padding:4px 10px; }

  .stat-strip{ display:flex; gap:8px; margin-bottom:14px; }
  .stat-cell{ flex:1; background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:12px 10px; text-align:center; }
  .stat-val{ font-family:var(--font-mono); font-weight:700; font-size:19px; }
  .stat-lab{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; margin-top:3px; }


  button.save{ width:100%; background:var(--accent); color:var(--on-accent); border:none; font-family:var(--font); font-weight:700; font-size:15px; padding:15px; border-radius:999px; cursor:pointer; transition:transform .1s; }
  button.save:active{ transform:scale(0.98); }
  .btn-pill{ border:1px solid var(--hairline-strong); background:var(--surface-2); color:var(--text); font-family:var(--font); font-weight:600; font-size:13px; padding:0 16px; min-height:44px; border-radius:999px; cursor:pointer; }
  .btn-pill{ transition:background .15s, border-color .15s; }
  .btn-pill:active{ background:var(--surface-3); }
  .btn-pill.danger-outline{ border-color:var(--danger); color:var(--danger); background:transparent; }

  .section-label{ font-size:11px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-muted); margin:4px 2px 10px; }

  .tonnage-row{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .tonnage-value{ font-family:var(--font-mono); font-weight:700; font-size:26px; }
  .tonnage-unit{ font-size:13px; color:var(--text-secondary); margin-left:-4px; }
  .tonnage-delta{ font-family:var(--font-mono); font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:999px; margin-left:4px; }
  .tonnage-delta.up{ color:var(--success); background:rgba(52,199,111,0.12); }
  .tonnage-delta.down{ color:var(--danger); background:rgba(255,69,58,0.12); }
  .tonnage-delta.flat{ color:var(--text-secondary); background:var(--surface-2); }

  .exercise-header{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
  .exercise.expanded .exercise-header{ margin-bottom:14px; }
  .exercise.collapsed .exercise-header{ margin-bottom:0; }
  .exercise.is-active{ border-color:var(--hairline-strong); }
  .exercise h3{ font-size:16px; font-weight:600; letter-spacing:-0.01em; margin:0 0 2px; }
  .exercise .target{ font-size:12.5px; color:var(--text-secondary); }
  .chevron{ font-family:var(--font-mono); font-size:18px; color:var(--text-muted); width:24px; height:24px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pr-badge{ display:inline-block; font-size:10.5px; font-weight:700; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:1px 8px; margin-left:6px; }

  .goal-line{ font-size:12px; color:var(--text-secondary); background:var(--surface-2); border-radius:10px; padding:8px 10px; margin-bottom:12px; }
  .goal-line b{ color:var(--text); font-weight:700; }

  .col-labels{ display:grid; grid-template-columns:22px 1fr 1fr 52px 50px; gap:5px; margin-bottom:6px; }
  .col-labels span{ font-size:10px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-muted); text-align:center; }
  .set-row{ display:grid; grid-template-columns:22px 1fr 1fr 52px 50px; gap:5px; align-items:center; margin-bottom:9px; }
  .set-idx{ font-family:var(--font-mono); font-size:12px; color:var(--text-muted); text-align:center; }
  /* Celle al posto degli input di sistema: tutta l'area e' toccabile */
  .cell:active, .rir-cell:active{ background:var(--surface-3); }
  .cell, .rir-cell{
    width:100%; min-height:48px; display:flex; align-items:center; justify-content:center; gap:1px;
    background:var(--surface-2); border:1px solid var(--hairline); color:var(--text);
    font-family:var(--font-mono); font-weight:600; font-size:16px; border-radius:10px;
    cursor:pointer; user-select:none; -webkit-user-select:none; padding:0 2px;
  }
  .rir-cell{ font-size:15px; color:var(--text-secondary); }
  .cell .ph{ color:var(--text-muted); font-weight:400; font-size:14px; }
  .cell-active{ border-color:var(--accent); background:rgba(200,30,58,0.14); color:var(--text); }
  .cell-active .caret{
    display:inline-block; width:2px; height:19px; background:var(--accent); border-radius:1px;
    animation:blink 1s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .set-row.current .cell, .set-row.current .rir-cell{ border-color:rgba(200,30,58,0.55); }
  .set-row.current .set-idx{ color:var(--accent); font-weight:700; }
  .set-row.done .cell, .set-row.done .rir-cell{ opacity:0.55; }
  .rir-cell.needs-rir{ border-color:var(--danger); color:var(--danger); }

  /* Tastiera interna */
  body.kp-open .app{ padding-bottom:360px; }
  .keypad{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:970;
    background:var(--surface-3); border-top:1px solid var(--hairline-strong);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .kp-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 4px 10px; }
  .kp-label{ font-size:12px; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kp-done{
    background:none; border:none; color:var(--accent); font-family:var(--font);
    font-weight:700; font-size:14px; padding:6px 8px; cursor:pointer; flex-shrink:0;
  }
  .kp-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .kp-key{
    min-height:52px; background:var(--surface-2); border:1px solid var(--hairline); color:var(--text);
    font-family:var(--font-mono); font-weight:700; font-size:21px; border-radius:12px; cursor:pointer;
  }
  .kp-key:active{ background:var(--surface); }
  .kp-key:disabled{ opacity:0.3; }
  .kp-back{ font-size:18px; color:var(--text-secondary); }
  .kp-rir{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .kp-rir-btn{
    min-height:60px; background:var(--surface-2); border:1px solid var(--hairline); color:var(--text);
    font-family:var(--font-mono); font-weight:700; font-size:20px; border-radius:12px; cursor:pointer;
  }
  .kp-rir-btn:active{ background:var(--accent); color:var(--on-accent); }
  .kp-rir-hint{ font-size:11.5px; color:var(--text-muted); text-align:center; margin-top:8px; }
  .kp-next{
    width:100%; margin-top:10px; background:var(--accent); color:var(--on-accent); border:none;
    font-family:var(--font); font-weight:700; font-size:15px; min-height:48px; border-radius:999px; cursor:pointer;
  }
  .kp-next:active{ transform:scale(0.99); }
  /* i suggerimenti sono informazioni, non allarmi: il rosso resta agli avvisi */
  .suggest{ font-family:var(--font-mono); font-size:12.5px; color:var(--text); font-weight:700; text-align:center; }
  .suggest.muted{ color:var(--text-muted); font-weight:400; }

  .wu-remove{ background:var(--surface-2); border:1px solid var(--hairline); color:var(--text-muted); border-radius:10px; min-height:44px; font-size:15px; cursor:pointer; }
  .add-wu{ width:100%; margin-bottom:12px; }
  .wu-hint{ font-size:11px; color:var(--text-muted); margin:6px 0 12px; text-align:center; }

  .heatmap{ display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; grid-auto-columns:1fr; gap:2.5px; width:100%; }
  .heatmap-cell{ aspect-ratio:1; border-radius:2.5px; background:var(--surface-2); cursor:pointer; transition:transform .1s; }
  .heatmap-cell:active{ transform:scale(0.8); }
  .heatmap-cell.level-1{ background:#3a1017; }
  .heatmap-cell.level-2{ background:#5c1a24; }
  .heatmap-cell.level-3{ background:#8a1f30; }
  .heatmap-cell.level-4{ background:var(--accent); }
  .heatmap-cell.selected{ outline:2px solid var(--text); outline-offset:1px; }
  .heatmap-detail{ font-size:12px; color:var(--text-secondary); margin-top:10px; min-height:16px; }

  .chart-empty{ text-align:center; font-size:12.5px; color:var(--text-muted); padding:26px 10px; }


  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:900;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    background:var(--surface-3); border-top:1px solid var(--hairline-strong);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .bb-info{ flex:1; cursor:pointer; }
  .bb-day{ font-weight:700; font-size:14px; }
  .bb-sub{ font-size:11px; color:var(--text-muted); }
  .bb-timer{ font-family:var(--font-mono); color:var(--accent); font-weight:700; font-size:14px; }
  .icon-btn{ background:var(--surface-2); border:1px solid var(--hairline-strong); color:var(--text-secondary); width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; flex-shrink:0; }
  .confirm-bar{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:901;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:var(--surface-3); border-top:1px solid var(--danger);
    display:flex; align-items:center; gap:10px;
  }
  .confirm-bar span{ font-size:12.5px; flex:1; }

  /* Intestazione fissa: timer sessione e recupero restano sempre visibili,
     anche con la tastiera aperta */
  /* Fissa in cima: resta visibile a qualunque punto dello scorrimento.
     Nota: 'sticky' qui non basta, perche' overflow-x:hidden su un antenato
     lo disattiva — quindi si usa 'fixed' con uno spaziatore calcolato. */
  .workout-top{
    position:fixed; top:0; left:0; right:0;
    max-width:480px; margin:0 auto; z-index:800;
    background-color:#050506; /* uguale a --bg, esplicito per coprire ogni contesto */
    padding:6px 18px 8px;
    padding-top:calc(6px + env(safe-area-inset-top));
    border-bottom:1px solid var(--hairline);
  }
  .rest-pill{
    display:flex; align-items:center; gap:2px; flex-shrink:0;
    background:var(--surface-2); border:1px solid var(--hairline-strong);
    border-radius:999px; padding:2px; margin-left:auto;
  }
  .rest-pill.idle{ opacity:0.45; padding:2px 4px; }
  .rest-time{
    background:none; border:none; color:var(--text);
    font-family:var(--font-mono); font-weight:700; font-size:15px;
    min-height:40px; padding:0 10px; cursor:pointer;
  }
  .rest-time.idle-time{ color:var(--text-muted); line-height:40px; }
  .rest-x{
    background:none; border:none; color:var(--text-muted);
    font-size:18px; width:34px; min-height:40px; cursor:pointer;
  }
  .rest-pill.expired{ animation: restBlink 1s step-start infinite; }
  @keyframes restBlink{ 50%{ background:var(--danger); border-color:var(--danger); } }
  .rest-pill.expired .rest-time, .rest-pill.expired .rest-x{ color:var(--on-accent); }

  .session-time{ font-family:var(--font-mono); font-size:14px; color:var(--text-secondary); display:inline-flex; align-items:baseline; }
  .session-dot{ margin:0 8px; color:var(--text-muted); }

  .sheet-scrim{ position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:980; }
  .day-sheet{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:990;
    background:var(--surface-3); border-radius:20px 20px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .sheet-handle{ width:36px; height:4px; background:var(--hairline-strong); border-radius:99px; margin:8px auto 14px; }
  .sheet-title{ font-size:16px; font-weight:700; margin-bottom:8px; }
  .sheet-row{ display:flex; justify-content:space-between; align-items:center; padding:16px 4px; min-height:56px; border-bottom:1px solid var(--hairline); cursor:pointer; }
  .sheet-row:active{ background:var(--surface-2); }
  .dsr-name{ font-size:15px; font-weight:600; }
  .dsr-sub{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .sheet-cancel{ width:100%; margin-top:12px; background:none; border:none; color:var(--text-secondary); font-family:var(--font); font-weight:600; font-size:14px; padding:10px; cursor:pointer; }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px); opacity:0;
    transition:opacity .25s, transform .25s; background:var(--surface-3); border:1px solid var(--hairline-strong);
    color:var(--text); padding:12px 20px; border-radius:999px; font-weight:600; font-size:13.5px; z-index:1000; max-width:90%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error{ border-color:var(--danger); color:var(--danger); }

  .ex-chips{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:4px; -webkit-overflow-scrolling:touch; }
  .ex-chips::-webkit-scrollbar{ display:none; }
  .ex-chip{
    flex:0 0 auto; background:var(--surface-2); border:1px solid var(--hairline); color:var(--text-secondary);
    font-family:var(--font); font-weight:600; font-size:12.5px; padding:0 14px; min-height:40px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .ex-chip{ transition:background .15s, border-color .15s, color .15s; }
  .ex-chip.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .trend-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin:6px 0 4px; flex-wrap:wrap; }
  .trend-val{ font-family:var(--font-mono); font-weight:700; font-size:28px; line-height:1; }
  .trend-unit{ font-size:14px; color:var(--text-secondary); margin-left:3px; }
  .trend-sub{ font-size:11.5px; color:var(--text-muted); margin-top:4px; }
  .line-wrap{ width:100%; margin-top:6px; }
  .line-svg{ width:100%; height:110px; display:block; touch-action:none; cursor:crosshair; }
  .chart-foot{ font-size:11.5px; color:var(--text-muted); margin-top:8px; text-align:center; min-height:16px; }

  .coach-item{ padding:12px 0; border-bottom:1px solid var(--hairline); }
  .coach-item:last-child{ border-bottom:none; padding-bottom:2px; }
  .coach-title{ font-size:13.5px; font-weight:700; margin-bottom:3px; }
  .coach-item.good .coach-title{ color:var(--success); }
  .coach-item.warn .coach-title{ color:var(--accent); }  /* rosso = serve la tua attenzione */
  .coach-item.info .coach-title{ color:var(--text); }
  .coach-text{ font-size:12.5px; color:var(--text-secondary); line-height:1.5; }

  .day-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .day-btn{
    background:var(--surface); border:1px solid var(--hairline); color:var(--text);
    border-radius:14px; padding:12px 10px; min-height:60px; cursor:pointer; text-align:left;
    font-family:var(--font); display:flex; flex-direction:column; justify-content:center; gap:2px;
    transition:background .15s, border-color .15s;
  }
  .day-btn.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .day-btn-name{ font-size:13.5px; font-weight:600; line-height:1.2; }
  .day-btn-sub{ font-size:11px; opacity:0.6; }
  .tools-text{ font-size:12px; color:var(--text-secondary); margin-bottom:12px; line-height:1.45; }
  .confirm-box{
    margin-top:12px; padding:14px; border-radius:14px;
    background:rgba(255,69,58,0.07); border:1px solid var(--danger);
  }
  .confirm-title{ font-size:13.5px; font-weight:700; margin-bottom:4px; }
  .confirm-text{ font-size:12px; color:var(--text-secondary); line-height:1.45; margin-bottom:12px; }
  .confirm-actions{ display:flex; gap:8px; }
  .confirm-actions .btn-pill{ flex:1; }
  .btn-pill.danger-solid{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .ex-menu{
    background:none; border:none; color:var(--text-muted); font-size:15px;
    letter-spacing:1px; width:40px; min-height:40px; cursor:pointer; flex-shrink:0;
  }
  .swap-badge, .skip-badge{
    display:inline-block; font-size:10px; font-weight:700; letter-spacing:0.03em;
    border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:middle;
    color:var(--text-secondary); border:1px solid var(--hairline-strong);
  }
  .exercise.is-skipped{ opacity:0.45; }
  .row-active{ background:var(--surface-2); border-radius:10px; }
  .deload-banner{
    background:var(--surface); border:1px dashed var(--hairline-strong); border-radius:14px;
    padding:11px 14px; margin-bottom:12px; font-size:12.5px; color:var(--text-secondary);
  }
  .deload-banner b{ color:var(--text); }
  .coach-action{ margin-top:10px; }
  /* scale 1-5 per "come ti senti" e "quanto e' stata dura" */
  .scale-list{ display:flex; flex-direction:column; gap:8px; }
  .scale-btn{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--surface-2); border:1px solid var(--hairline); color:var(--text);
    border-radius:14px; padding:14px; min-height:62px; cursor:pointer; font-family:var(--font);
    transition:background .15s, border-color .15s;
  }
  .scale-btn:active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .scale-num{
    flex-shrink:0; width:34px; height:34px; border-radius:50%;
    background:var(--surface-3); border:1px solid var(--hairline-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:15px;
  }
  .scale-label{ display:block; font-size:14.5px; font-weight:600; }
  .scale-hint{ display:block; font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .scale-skip{
    width:100%; margin-top:14px; background:none; border:none; color:var(--text-muted);

// Sostituzioni valide per la sessione in corso: {slotId: {id,name,inc,iso}}
let swaps = {};
let skipped = {};
let swapSheetFor = null;
let pendingReadinessDay = null;   // giorno scelto, in attesa di "come ti senti"
let pendingEffort = null;         // riepilogo in attesa dello sforzo percepito
let historyOpen = null;
let histExpanded = {};           // sessione aperta nello storico {date, day}

// Restituisce l'esercizio effettivo per uno slot, applicando l'eventuale scambio
function effExo(base){
  const sw = swaps[base.id];
  if(!sw) return base;
  return { id:base.id, name:sw.name, sets:base.sets, min:base.min, max:base.max,
           iso:sw.iso, _swapId:sw.id, _inc:sw.inc, _swapName:sw.name };
}

/* =========================================================
   STATO
   ========================================================= */
const STORAGE_KEY = "matteo-workout-v3";
const DELOAD_FACTOR = 0.6;   // ~40% di carico in meno, in linea con i protocolli di scarico
let logData = { entries:{}, dayHistory:{} };
let liveInputs = {};
let appView = 'dashboard';
let currentDay = 'legs';
let dashboardDay = 'legs';
let dashboardDetailOpen = false;
let chartExercise = null;
let toolsOpen = false;
let daySheetOpen = false;
let discardConfirm = false;
let activeWorkout = null;
let restTimer = null;
let lastRecap = null;
let cardOverride = {};
// settimana di scarico: riduce i carichi consigliati senza toccare lo storico
function deloadActive(){ return !!(logData.meta && logData.meta.deloadUntil && new Date(todayISO()) <= new Date(logData.meta.deloadUntil)); }
function deloadDaysLeft(){
  if(!deloadActive()) return 0;
  return Math.max(0, Math.round((new Date(logData.meta.deloadUntil) - new Date(todayISO()))/86400000));
}
function startDeload(){
  const end = new Date(); end.setDate(end.getDate()+7);
  if(!logData.meta) logData.meta = {};
  logData.meta.deloadUntil = new Date(end.getTime()-end.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function endDeload(){ if(logData.meta) delete logData.meta.deloadUntil; }
let activeField = null;   // {exoId, kind:'work'|'wu', index, field:'w'|'r'|'rir'}
let keypadBuffer = '';

/* =========================================================
   UTIL
   ========================================================= */
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function formatDate(){ return new Date().toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'}); }
function formatClock(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0');
}
function e1rm(w,r){ return (w>0 && r>0) ? w*(1+r/30) : 0; }
function roundToStep(v, step){ return Math.max(step, Math.round(v/step)*step); }
function tidy(n){ return Number.isInteger(n) ? String(n) : String(Math.round(n*10)/10); }
// In Italia i mezzi chili si scrivono con la virgola: internamente resta un
// numero con il punto, a schermo si mostra sempre con la virgola.
function fmtNum(n){ return tidy(n).replace('.', ','); }
function parseNum(txt){ return parseFloat(String(txt).replace(',', '.')) || 0; }
function exKey(day, id){ return day+'__'+id; }
function getEntries(day,id){ return logData.entries[exKey(day,id)] || []; }

/* Uno slot puo' contenere sessioni fatte con esercizi diversi (sostituzioni):
   150kg di Smith squat non sono un record di Hack squat. Qui si filtra per la
   variante davvero eseguita, cosi' grafici, record e suggerimenti restano puliti. */
function variantOf(exo){ return (exo && exo._swapName) ? exo._swapName : null; }
function entriesForVariant(day, exo){
  const v = variantOf(exo);
  return getEntries(day, exo.id).filter(e=> (e.swappedTo||null) === v);
}
function lastEntryForVariant(day, exo){
  const a = entriesForVariant(day, exo);
  return a.length ? a[a.length-1] : null;
}
function e1rmOf(st){
  const eff = st.r + (st.rir===null||st.rir===undefined ? 0 : st.rir);
  return st.w * (1 + eff/30);
}
function getLastEntry(day,id){ const a = getEntries(day,id); return a.length ? a[a.length-1] : null; }
function getBestE1rm(day,id,variant){
  let best = null;
  const list = (variant===undefined) ? getEntries(day,id)
             : getEntries(day,id).filter(e=>(e.swappedTo||null)===variant);
  list.forEach(e=>{
    (e.work||[]).forEach(s=>{
      const v = e1rm(s.w,s.r);
      if(v>0 && (!best || v>best.val)) best = {val:v, w:s.w, r:s.r, date:e.date};
    });
  });
  return best;
}

function ensureLive(exo){
  if(!liveInputs[exo.id]) liveInputs[exo.id] = { warmups:[], work:new Array(exo.sets).fill(null) };
  return liveInputs[exo.id];
}
function getWork(exo){ return ensureLive(exo).work; }
function getWarmups(exo){ return ensureLive(exo).warmups; }
function isSetDone(s){ return !!s && s.w>0 && s.r>0 && s.rir!==null && s.rir!==undefined; }
function isSetPartial(s){ return !!s && (s.w>0 || s.r>0) && !isSetDone(s); }
function isExerciseComplete(exo){
  const w = getWork(exo);
  for(let i=0;i<exo.sets;i++){ if(!isSetDone(w[i])) return false; }
  return true;
}
function firstUnfilled(exo){
  const w = getWork(exo);
  for(let i=0;i<exo.sets;i++){ if(!isSetDone(w[i])) return i; }
  return -1;
}

/* Storage a piu livelli: a seconda di come viene aperto il file,
   window.storage puo' non essere disponibile. In quel caso si passa a
   localStorage e, come ultima spiaggia, a una copia in memoria — cosi'
   l'app resta usabile invece di rispondere solo "errore". */
const memStore = {};
let storageMode = 'sconosciuto';

async function rawGet(key){
  if(typeof window !== 'undefined' && window.storage && window.storage.get){
    try{
      const r = await window.storage.get(key, false);
      storageMode = 'app';
      if(r && r.value!==undefined && r.value!==null) return r.value;
      return null;
    }catch(e){ /* chiave assente o API non utilizzabile: si prova il livello dopo */ }
  }
  try{
    const v = window.localStorage.getItem(key);
    if(v!==null){ storageMode = 'locale'; return v; }
  }catch(e){}
  if(memStore[key]!==undefined){ storageMode = 'memoria'; return memStore[key]; }
  return null;
}

async function rawSet(key, value){
  let persisted = false;
  if(typeof window !== 'undefined' && window.storage && window.storage.set){
    try{ await window.storage.set(key, value, false); persisted = true; storageMode = 'app'; }
    catch(e){}
  }
  if(!persisted){
    try{ window.localStorage.setItem(key, value); persisted = true; storageMode = 'locale'; }
    catch(e){}
  }
  memStore[key] = value;
  if(!persisted) storageMode = 'memoria';
  return persisted;
}

async function loadData(){
  try{
    const v = await rawGet(STORAGE_KEY);
    if(v){
      const p = JSON.parse(v);
      logData = { entries: p.entries||{}, dayHistory: p.dayHistory||{}, meta: p.meta||{} };
      migrateData();
    }
  }catch(e){ logData = { entries:{}, dayHistory:{}, meta:{} }; }
}

/* Completa i dati gia' salvati con i campi nuovi senza toccare quelli
   esistenti: aggiornare l'app non deve mai far perdere lo storico. */
function migrateData(){
  Object.keys(logData.entries||{}).forEach(k=>{
    const arr = logData.entries[k];
    if(!Array.isArray(arr)){ delete logData.entries[k]; return; }
    arr.forEach(e=>{
      if(!e.work && e.sets){ e.work = e.sets; delete e.sets; }
      if(!Array.isArray(e.work)) e.work = [];
      if(!Array.isArray(e.warmups)) e.warmups = [];
      e.work.forEach(st=>{ if(st.rir===undefined) st.rir = null; });
      if(e.swappedTo===undefined) e.swappedTo = null;
    });
  });
  Object.keys(logData.dayHistory||{}).forEach(k=>{
    (logData.dayHistory[k]||[]).forEach(h=>{
      if(!h.duration) h.duration = '01:00:00';
      if(h.effort===undefined) h.effort = null;
      if(h.readiness===undefined) h.readiness = null;
    });
  });
  if(!logData.meta) logData.meta = {};
  logData.meta.version = 4;
}
async function saveData(){
  try{ return await rawSet(STORAGE_KEY, JSON.stringify(logData)); }
  catch(e){ return false; }
}

function showToast(msg, isErr){
  const old = document.getElementById('app-toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.id='app-toast'; t.className='toast'+(isErr?' error':''); t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 2200);
}

/* =========================================================
   RECUPERO — tempi da letteratura
   Schoenfeld et al. 2016: 3 min > 1 min su ipertrofia/forza in allenati.
   Grgic et al. 2018: >=2 min sui multiarticolari, 60-90s sui monoarticolari.
   ========================================================= */
function restSecondsFor(exo, isWarmup){
  if(isWarmup) return 45;
  if(exo.iso) return exo.max >= 15 ? 60 : 90;
  return exo.max <= 8 ? 180 : 150;
}
function startRest(seconds){ restTimer = { endsAt: Date.now()+seconds*1000, total:seconds, notified:false }; }

/* Suono di fine recupero generato dal browser: nessun file da caricare.
   Su iOS l'audio parte solo dopo un'interazione dell'utente, quindi il
   contesto viene creato e sbloccato al primo tocco sull'app. */
let audioCtx = null;
function unlockAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(atTime, freq, dur){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, atTime);
  gain.gain.exponentialRampToValueAtTime(0.35, atTime+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, atTime+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(atTime); osc.stop(atTime+dur+0.02);
}
function playRestDone(){
  try{
    unlockAudio();
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    beep(t,        880, 0.12);
    beep(t+0.18,   880, 0.12);
    beep(t+0.36,  1175, 0.22);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([120,80,120]); }catch(e){}
}

/* =========================================================
   WARMUP — il numero di step lo decide la banda di carico,
   poi si aggiungono step finché nessun salto supera 60kg.
   ========================================================= */
const RAMPS = {
  1:[0.60], 2:[0.35,0.67], 3:[0.35,0.60,0.80],
  4:[0.30,0.50,0.70,0.85], 5:[0.25,0.45,0.62,0.76,0.88]
};
const MAX_JUMP_KG = 60;
const MAX_WARMUPS = 8;
// Fino a 5 step uso la tabella tarata a mano; oltre (carichi estremi tipo leg
// press molto caricata) genero la rampa in modo che i salti restino sotto la soglia.
function rampPercents(n){
  if(RAMPS[n]) return RAMPS[n];
  const start = 0.25, end = 0.88, out = [];
  for(let i=0;i<n;i++) out.push(start + (end-start)*i/(n-1));
  return out;
}
function baseWarmupCount(top, iso){
  if(iso){ if(top<=50) return 0; if(top<=120) return 1; return 2; }
  if(top<=40) return 0;
  if(top<=70) return 1;
  if(top<=140) return 2;
  if(top<=220) return 3;
  return 4;
}
function rampJumps(p, top){
  const w = p.map(x=>top*x).concat([top]);
  const j=[];
  for(let i=1;i<w.length;i++) j.push(w[i]-w[i-1]);
  return j;
}
function warmupRamp(exo, top){
  if(!top || top<=0) return [];
  let n = baseWarmupCount(top, exo.iso);
  if(n===0) return [];
  while(n<MAX_WARMUPS && Math.max.apply(null, rampJumps(rampPercents(n), top)) > MAX_JUMP_KG) n++;
  const step = top>=100 ? 5 : increment(exo);
  const repsFor = p => p<0.45 ? 8 : (p<0.65 ? 5 : (p<0.8 ? 3 : 2));
  return rampPercents(n).map(p=>({ w: roundToStep(top*p, step), r: repsFor(p) }));
}

/* =========================================================
   PROGRESSIONE — doppia progressione vera.
   Stesso peso finché non tocchi il top del range; quando lo tocchi,
   sali di un incremento. Le serie successive restano allo stesso peso:
   nell'ipertrofia si perdono ripetizioni, non si scala il carico ogni set.
   Il peso scende solo se una serie cade sotto il minimo del range.
   ========================================================= */
/* ======================= MODELLO DI FATICA =======================
   La forza cala serie dopo serie, e quanto cala dipende dall'atleta e
   dall'esercizio. Invece di una costante fissa, il fattore viene IMPARATO
   dallo storico (rapporto tra massimali stimati di serie consecutive) e usato
   appena ci sono abbastanza dati; prima di allora si parte da valori di
   riferimento tarati su chi porta la prima serie vicino al cedimento.
   Sulle fonti, per chiarezza: i tempi di recupero vengono dalla letteratura
   (Schoenfeld 2016; Grgic 2018) e la stima del massimale e' la formula di
   Epley. Questi coefficienti di calo no: sono empirici, ed e' esattamente il
   motivo per cui vengono rimpiazzati dai dati reali appena disponibili. */
function defaultFatigue(rir){
  if(rir===null || rir===undefined) return 0.92;
  if(rir<=0) return 0.88;
  if(rir<=1) return 0.90;
  if(rir<=2) return 0.93;
  if(rir<=3) return 0.96;
  return 0.98;
}
function learnedFatigue(day, exo){
  const entries = entriesForVariant(day, exo).slice(-6);
  const ratios = [];
  entries.forEach(e=>{
    const sets = (e.work||[]).filter(st=>st.w>0 && st.r>0);
    for(let i=1;i<sets.length;i++){
      const prev = e1rmOf(sets[i-1]), cur = e1rmOf(sets[i]);
      if(prev>0 && cur>0){
        const r = cur/prev;
        if(r>0.6 && r<1.15) ratios.push(r);
      }
    }
  });
  if(ratios.length < 3) return null;
  ratios.sort((a,b)=>a-b);
  return ratios[Math.floor(ratios.length/2)];
}
function fatigueFor(day, exo, rir){
  const learned = learnedFatigue(day, exo);
  if(learned===null) return defaultFatigue(rir);
  const adj = defaultFatigue(rir) / 0.92;
  return Math.min(0.99, Math.max(0.78, learned * adj));
}

/* Correzione proporzionale: dal massimale stimato della serie appena fatta si
   ricava il peso che ti tiene dentro al range nella serie successiva. */
function weightForTargetReps(exo, w, r, rir, targetReps, fatigue){
  const inc = increment(exo);
  const effReps = r + (rir===null || rir===undefined ? 0 : rir);
  const e1 = w * (1 + effReps/30);
  const raw = (e1 * fatigue) / (1 + targetReps/30);
  let out = Math.round(raw/inc)*inc;
  const floor = Math.round((w*0.70)/inc)*inc;
  if(out < floor) out = floor;
  if(out > w) out = w;
  return Math.max(inc, out);
}

// "Come ti senti oggi": sposta di poco il carico di partenza della sessione
function readinessFactor(){
  const r = (activeWorkout && activeWorkout.readiness) || null;
  if(!r) return 1.0;
  return r===1 ? 0.93 : r===2 ? 0.97 : r===3 ? 1.0 : r===4 ? 1.01 : 1.02;
}

function baseWeightForToday(day, exo){
  const last = lastEntryForVariant(day, exo);
  if(!last || !last.work || !last.work[0] || !(last.work[0].w>0)) return null;
  const w = last.work[0].w, r = last.work[0].r, rir = last.work[0].rir;
  const inc = increment(exo);
  const round = v => Math.max(inc, Math.round(v/inc)*inc);
  if(deloadActive()) return round(w*DELOAD_FACTOR);
  const ready = readinessFactor();
  // Se il carico non cambia si restituisce quello esatto: arrotondare qui
  // sposterebbe un 94kg a 95 senza motivo. Si arrotonda solo quando si calcola
  // davvero un peso nuovo.
  if(r >= exo.max)  return ready===1 ? w + inc : round((w + inc) * ready);
  if(r < exo.min){
    const corrected = weightForTargetReps(exo, w, r, rir, exo.min+1, 1.0);
    return ready===1 ? corrected : round(corrected * ready);
  }
  return ready===1 ? w : round(w * ready);
}

function computeSuggestions(day, exo){
  const work = getWork(exo);
  const out = new Array(exo.sets).fill(null);
  const mid = Math.round((exo.min + exo.max)/2);
  let ref = baseWeightForToday(day, exo);

  for(let i=0;i<exo.sets;i++){
    const s = work[i];
    if(isSetDone(s)){
      // dalla serie appena fatta si stima quanto reggi nella prossima,
      // usando il calo abituale misurato su questo esercizio
      const fat = fatigueFor(day, exo, s.rir);
      const target = (s.r < exo.min) ? exo.min+1 : mid;
      ref = weightForTargetReps(exo, s.w, s.r, s.rir, target, fat);
      out[i] = null;
    } else {
      out[i] = ref;
    }
  }
  return out;
}
function goalTextFor(day, exo){
  const last = lastEntryForVariant(day, exo);
  const base = baseWeightForToday(day, exo);
  if(!last || base===null) return null;
  const lw = last.work[0].w, lr = last.work[0].r;
  if(lr >= exo.max){
    return 'Ultima volta <b>'+tidy(lw)+'kg × '+lr+'</b> — hai chiuso il range, oggi si sale a <b>'+tidy(base)+'kg</b>.';
  }
  return 'Ultima volta <b>'+tidy(lw)+'kg × '+lr+'</b> — resta a <b>'+tidy(base)+'kg</b> e punta a <b>'+exo.max+' rip</b> per salire.';
}

function topWorkWeight(day, exo, suggestions){
  const work = getWork(exo);
  if(work[0] && work[0].w>0) return work[0].w;
  if(suggestions && suggestions[0]) return suggestions[0];
  return 0;
}

function tonnageForDay(day){
  let t = 0;
  PROGRAM[day].exercises.forEach(exo=>{
    getWork(exo).forEach(s=>{ if(s) t += (s.w||0)*(s.r||0); });
    getWarmups(exo).forEach(s=>{ if(s) t += (s.w||0)*(s.r||0); });
  });
  return Math.round(t);
}
function lastDayTonnage(day){
  const h = logData.dayHistory[day];
  return (h && h.length) ? h[h.length-1].tonnage : null;
}

function daysSince(dateStr){
  if(!dateStr) return null;
  return Math.floor((new Date(todayISO()).getTime() - new Date(dateStr).getTime())/86400000);
}
function daysSinceLabel(dateStr){
  const d = daysSince(dateStr);
  if(d===null) return 'Mai fatto';
  if(d<=0) return 'Oggi';
  if(d===1) return 'Ieri';
  return d+' giorni fa';
}
function suggestedDay(){
  let best = null, bestDays = -1;
  Object.keys(PROGRAM).forEach(k=>{
    const h = logData.dayHistory[k] || [];
    const last = h.length ? h[h.length-1].date : null;
    const d = last===null ? 9999 : daysSince(last);
    if(d > bestDays){ bestDays = d; best = k; }
  });
  return best || 'legs';
}
function weekStats(){
  // Confronto per giorni di calendario, non per millisecondi: altrimenti una
  // sessione di 7 giorni fa cade fuori o dentro a seconda dell'ora.
  let tonnage=0, sessions=0;
  Object.keys(logData.dayHistory).forEach(k=>{
    (logData.dayHistory[k]||[]).forEach(e=>{
      const d = daysSince(e.date);
      if(d!==null && d>=0 && d<=6){ tonnage+=e.tonnage; sessions++; }
    });
  });
  return {tonnage, sessions};
}
function currentStreakWeeks(){
  const dates = [];
  Object.keys(logData.dayHistory).forEach(k=>{
    (logData.dayHistory[k]||[]).forEach(e=> dates.push(e.date));
  });
  if(dates.length===0) return 0;
  const weeks = new Set(dates.map(d=>{
    const dt = new Date(d);
    const onejan = new Date(dt.getFullYear(),0,1);
    return dt.getFullYear()+'-'+Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7);
  }));
  let streak = 0;
  for(let i=0;i<52;i++){
    const dt = new Date(); dt.setDate(dt.getDate()-i*7);
    const onejan = new Date(dt.getFullYear(),0,1);
    const key = dt.getFullYear()+'-'+Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7);
    if(weeks.has(key)) streak++;
    else if(i>0) break;
  }
  return streak;
}

// Serie di "forza stimata" per un singolo esercizio.
// Uso l'1RM stimato (Epley) della serie migliore di ogni sessione: sale sia
// quando aggiungi kg sia quando aggiungi ripetizioni allo stesso peso — che e'
// esattamente come funziona la doppia progressione. Il peso grezzo invece
// resterebbe piatto per settimane mentre stai progredendo davvero.
function strengthSeries(day, exId, variant){
  const out = [];
  const list = (variant===undefined) ? getEntries(day, exId).filter(e=>!e.swappedTo)
             : getEntries(day, exId).filter(e=>(e.swappedTo||null)===variant);
  list.forEach(e=>{
    let best = 0, bw = 0, br = 0;
    (e.work||[]).forEach(s=>{
      const v = e1rm(s.w, s.r);
      if(v>best){ best=v; bw=s.w; br=s.r; }
    });
    if(best>0) out.push({date:e.date, val:best, w:bw, r:br});
  });
  return out;
}
function fmtShort(d){
  const dt = new Date(d);
  return dt.getDate()+'/'+(dt.getMonth()+1);
}

function buildLineChart(series){
  const W = 300, H = 110, padX = 6, padTop = 10, padBot = 20;
  const vals = series.map(p=>p.val);
  const mx = Math.max.apply(null, vals);
  const mn = Math.min.apply(null, vals);
  const span = Math.max(1, mx-mn);
  const lo = mn - span*0.25, hi = mx + span*0.25;
  const n = series.length;
  const x = i => padX + (W-padX*2) * (n===1?0.5:(i/(n-1)));
  const y = v => padTop + (H-padTop-padBot) * (1 - (v-lo)/(hi-lo));

  let line = '', area = '', dots = '';
  series.forEach((p,i)=>{
    const px = x(i).toFixed(1), py = y(p.val).toFixed(1);
    line += (i===0?'M':'L') + px + ' ' + py + ' ';
    dots += '<circle cx="'+px+'" cy="'+py+'" r="'+(i===n-1?4:2.5)+'" fill="'+(i===n-1?'#c81e3a':'rgba(245,245,246,0.45)')+'"/>';
  });
  area = line + 'L'+x(n-1).toFixed(1)+' '+(H-padBot)+' L'+x(0).toFixed(1)+' '+(H-padBot)+' Z';

  let labels = '';
  const firstD = fmtShort(series[0].date), lastD = fmtShort(series[n-1].date);
  labels += '<text x="'+padX+'" y="'+(H-6)+'" fill="rgba(245,245,246,0.36)" font-size="9" font-family="ui-monospace,monospace">'+firstD+'</text>';
  labels += '<text x="'+(W-padX)+'" y="'+(H-6)+'" text-anchor="end" fill="rgba(245,245,246,0.36)" font-size="9" font-family="ui-monospace,monospace">'+lastD+'</text>';

  return '<div class="line-wrap">'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="line-svg" id="line-svg">'+
      '<path d="'+area+'" fill="rgba(200,30,58,0.10)"/>'+
      '<path d="'+line+'" fill="none" stroke="#c81e3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
      dots + labels +
      '<line id="line-cursor" x1="0" y1="'+padTop+'" x2="0" y2="'+(H-padBot)+'" stroke="rgba(245,245,246,0.35)" stroke-width="1" style="display:none"/>'+
    '</svg>'+
  '</div>';
}

function setupLineChart(series){
  const svg = document.getElementById('line-svg');
  const foot = document.getElementById('chart-foot');
  if(!svg || !foot) return;
  const cursor = document.getElementById('line-cursor');
  const base = foot.textContent;
  let drag = false;
  function upd(clientX){
    const rect = svg.getBoundingClientRect();
    const rel = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));
    const i = Math.round(rel*(series.length-1));
    const p = series[i];
    const padX = 6, W = 300;
    const px = padX + (W-padX*2)*(series.length===1?0.5:(i/(series.length-1)));
    if(cursor){ cursor.setAttribute('x1',px); cursor.setAttribute('x2',px); cursor.style.display='block'; }
    foot.innerHTML = '<b>'+Math.round(p.val)+'kg</b> stimati · '+tidy(p.w)+'kg × '+p.r+' · '+fmtShort(p.date);
  }
  svg.addEventListener('pointerdown', e=>{ drag=true; svg.setPointerCapture(e.pointerId); upd(e.clientX); });
  svg.addEventListener('pointermove', e=>{ if(drag) upd(e.clientX); });
  svg.addEventListener('pointerup', ()=>{ drag=false; });
  svg.addEventListener('pointercancel', ()=>{ drag=false; if(cursor) cursor.style.display='none'; foot.textContent=base; });
}

/* =========================================================
   COACH — osservazioni generate dallo storico.
   Regole in ordine di priorità: prima quello che blocca la
   progressione, poi quello che la conferma.
   ========================================================= */
function buildInsights(){
  const out = [];
  const now = new Date(todayISO()).getTime();

  // 1. Stallo: stesso peso E ripetizioni non in crescita nelle ultime 3 sessioni
  Object.keys(PROGRAM).forEach(dayKey=>{
    PROGRAM[dayKey].exercises.forEach(exo=>{
      const s = strengthSeries(dayKey, exo.id);
      if(s.length<3) return;
      const l = s.slice(-3);
      const sameW = l.every(p=>p.w===l[0].w);
      const noRepGain = l[2].r <= l[0].r;
      if(sameW && noRepGain){
        out.push({p:1, type:'warn', title:exo.name+' è fermo',
          text:'3 sessioni a '+tidy(l[0].w)+'kg senza guadagnare ripetizioni. Prova a spingere più vicino al cedimento, o scarica una settimana e riparti.'});
      }
    });
  });

  // 2. Effort: RIR valutato per giorno, non globalmente. La media su tutti i
  // giorni nasconde il problema: un Push svogliato viene diluito dalle gambe
  // spinte bene. Il segnale utile e' "su QUESTO giorno stai mollando".
  Object.keys(PROGRAM).forEach(dayKey=>{
    let sum=0, n=0;
    PROGRAM[dayKey].exercises.forEach(exo=>{
      getEntries(dayKey, exo.id).slice(-2).forEach(e=>{
        (e.work||[]).forEach(st=>{
          if(st.rir!==null && st.rir!==undefined && st.w>0){ sum+=st.rir; n++; }
        });
      });
    });
    if(n<6) return;
    const avg = sum/n;
    if(avg>2.4){
      out.push({p:2, type:'warn', title:'Poco sforzo su '+PROGRAM[dayKey].label,
        text:'RIR medio '+(Math.round(avg*10)/10)+' nelle ultime sessioni. Per crescere servono serie vicine al cedimento: punta a 1-2.'});
    } else if(avg<=1.0){
      out.push({p:7, type:'good', title:PROGRAM[dayKey].label+': intensità alta',
        text:'RIR medio '+(Math.round(avg*10)/10)+', stai spingendo davvero. Tieni d\u2019occhio il recupero se prosegue per settimane.'});
    }
  });

  // 3. Giorno trascurato
  Object.keys(PROGRAM).forEach(dayKey=>{
    const h = logData.dayHistory[dayKey] || [];
    if(h.length===0) return;
    const d = Math.floor((now - new Date(h[h.length-1].date).getTime())/86400000);
    if(d>=10){
      out.push({p:3, type:'warn', title:PROGRAM[dayKey].label+' indietro',
        text:'Non lo alleni da '+d+' giorni. Il volume settimanale su questi gruppi sta calando.'});
    }
  });

  // 4. Range chiuso: pronto a salire
  Object.keys(PROGRAM).forEach(dayKey=>{
    PROGRAM[dayKey].exercises.forEach(exo=>{
      const last = getLastEntry(dayKey, exo.id);
      if(!last || !last.work || !last.work[0]) return;
      if(last.work[0].r >= exo.max && last.work[0].w>0){
        out.push({p:4, type:'good', title:'Sali di carico su '+exo.name,
          text:'Hai chiuso il range a '+tidy(last.work[0].w)+'kg × '+last.work[0].r+'. La prossima parti da '+tidy(last.work[0].w+increment(exo))+'kg.'});
      }
    });
  });

  // 5. Progressione confermata sull'esercizio con più crescita
  let bestGain = null;
  Object.keys(PROGRAM).forEach(dayKey=>{
    PROGRAM[dayKey].exercises.forEach(exo=>{
      const s = strengthSeries(dayKey, exo.id);
      if(s.length<4) return;
      const gain = s[s.length-1].val - s[0].val;
      const pct = s[0].val>0 ? gain/s[0].val*100 : 0;
      if(gain>1 && (!bestGain || gain>bestGain.gain)) bestGain = {name:exo.name, gain:gain, pct:pct, n:s.length};
    });
  });
  if(bestGain){
    out.push({p:5, type:'good', title:bestGain.name+' in crescita',
      text:'+'+Math.round(bestGain.gain)+'kg di forza stimata in '+bestGain.n+' sessioni ('+Math.round(bestGain.pct)+'%). Continua così.'});
  }

  // 6. Frequenza settimanale
  const ws = weekStats();
  if(ws.sessions===0){
    const anyData = Object.keys(logData.dayHistory).some(k=>(logData.dayHistory[k]||[]).length>0);
    out.push({p:0, type:anyData?'warn':'info', title: anyData?'Settimana ferma':'Inizia a registrare',
      text: anyData ? 'Nessuna sessione negli ultimi 7 giorni. Rimettiti in moto oggi.' : 'Registra il primo allenamento: da lì partono suggerimenti e progressione dei carichi.'});
  } else if(ws.sessions>=4){
    out.push({p:7, type:'good', title:'Frequenza in linea',
      text:ws.sessions+' sessioni negli ultimi 7 giorni. È il ritmo giusto per il tuo split.'});
  }

  // 7. Deload dopo lunga progressione continua
  let longRun = 0;
  Object.keys(PROGRAM).forEach(dayKey=>{
    PROGRAM[dayKey].exercises.forEach(exo=>{
      const s = strengthSeries(dayKey, exo.id);
      if(s.length>=8){
        const up = s.slice(-8).every((p,i,a)=> i===0 || p.val>=a[i-1].val*0.99);
        if(up) longRun++;
      }
    });
  });
  if(deloadActive()){
    out.unshift({p:-1, type:'info', title:'Settimana di scarico in corso',
      text:'Carichi ridotti del 40% per '+deloadDaysLeft()+' giorni. Tecnica pulita e niente cedimento: serve a recuperare.',
      action:'end-deload', actionLabel:'Termina ora'});
  } else if(longRun>=3){
    out.push({p:8, type:'info', title:'Valuta una settimana di scarico',
      text:'Progressione continua da 8+ sessioni su più esercizi. Un deload ora ti fa ripartire più forte.',
      action:'start-deload', actionLabel:'Attiva scarico'});
  }

  out.sort((a,b)=>a.p-b.p);
  return out.slice(0,3);
}

function buildHeatmap(days){  const per = {};
  Object.keys(PROGRAM).forEach(k=>{
    (logData.dayHistory[k]||[]).forEach(e=>{
      if(!per[e.date]) per[e.date] = {tonnage:0, set:new Set()};
      per[e.date].tonnage += e.tonnage;
      per[e.date].set.add(PROGRAM[k].label);
    });
  });
  const vals = Object.keys(per).map(k=>per[k].tonnage);
  const mx = vals.length ? Math.max.apply(null, vals) : 1;
  const out = [];
  const today = new Date();
  for(let i=days-1;i>=0;i--){
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    const iso = new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
    const e = per[iso];
    const t = e ? e.tonnage : 0;
    let lvl = 0;
    if(t>0){ const r=t/mx; lvl = r>0.75?4:(r>0.5?3:(r>0.25?2:1)); }
    out.push({date:iso, tonnage:t, days: e ? Array.from(e.set) : [], level:lvl});
  }
  return out;
}
function setupHeatmap(){

    });

   Sostituisce quella di sistema: non si apre e chiude di continuo,
   non fa saltare lo scroll e accetta la virgola.

function getFieldModel(f){
  if(!f) return null;
  if(f.scope==='hist'){
    const arr = logData.entries[exKey(f.day, f.exoId)] || [];
    const entry = arr.filter(e=>e.date===f.date)[0];
    if(!entry) return null;
    const list = f.kind==='wu' ? (entry.warmups||[]) : (entry.work||[]);
    const obj = list[f.index];
    if(!obj) return null;
    const exoDef = PROGRAM[f.day].exercises.filter(e=>e.id===f.exoId)[0];
    return {exo:exoDef, obj:obj, hist:true, day:f.day, date:f.date};
  }
  const exo = PROGRAM[currentDay].exercises.filter(e=>e.id===f.exoId)[0];
  if(!exo) return null;
  if(f.kind==='wu'){
    const wu = getWarmups(exo);
    return wu[f.index] ? {exo:exo, obj:wu[f.index]} : null;
  }
  const work = getWork(exo);
  if(!work[f.index]) work[f.index] = {w:0, r:0, rir:null};
  return {exo:exo, obj:work[f.index]};
}
function currentFieldValue(){
  const m = getFieldModel(activeField);
  if(!m) return '';
  const v = m.obj[activeField.field];
  return (v===null || v===undefined || v===0) ? '' : String(v);
}
function commitBuffer(){
  const m = getFieldModel(activeField);
  if(!m) return;
  const val = keypadBuffer==='' ? 0 : parseNum(keypadBuffer);
  if(m.hist){
    // correzione di una sessione gia' salvata: aggiorno anche il totale
    m.obj[activeField.field] = val;
    recalcSessionTonnage(m.day, m.date);
    saveData();
    return;
  }
  const wasDone = activeField.kind==='work' ? isSetDone(m.obj) : false;
  m.obj[activeField.field] = val;
  if(activeField.kind==='work'){
    const work = getWork(m.exo);
    const o = work[activeField.index];
    if(o && !(o.w>0) && !(o.r>0) && (o.rir===null||o.rir===undefined)) work[activeField.index] = null;
    if(!wasDone && isSetDone(work[activeField.index])) startRest(restSecondsFor(m.exo, false));
  } else {
    if(m.obj.w>0 && m.obj.r>0) startRest(restSecondsFor(m.exo, true));
  }
}
function setRir(v){
  const m = getFieldModel(activeField);
  if(!m || activeField.kind!=='work') return;
  const work = getWork(m.exo);
  if(!work[activeField.index]) work[activeField.index] = {w:0,r:0,rir:null};
  const wasDone = isSetDone(work[activeField.index]);
  work[activeField.index].rir = v;
  if(!wasDone && isSetDone(work[activeField.index])) startRest(restSecondsFor(m.exo, false));
}
function recalcSessionTonnage(day, date){
  let t = 0;
  PROGRAM[day].exercises.forEach(exo=>{
    const e = getEntries(day, exo.id).filter(x=>x.date===date)[0];
    if(!e) return;
    (e.work||[]).forEach(st=>{ t += (st.w||0)*(st.r||0); });
    (e.warmups||[]).forEach(st=>{ t += (st.w||0)*(st.r||0); });
  });
  const rec = (logData.dayHistory[day]||[]).filter(x=>x.date===date)[0];
  if(rec) rec.tonnage = Math.round(t);
}

function nextField(){
  const f = activeField;
  if(!f) return null;
  if(f.scope==='hist') return null;   // nello storico si corregge un valore per volta
  const exo = PROGRAM[currentDay].exercises.filter(e=>e.id===f.exoId)[0];
  if(!exo) return null;
  if(f.field==='w') return {exoId:f.exoId, kind:f.kind, index:f.index, field:'r'};
  if(f.field==='r' && f.kind==='work') return {exoId:f.exoId, kind:'work', index:f.index, field:'rir'};
  if(f.field==='rir' || (f.field==='r' && f.kind==='wu')){
    const limit = f.kind==='wu' ? getWarmups(exo).length : exo.sets;
    if(f.index+1 < limit) return {exoId:f.exoId, kind:f.kind, index:f.index+1, field:'w'};
    if(f.kind==='wu' && exo.sets>0) return {exoId:f.exoId, kind:'work', index:0, field:'w'};
  }
  return null;
}
function makeCell(exoId, kind, index, field, value, placeholder){
  const cell = document.createElement('div');
  const isActive = activeField && activeField.exoId===exoId && activeField.kind===kind
                   && activeField.index===index && activeField.field===field;
  cell.className = 'cell'+(isActive?' cell-active':'');
  if(isActive){
    cell.innerHTML = '<span>'+(keypadBuffer===''?'':keypadBuffer.replace('.', ','))+'</span><span class="caret"></span>';
  } else if(value!==null && value!==undefined && value!==0 && value!==''){
    cell.textContent = field==='w' ? fmtNum(value) : String(value);
  } else {
    cell.innerHTML = '<span class="ph">'+placeholder+'</span>';
  }
  cell.addEventListener('click', ()=>{
    if(activeField) commitBuffer();
    activeField = {exoId:exoId, kind:kind, index:index, field:field};
    keypadBuffer = '';
    const cv = currentFieldValue();
    keypadBuffer = (cv==='0') ? '' : cv;
    renderApp();
  });
  return cell;
}

    renderApp();
  });
}

function renderWorkout(){
  const root = document.getElementById('screen-root');
  root.innerHTML = '';
  const day = PROGRAM[currentDay];

  const top = document.createElement('div');
  top.className = 'card';
  const tot = tonnageForDay(currentDay);
  const prev = lastDayTonnage(currentDay);
  let doneSets=0, totSets=0;
  day.exercises.forEach(e=>{ totSets+=e.sets; doneSets+=getWork(e).filter(isSetDone).length; });
  const complete = totSets>0 && doneSets===totSets;
  let delta;
  if(prev===null || prev<=0){
    delta = '<span class="tonnage-delta flat">prima volta</span>';
  } else if(!complete){
    // a meta' sessione il confronto con un allenamento intero dice solo
    // "-83%", che non e' un'informazione: si mostra a sessione conclusa
    delta = '<span class="tonnage-delta flat">'+doneSets+'/'+totSets+' serie</span>';
  } else {
    const d = tot-prev, p = Math.round((d/prev)*100);
    const cls = d>0?'up':(d<0?'down':'flat');
    delta = '<span class="tonnage-delta '+cls+'">'+(d>0?'+':'')+d.toLocaleString('it-IT')+'kg ('+(p>=0?'+':'')+p+'%)</span>';
  }
  const elapsedNow = activeWorkout ? (activeWorkout.elapsedMs + (activeWorkout.runningSince ? Date.now()-activeWorkout.runningSince : 0)) : 0;
  top.innerHTML =
    '<div class="tonnage-row">'+
      '<span class="tonnage-value">'+tot.toLocaleString('it-IT')+'</span><span class="tonnage-unit">kg</span>'+
      '<span class="session-time"><span class="session-dot">·</span><span id="workout-timer-live">'+formatClock(elapsedNow)+'</span></span>'+
      delta+
    '</div>';
  root.appendChild(top);

  if(deloadActive()){
    const dl = document.createElement('div');
    dl.className = 'deload-banner';
    dl.innerHTML = '<b>Scarico</b> · carichi ridotti, '+deloadDaysLeft()+' giorni rimasti';
    root.appendChild(dl);
  }

  const activeExo = day.exercises.filter(e=>!skipped[e.id] && !isExerciseComplete(effExo(e)))[0];
  const activeId = activeExo ? activeExo.id : null;

  day.exercises.forEach(baseExo=>{
    const exo = effExo(baseExo);
    const isSkipped = !!skipped[baseExo.id];
    const key = exKey(currentDay, exo.id);
    const isActive = exo.id===activeId;
    const expanded = (cardOverride[key]!==undefined) ? cardOverride[key] : isActive;
    const work = getWork(exo);
    const warmups = getWarmups(exo);
    const sug = computeSuggestions(currentDay, exo);

    const card = document.createElement('div');
    card.className = 'card exercise '+(expanded?'expanded':'collapsed')+(isActive?' is-active':'');

    // un "record" alla prima sessione non significa nulla: serve un confronto
    const variant = variantOf(exo);
    const prevEntries = entriesForVariant(currentDay, exo).filter(e=>e.date!==todayISO());
    const best = getBestE1rm(currentDay, exo.id, variant);
    let todayBest = 0;
    work.forEach(s=>{ if(s) todayBest = Math.max(todayBest, e1rm(s.w,s.r)); });
    const isPR = prevEntries.length>0 && todayBest>0 && (!best || todayBest>best.val);

    const done = work.filter(isSetDone).length;
    const head = document.createElement('div');
    head.className='exercise-header';
    const swapBadge = swaps[baseExo.id] ? '<span class="swap-badge">sostituito</span>' : '';
    const skipBadge = isSkipped ? '<span class="skip-badge">saltato</span>' : '';
    head.innerHTML =
      '<div style="min-width:0;flex:1;"><h3>'+exo.name+(isPR?'<span class="pr-badge">PR</span>':'')+swapBadge+skipBadge+'</h3>'+
      '<div class="target">'+(isSkipped ? 'non lo fai oggi' : (expanded
        ? exo.sets+' × '+exo.min+'-'+exo.max+' rip'
        : (done===exo.sets ? 'completato' : (done>0 ? done+'/'+exo.sets+' serie' : exo.sets+' × '+exo.min+'-'+exo.max+' rip'))))+
      '</div></div>'+
      '<button class="ex-menu" data-menu="'+baseExo.id+'">•••</button>'+
      '<div class="chevron">'+(expanded?'−':'+')+'</div>';
    head.addEventListener('click', (ev)=>{
      if(ev.target && ev.target.dataset && ev.target.dataset.menu){
        swapSheetFor = baseExo.id; renderApp(); return;
      }
      cardOverride[key] = !expanded; renderApp();
    });
    card.appendChild(head);
    if(isSkipped){ card.classList.add('is-skipped'); root.appendChild(card); return; }

    if(expanded){
      const restS = restSecondsFor(exo, false);
      const restLine = document.createElement('div');
      restLine.className = 'rest-hint';
      restLine.textContent = 'Recupero consigliato: '+Math.floor(restS/60)+':'+String(restS%60).padStart(2,'0')+
                             (exo.iso ? ' (isolamento)' : ' (multiarticolare)');
      card.appendChild(restLine);

      const goal = goalTextFor(currentDay, exo);
      if(goal){
        const g = document.createElement('div');
        g.className='goal-line';
        g.innerHTML = goal;
        card.appendChild(g);
      }

      const topW = topWorkWeight(currentDay, exo, sug);
      const ramp = warmupRamp(exo, topW);

      if(warmups.length>0){
        const wl = document.createElement('div');
        wl.className='col-labels';
        wl.innerHTML='<span>W</span><span>Kg</span><span>Rip</span><span></span><span></span>';
        card.appendChild(wl);
        warmups.forEach((wu,wi)=>{
          const row = document.createElement('div');
          row.className='set-row';
          const idx = document.createElement('div');
          idx.className='set-idx';
          idx.textContent = 'W'+(wi+1);
          const wCell = makeCell(exo.id, 'wu', wi, 'w', wu.w||null, 'kg');
          const rCell = makeCell(exo.id, 'wu', wi, 'r', wu.r||null, 'rip');
          const del = document.createElement('button');
          del.className='wu-remove'; del.textContent='×';
          del.addEventListener('click', ()=>{
            warmups.splice(wi,1);
            if(activeField && activeField.exoId===exo.id && activeField.kind==='wu') activeField=null;
            renderApp();
          });
          const sp = document.createElement('div');
          row.appendChild(idx); row.appendChild(wCell); row.appendChild(rCell); row.appendChild(del); row.appendChild(sp);
          card.appendChild(row);
        });
      }

      const addBtn = document.createElement('button');
      addBtn.className='btn-pill add-wu';
      addBtn.textContent='+ Warmup';
      addBtn.addEventListener('click', ()=>{
        const r = warmupRamp(exo, topW);
        const next = r.length ? r[Math.min(warmups.length, r.length-1)] : {w: roundToStep((topW||0)*0.5, increment(exo)), r:8};
        warmups.push({w:next.w, r:next.r});
        renderApp();
      });
      card.appendChild(addBtn);

      if(warmups.length===0 && ramp.length>0){
        const hint = document.createElement('div');
        hint.className='wu-hint';
        hint.textContent = 'Consigliati '+ramp.length+': '+ramp.map(x=>tidy(x.w)+'×'+x.r).join(' · ');
        card.appendChild(hint);
      } else if(warmups.length===0 && topW>0){
        const hint = document.createElement('div');
        hint.className='wu-hint';
        hint.textContent = 'Nessun avvicinamento necessario a questo carico.';
        card.appendChild(hint);
      } else if(warmups.length===0){
        const hint = document.createElement('div');
        hint.className='wu-hint';
        hint.textContent = 'Inserisci la serie 1 per avere i warmup consigliati.';
        card.appendChild(hint);
      }

      const cl = document.createElement('div');
      cl.className='col-labels';
      cl.innerHTML='<span>Set</span><span>Kg</span><span>Rip</span><span>RIR</span><span>Target</span>';
      card.appendChild(cl);

      const cur = firstUnfilled(exo);
      const last = getLastEntry(currentDay, exo.id);
      const lastWork = last ? last.work : null;

      for(let i=0;i<exo.sets;i++){
        const s = work[i];
        const row = document.createElement('div');
        row.className = 'set-row'+(i===cur?' current':'')+(isSetDone(s)?' done':'');

        const idx = document.createElement('div'); idx.className='set-idx'; idx.textContent=(i+1);

        const wCell = makeCell(exo.id, 'work', i, 'w',
          s && s.w ? s.w : null,
          (lastWork && lastWork[i] && lastWork[i].w) ? fmtNum(lastWork[i].w) : 'kg');
        const rCell = makeCell(exo.id, 'work', i, 'r',
          s && s.r ? s.r : null,
          (lastWork && lastWork[i] && lastWork[i].r) ? String(lastWork[i].r) : 'rip');

        const rirWrap = document.createElement('div');
        rirWrap.className = 'rir-cell'+(isSetPartial(s)?' needs-rir':'');
        rirWrap.textContent = (s && s.rir!==null && s.rir!==undefined) ? (s.rir===4?'4+':String(s.rir)) : '–';
        rirWrap.addEventListener('click', ()=>{
          activeField = {exoId:exo.id, kind:'work', index:i, field:'rir'};
          keypadBuffer = '';
          renderApp();
        });
        if(activeField && activeField.exoId===exo.id && activeField.kind==='work' && activeField.index===i && activeField.field==='rir'){
          rirWrap.classList.add('cell-active');
        }

        const sg = document.createElement('div');
        // il target si mostra solo sulla prossima serie da fare: ripeterlo su
        // tutte le righe e' rumore
        if(i===cur && sug[i]!==null && sug[i]!==undefined){ sg.className='suggest'; sg.textContent = fmtNum(sug[i])+'kg'; }
        else { sg.className='suggest muted'; sg.textContent=''; }

        row.appendChild(idx); row.appendChild(wCell); row.appendChild(rCell); row.appendChild(rirWrap); row.appendChild(sg);
        card.appendChild(row);
      }
    }
    root.appendChild(card);
  });

  const sw = document.createElement('div');
  sw.style.marginTop='16px';
  sw.innerHTML = '<button class="save" id="save-btn">Salva allenamento</button>';
  root.appendChild(sw);
  document.getElementById('save-btn').addEventListener('click', saveSession);
}

/* =========================================================
   SALVATAGGIO + RIEPILOGO
   ========================================================= */
async function saveSession(){
  const day = currentDay;
  const date = todayISO();

  let partial = false;
  PROGRAM[day].exercises.forEach(baseExo=>{
    if(skipped[baseExo.id]) return;
    getWork(effExo(baseExo)).forEach(s=>{ if(isSetPartial(s)) partial = true; });
  });
  if(partial){ showToast('Completa il RIR di ogni serie iniziata.', true); return; }

  const priorBest = {}, hadHistory = {};
  PROGRAM[day].exercises.forEach(baseExo=>{
    const exo = effExo(baseExo);
    priorBest[baseExo.id] = getBestE1rm(day, baseExo.id, variantOf(exo));
    hadHistory[baseExo.id] = entriesForVariant(day, exo).filter(e=>e.date!==todayISO()).length>0;
  });
  const swapNames = Object.keys(swaps).map(k=>swaps[k].name);

  let any = false;
  const prs = [];
  PROGRAM[day].exercises.forEach(baseExo=>{
    if(skipped[baseExo.id]) return;
    const exo = effExo(baseExo);
    const work = getWork(exo);
    const wu = getWarmups(exo);
    const ws = [];
    let has = false, tb = 0;
    for(let i=0;i<exo.sets;i++){
      const s = work[i] || {w:0,r:0,rir:null};
      ws.push({w:s.w||0, r:s.r||0, rir:(s.rir===undefined?null:s.rir)});
      if((s.w||0)>0 && (s.r||0)>0){ has=true; tb = Math.max(tb, e1rm(s.w,s.r)); }
    }
    const wus = wu.filter(s=>s && s.w>0 && s.r>0).map(s=>({w:s.w, r:s.r}));
    if(has || wus.length>0) any = true;
    if(has || wus.length>0){
      const k = exKey(day, exo.id);
      if(!logData.entries[k]) logData.entries[k] = [];
      const arr = logData.entries[k];
      const entry = {date:date, work:ws, warmups:wus};
      if(swaps[baseExo.id]) entry.swappedTo = swaps[baseExo.id].name;
      if(arr.length && arr[arr.length-1].date===date) arr[arr.length-1] = entry;
      else arr.push(entry);
      if(arr.length>30) arr.shift();
    }
    const pb = priorBest[baseExo.id];
    if(hadHistory[baseExo.id] && tb>0 && (!pb || tb>pb.val)) prs.push(exo.name);
  });

  if(!any){ showToast('Registra almeno una serie completa.', true); return; }

  const tonnage = tonnageForDay(day);
  if(!logData.dayHistory[day]) logData.dayHistory[day] = [];
  const dh = logData.dayHistory[day];
  let prevTon = null;
  if(dh.length){
    prevTon = (dh[dh.length-1].date===date)
      ? (dh.length>1 ? dh[dh.length-2].tonnage : null)
      : dh[dh.length-1].tonnage;
  }
  const durStr = (function(ms){
    const t=Math.floor(ms/1000);
    const hh=String(Math.floor(t/3600)).padStart(2,'0');
    const mm=String(Math.floor((t%3600)/60)).padStart(2,'0');
    const ss=String(t%60).padStart(2,'0');
    return hh+':'+mm+':'+ss;
  })(activeWorkout ? (activeWorkout.elapsedMs + (activeWorkout.runningSince ? Date.now()-activeWorkout.runningSince : 0)) : 0);
  const readiness = activeWorkout ? (activeWorkout.readiness||null) : null;
  const prevEffort = (dh.filter(x=>x.date===date)[0]||{}).effort || null;
  if(dh.length && dh[dh.length-1].date===date) dh[dh.length-1] = {date:date, tonnage:tonnage, duration:durStr, readiness:readiness, effort:prevEffort};
  else dh.push({date:date, tonnage:tonnage, duration:durStr, readiness:readiness, effort:prevEffort});
  if(dh.length>30) dh.shift();

  const elapsed = activeWorkout ? (activeWorkout.elapsedMs + (activeWorkout.runningSince ? Date.now()-activeWorkout.runningSince : 0)) : 0;
  const setsDone = PROGRAM[day].exercises.reduce((n,e)=> n + (skipped[e.id]?0:getWork(effExo(e)).filter(isSetDone).length), 0);

  const ok = await saveData();
  lastRecap = {day:day, tonnage:tonnage, prevTon:prevTon, elapsed:elapsed, prs:prs, setsDone:setsDone};
  restTimer = null;
  pendingEffort = {day:day, date:date};
  appView = 'effort';
  renderApp();
  if(!ok) showToast('Allenamento registrato, ma non salvato in modo permanente.', true);
}

function renderSwapSheet(){
  const root = document.getElementById('swap-sheet-root');
  if(!swapSheetFor){ root.innerHTML=''; return; }
  const base = PROGRAM[currentDay].exercises.filter(e=>e.id===swapSheetFor)[0];
  if(!base){ root.innerHTML=''; return; }
  const alts = ALTERNATIVES[base.id] || [];
  const isSwapped = !!swaps[base.id];
  const isSkipped = !!skipped[base.id];

  let rows = '';
  if(isSwapped){
    rows += '<div class="sheet-row" data-act="restore"><div><div class="dsr-name">Ripristina '+base.name+'</div>'+
            '<div class="dsr-sub">torna all\u2019esercizio della scheda</div></div><div class="chevron">›</div></div>';
  }
  alts.forEach(a=>{
    const active = isSwapped && swaps[base.id].id===a.id;
    rows += '<div class="sheet-row'+(active?' row-active':'')+'" data-alt="'+a.id+'">'+
      '<div><div class="dsr-name">'+a.name+'</div>'+
      '<div class="dsr-sub">'+(a.iso?'isolamento':'multiarticolare')+' · scatti da '+fmtNum(a.inc)+'kg</div></div>'+
      '<div class="chevron">'+(active?'✓':'›')+'</div></div>';
  });
  if(alts.length===0 && !isSwapped){
    rows += '<div class="sheet-row" style="opacity:.5"><div class="dsr-name">Nessuna alternativa suggerita</div></div>';
  }
  rows += '<div class="sheet-row" data-act="skip"><div><div class="dsr-name">'+(isSkipped?'Rimetti in programma':'Salta oggi')+'</div>'+
          '<div class="dsr-sub">'+(isSkipped?'torna tra gli esercizi da fare':'non conta nel riepilogo')+'</div></div><div class="chevron">›</div></div>';

  root.innerHTML =
    '<div class="sheet-scrim" id="swap-scrim"></div>'+
    '<div class="day-sheet"><div class="sheet-handle"></div>'+
    '<div class="sheet-title">'+base.name+'</div>'+
    '<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">Vale solo per l\u2019allenamento di oggi. Lo storico resta legato allo slot della scheda.</div>'+
    rows+
    '<button class="sheet-cancel" id="swap-cancel">Annulla</button></div>';

  const close = ()=>{ swapSheetFor=null; renderApp(); };
  document.getElementById('swap-scrim').addEventListener('click', close);
  document.getElementById('swap-cancel').addEventListener('click', close);
  root.querySelectorAll('.sheet-row').forEach(r=>{
    r.addEventListener('click', ()=>{
      if(r.dataset.act==='restore'){ delete swaps[base.id]; }
      else if(r.dataset.act==='skip'){
        if(skipped[base.id]) delete skipped[base.id]; else skipped[base.id]=true;
      }
      else if(r.dataset.alt){
        const a = alts.filter(x=>x.id===r.dataset.alt)[0];
        if(a){ swaps[base.id] = a; delete skipped[base.id]; }
      }
      swapSheetFor = null;
      renderApp();
    });
  });
}
