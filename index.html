<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scheda">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Registro allenamenti con progressione dei carichi">
<title>Scheda</title>
<style>
  /* =========================================================
     SISTEMA VISIVO
     Tre regole: raggi piccoli e costanti, superfici piatte separate
     da filetti invece che da riquadri sospesi, accento riservato
     all'azione principale e agli avvisi. Tutto il resto e' tipografia.
     ========================================================= */
  :root{
    --bg:#050506;
    --surface:#0c0d0f;
    --surface-2:#141518;
    --surface-3:#1c1d21;
    --hairline: rgba(255,255,255,0.075);
    --hairline-strong: rgba(255,255,255,0.15);
    --text:#f2f2f3;
    --text-secondary: rgba(242,242,243,0.60);
    --text-muted: rgba(242,242,243,0.34);
    --accent:#c81e3a;
    --accent-dim: rgba(200,30,58,0.14);
    --on-accent:#ffffff;
    --success:#34c76f;
    --danger:#ff453a;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
    --r-xs:3px; --r-sm:5px; --r-md:7px; --r-lg:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{margin:0;padding:0;background:var(--bg);overflow-x:hidden;}
  body{
    margin:0; padding:0; background:var(--bg);
    color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    min-height:100vh; padding-top:env(safe-area-inset-top);
  }
  body.workout-view{ padding-top:0; }
  .app{ max-width:480px; margin:0 auto; padding:16px 16px 120px; }
  /* i numeri stanno in colonna: cifre a larghezza fissa ovunque */
  .stat-val,.metric-val,.tonnage-value,.trend-val,.hl-date,.hl-kg,.ed-num,.det-sum,
  .month-sum,.bb-timer,.rest-time,.session-time,.set-idx,.cell,.rir-cell,.suggest,
  .kp-key,.kp-rir-btn,.ex-note-rule b{ font-variant-numeric:tabular-nums; }

  /* ---------- intestazione ---------- */
  .header{ margin-bottom:22px; }
  .eyebrow{ font-size:10.5px; font-weight:600; letter-spacing:0.10em; color:var(--text-muted); text-transform:uppercase; margin-bottom:5px; }
  h1.title{ font-size:27px; font-weight:650; letter-spacing:-0.021em; margin:0; }
  .section-label{
    font-size:10px; font-weight:650; letter-spacing:0.11em; text-transform:uppercase;
    color:var(--text-muted); margin:0 0 9px;
  }
  .app > .section-label{ margin-top:24px; }

  /* ---------- contenitori ---------- */
  .card{
    background:var(--surface); border:1px solid var(--hairline);
    border-radius:var(--r-md); padding:14px; margin-bottom:10px;
  }
  .hero{
    background:var(--surface); border:1px solid var(--hairline);
    border-radius:var(--r-md); padding:16px; margin-bottom:10px;
  }
  .hero-eyebrow{ font-size:10px; font-weight:650; letter-spacing:0.11em; text-transform:uppercase; color:var(--text-muted); margin-bottom:7px; }
  .hero-day{ font-size:21px; font-weight:650; letter-spacing:-0.018em; margin-bottom:3px; }
  .hero-meta{ font-size:12.5px; color:var(--text-secondary); margin-bottom:15px; }

  /* ---------- selezione allenamento ---------- */
  .pick{ border:1px solid var(--hairline); border-radius:var(--r-md); overflow:hidden; background:var(--surface); }
  .pick-row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:none; border:none; border-bottom:1px solid var(--hairline);
    color:var(--text); font-family:var(--font); padding:13px 14px; cursor:pointer;
    transition:background .12s;
  }
  .pick-row:last-child{ border-bottom:none; }
  .pick-row:active{ background:var(--surface-2); }
  .pick-main{ flex:1; min-width:0; }
  .pick-name{ font-size:15px; font-weight:600; letter-spacing:-0.008em; display:flex; align-items:center; gap:8px; }
  .pick-meta{ font-size:11.5px; color:var(--text-muted); margin-top:4px; font-variant-numeric:tabular-nums; }
  .pick-tag{
    font-size:9px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--accent); border-radius:var(--r-xs);
    padding:1.5px 5px; flex:none;
  }
  .pick-row .chevron{ color:var(--text-muted); }

  /* ---------- metriche ---------- */
  .stat-strip{
    display:flex; border:1px solid var(--hairline); border-radius:var(--r-md);
    background:var(--surface); overflow:hidden; margin-bottom:10px;
  }
  .stat-cell{ flex:1; padding:12px 13px; border-right:1px solid var(--hairline); }
  .stat-cell:last-child{ border-right:none; }
  .stat-val{ font-family:var(--font-mono); font-weight:650; font-size:20px; letter-spacing:-0.02em; line-height:1.1; }
  .stat-lab{ font-size:9.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.09em; margin-top:5px; font-weight:600; }

  /* ---------- comandi ---------- */
  button.save{
    width:100%; background:var(--accent); color:var(--on-accent); border:1px solid var(--accent);
    font-family:var(--font); font-weight:650; font-size:14.5px; letter-spacing:-0.005em;
    min-height:48px; padding:0 16px; border-radius:var(--r-sm); cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  button.save:active{ background:#a81830; border-color:#a81830; }
  .btn-pill{
    border:1px solid var(--hairline-strong); background:var(--surface-2); color:var(--text);
    font-family:var(--font); font-weight:600; font-size:13px; padding:0 15px;
    min-height:44px; border-radius:var(--r-sm); cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  .btn-pill:active{ background:var(--surface-3); }
  .btn-pill:disabled{ opacity:.32; cursor:default; }
  .btn-pill.danger-outline{ border-color:rgba(255,69,58,0.45); color:var(--danger); background:transparent; }
  .btn-pill.danger-solid{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .icon-btn{
    background:var(--surface-2); border:1px solid var(--hairline-strong); color:var(--text-secondary);
    width:40px; height:40px; border-radius:var(--r-sm); font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .tools-link{
    display:block; width:100%; text-align:center; font-size:11.5px; color:var(--text-muted);
    margin-top:18px; cursor:pointer; padding:8px; letter-spacing:0.02em;
  }
  .chevron{
    font-family:var(--font); font-size:16px; color:var(--text-muted);
    width:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  /* ---------- schede a linguetta ---------- */
  .day-grid{ display:flex; gap:0; margin-bottom:12px; border-bottom:1px solid var(--hairline); overflow-x:auto; }
  .day-grid::-webkit-scrollbar{ display:none; }
  .day-btn{
    flex:0 0 auto; background:none; border:none; border-bottom:2px solid transparent;
    color:var(--text-muted); font-family:var(--font); cursor:pointer;
    padding:0 13px 9px; margin-bottom:-1px; text-align:left; white-space:nowrap;
    transition:color .12s, border-color .12s;
  }
  .day-btn:first-child{ padding-left:0; }
  .day-btn-name{ font-size:13px; font-weight:600; display:block; }
  .day-btn-sub{ display:none; }
  .day-btn.active{ color:var(--text); border-bottom-color:var(--accent); }

  .ex-chips{ display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch; }
  .ex-chips::-webkit-scrollbar{ display:none; }
  .ex-chip{
    flex:0 0 auto; background:var(--surface-2); border:1px solid var(--hairline); color:var(--text-secondary);
    font-family:var(--font); font-weight:600; font-size:12px; padding:0 12px; min-height:34px;
    border-radius:var(--r-xs); cursor:pointer; white-space:nowrap; transition:background .12s, color .12s, border-color .12s;
  }
  .ex-chip.active{ background:var(--surface-3); border-color:var(--hairline-strong); color:var(--text); }

  /* ---------- grafico ---------- */
  .trend-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin:2px 0 6px; flex-wrap:wrap; }
  .trend-val{ font-family:var(--font-mono); font-weight:650; font-size:26px; line-height:1; letter-spacing:-0.02em; }
  .trend-unit{ font-size:13px; color:var(--text-secondary); margin-left:3px; font-weight:400; }
  .trend-sub{ font-size:10.5px; color:var(--text-muted); margin-top:5px; text-transform:uppercase; letter-spacing:0.07em; font-weight:600; }
  .line-wrap{ width:100%; margin-top:6px; }
  .line-svg{ width:100%; height:110px; display:block; touch-action:none; cursor:crosshair; }
  .chart-foot{ font-size:11px; color:var(--text-muted); margin-top:8px; text-align:center; min-height:16px; }
  .chart-empty{ text-align:center; font-size:12px; color:var(--text-muted); padding:26px 10px; }
  .tonnage-delta{
    font-family:var(--font-mono); font-size:11.5px; font-weight:650;
    padding:3px 7px; border-radius:var(--r-xs); border:1px solid var(--hairline);
    color:var(--text-secondary); background:var(--surface-2);
  }
  .tonnage-delta.up{ color:var(--success); border-color:rgba(52,199,111,0.3); background:rgba(52,199,111,0.08); }
  .tonnage-delta.down{ color:var(--danger); border-color:rgba(255,69,58,0.3); background:rgba(255,69,58,0.08); }

  /* ---------- analisi ---------- */
  .coach-item{ padding:11px 0; border-bottom:1px solid var(--hairline); }
  .coach-item:first-of-type{ padding-top:0; }
  .coach-item:last-child{ border-bottom:none; padding-bottom:0; }
  .coach-title{ font-size:13px; font-weight:650; margin-bottom:4px; letter-spacing:-0.005em; }
  .coach-item.warn .coach-title{ color:var(--accent); }
  .coach-item.good .coach-title, .coach-item.info .coach-title{ color:var(--text); }
  .coach-text{ font-size:12px; color:var(--text-secondary); line-height:1.5; }
  .coach-action{ margin-top:10px; }

  /* ---------- sessione ---------- */
  .workout-top{
    position:fixed; top:0; left:0; right:0; max-width:480px; margin:0 auto; z-index:800;
    background-color:#050506; padding:6px 16px 8px;
    padding-top:calc(6px + env(safe-area-inset-top));
    border-bottom:1px solid var(--hairline);
  }
  .workout-header{ display:flex; align-items:center; gap:8px; padding:2px 0 8px; }
  .back-btn{
    background:none; border:none; color:var(--text-secondary); font-family:var(--font);
    font-weight:400; font-size:26px; line-height:1; width:28px; min-height:40px; padding:0; cursor:pointer; flex-shrink:0;
  }
  .workout-header-title{ font-size:15px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.01em; }
  .rest-pill{
    display:flex; align-items:center; flex-shrink:0; margin-left:auto;
    background:var(--surface-2); border:1px solid var(--hairline-strong); border-radius:var(--r-sm);
  }
  .rest-pill.idle{ opacity:0.4; }
  .rest-time{
    background:none; border:none; color:var(--text);
    font-family:var(--font-mono); font-weight:650; font-size:14px;
    min-height:38px; padding:0 10px; cursor:pointer;
  }
  .rest-time.idle-time{ color:var(--text-muted); line-height:38px; }
  .rest-x{ background:none; border:none; color:var(--text-muted); font-size:16px; width:30px; min-height:38px; cursor:pointer; }
  .rest-pill.expired{ background:var(--accent); border-color:var(--accent); animation:restBlink 1.1s step-start infinite; }
  @keyframes restBlink{ 50%{ opacity:0.45; } }
  .rest-pill.expired .rest-time, .rest-pill.expired .rest-x{ color:var(--on-accent); }
  .tonnage-row{ display:flex; align-items:baseline; gap:0; flex-wrap:wrap; }
  .tonnage-value{ font-family:var(--font-mono); font-weight:650; font-size:22px; letter-spacing:-0.02em; }
  .tonnage-unit{ font-size:12.5px; color:var(--text-secondary); margin-left:5px; }
  .session-time{ font-family:var(--font-mono); font-size:13px; color:var(--text-secondary); display:inline-flex; align-items:baseline; }
  .session-dot{ margin:0 8px; color:var(--hairline-strong); }

  .exercise-header{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:4px; }
  .exercise.expanded .exercise-header{ margin-bottom:13px; }
  .exercise.is-active{ border-color:var(--hairline-strong); }
  .exercise h3{ font-size:15px; font-weight:650; letter-spacing:-0.012em; margin:0 0 3px; }
  .exercise .target{ font-size:11.5px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .exercise.is-skipped{ opacity:0.4; }
  .pr-badge, .swap-badge, .skip-badge{
    display:inline-block; font-size:9px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    border-radius:var(--r-xs); padding:1.5px 5px; margin-left:6px; vertical-align:middle;
    color:var(--text-muted); border:1px solid var(--hairline-strong);
  }
  .pr-badge{ color:var(--accent); border-color:var(--accent); }
  .ex-menu{
    background:none; border:none; color:var(--text-muted); font-size:14px;
    letter-spacing:1px; width:34px; min-height:36px; cursor:pointer; flex-shrink:0;
  }
  .ex-note{
    border-left:1px solid var(--hairline-strong); padding:1px 0 1px 11px;
    margin:0 0 13px; display:flex; flex-direction:column; gap:5px;
  }
  .ex-note-rule{ font-size:11.5px; color:var(--text-secondary); line-height:1.45; }
  .ex-note-rule b{ color:var(--text); font-family:var(--font-mono); font-weight:650; }
  .ex-note-cue{ font-size:11.5px; color:var(--text-muted); line-height:1.5; }
  .goal-line{
    font-size:11.5px; color:var(--text-secondary); background:var(--surface-2);
    border:1px solid var(--hairline); border-radius:var(--r-sm); padding:8px 10px; margin-bottom:12px; line-height:1.45;
  }
  .goal-line b{ color:var(--text); font-weight:650; font-variant-numeric:tabular-nums; }
  .deload-banner{
    background:var(--surface); border:1px solid var(--hairline-strong); border-left:2px solid var(--accent);
    border-radius:var(--r-sm); padding:10px 13px; margin-bottom:10px; font-size:12px; color:var(--text-secondary);
  }
  .deload-banner b{ color:var(--text); }

  .col-labels{ display:grid; grid-template-columns:20px 1fr 1fr 50px 48px; gap:5px; margin-bottom:7px; }
  .col-labels span{ font-size:9px; font-weight:650; letter-spacing:0.09em; text-transform:uppercase; color:var(--text-muted); text-align:center; }
  .set-row{ display:grid; grid-template-columns:20px 1fr 1fr 50px 48px; gap:5px; align-items:center; margin-bottom:7px; }
  .set-idx{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); text-align:center; }
  .cell, .rir-cell{
    width:100%; min-height:46px; display:flex; align-items:center; justify-content:center; gap:1px;
    background:var(--surface-2); border:1px solid var(--hairline); color:var(--text);
    font-family:var(--font-mono); font-weight:600; font-size:15.5px; border-radius:var(--r-sm);
    cursor:pointer; user-select:none; -webkit-user-select:none; padding:0 2px;
  }
  .cell:active, .rir-cell:active{ background:var(--surface-3); }
  .rir-cell{ font-size:14.5px; color:var(--text-secondary); }
  .rir-cell.needs-rir{ border-color:rgba(255,69,58,0.5); color:var(--danger); }
  .cell .ph{ color:var(--text-muted); font-weight:400; font-size:13px; }
  .cell-active{ border-color:var(--accent); background:var(--accent-dim); color:var(--text); }
  .cell-active .pending{ opacity:.42; }
  .cell-active .caret{
    display:inline-block; width:2px; height:18px; background:var(--accent); border-radius:1px;
    animation:blink 1s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .set-row.current .cell, .set-row.current .rir-cell{ border-color:rgba(200,30,58,0.5); }
  .set-row.current .set-idx{ color:var(--accent); font-weight:700; }
  .set-row.done .cell, .set-row.done .rir-cell{ opacity:0.5; }
  .suggest{ font-family:var(--font-mono); font-size:12px; color:var(--text); font-weight:650; text-align:center; }
  .suggest.muted{ color:var(--text-muted); font-weight:400; }
  .wu-remove{ background:var(--surface-2); border:1px solid var(--hairline); color:var(--text-muted); border-radius:var(--r-sm); min-height:42px; font-size:14px; cursor:pointer; }
  .add-wu{ width:100%; margin-bottom:12px; }
  .wu-hint{ font-size:10.5px; color:var(--text-muted); margin:6px 0 12px; text-align:center; }

  /* ---------- tastierino ---------- */
  body.kp-open .app{ padding-bottom:360px; }
  .keypad{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:970;
    background:var(--surface-3); border-top:1px solid var(--hairline-strong);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .kp-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 4px 10px; }
  .kp-label{ font-size:11.5px; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kp-done{ background:none; border:none; color:var(--accent); font-family:var(--font); font-weight:650; font-size:13.5px; padding:6px 8px; cursor:pointer; flex-shrink:0; }
  .kp-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .kp-key{
    min-height:50px; background:var(--surface-2); border:1px solid var(--hairline); color:var(--text);
    font-family:var(--font-mono); font-weight:650; font-size:20px; border-radius:var(--r-sm); cursor:pointer;
  }
  .kp-key:active{ background:var(--surface); }
  .kp-key:disabled{ opacity:0.25; }
  .kp-back{ font-size:17px; color:var(--text-secondary); }
  .kp-rir{ display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
  .kp-rir-btn{
    min-height:56px; background:var(--surface-2); border:1px solid var(--hairline); color:var(--text);
    font-family:var(--font-mono); font-weight:650; font-size:19px; border-radius:var(--r-sm); cursor:pointer;
  }
  .kp-rir-btn:active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .kp-rir-hint{ font-size:11px; color:var(--text-muted); text-align:center; margin-top:9px; }
  .kp-next{
    width:100%; margin-top:10px; background:var(--accent); color:var(--on-accent); border:1px solid var(--accent);
    font-family:var(--font); font-weight:650; font-size:14.5px; min-height:46px; border-radius:var(--r-sm); cursor:pointer;
  }
  .kp-next:active{ background:#a81830; border-color:#a81830; }

  /* ---------- barre fisse ---------- */
  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:900;
    padding:11px 16px calc(11px + env(safe-area-inset-bottom));
    background:var(--surface-3); border-top:1px solid var(--hairline-strong);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .bb-info{ flex:1; cursor:pointer; }
  .bb-day{ font-weight:650; font-size:13.5px; }
  .bb-sub{ font-size:10.5px; color:var(--text-muted); margin-top:2px; }
  .bb-timer{ font-family:var(--font-mono); color:var(--text); font-weight:650; font-size:13.5px; }
  .confirm-bar{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:901;
    padding:13px 16px calc(13px + env(safe-area-inset-bottom));
    background:var(--surface-3); border-top:1px solid var(--danger);
    display:flex; align-items:center; gap:10px;
  }
  .confirm-bar span{ font-size:12px; flex:1; }

  /* ---------- pannelli a comparsa ---------- */
  .sheet-scrim{ position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:980; }
  .day-sheet{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:990;
    background:var(--surface-3); border-top:1px solid var(--hairline-strong);
    border-radius:var(--r-lg) var(--r-lg) 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .sheet-handle{ display:none; }
  .sheet-title{ font-size:15px; font-weight:650; margin-bottom:10px; letter-spacing:-0.01em; }
  .sheet-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:14px 2px; min-height:52px; border-bottom:1px solid var(--hairline); cursor:pointer;
  }
  .sheet-row:active{ background:var(--surface-2); }
  .dsr-name{ font-size:14px; font-weight:600; }
  .dsr-sub{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
  .row-active{ background:var(--surface-2); }
  .sheet-cancel{
    width:100%; margin-top:14px; background:none; border:1px solid var(--hairline-strong);

    color:var(--text); padding:11px 16px; border-radius:var(--r-sm); font-weight:600; font-size:13px;
    z-index:1000; max-width:90%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error{ border-color:var(--danger); color:var(--danger); }

  /* ---------- conferme ---------- */
  .confirm-box{
    margin-top:12px; padding:13px; border-radius:var(--r-sm);
    background:rgba(255,69,58,0.06); border:1px solid rgba(255,69,58,0.4);

  .hl-rir{ width:56px; text-align:right; }
  .hist-line .chevron{ width:12px; font-size:14px; }
  .hist-sub{ font-size:11.5px; color:var(--text-secondary); margin-top:3px; font-variant-numeric:tabular-nums; }
  .det-date{ font-size:15px; font-weight:650; margin-bottom:4px; }
  .hist-badge{
    display:inline-block; font-size:10px; font-weight:600; font-variant-numeric:tabular-nums;
    color:var(--text-secondary); border:1px solid var(--hairline-strong);
    border-radius:var(--r-xs); padding:3px 7px;
  }
  .det-ex{ padding:13px 14px; }
  .det-head{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .det-name{ font-size:14px; font-weight:600; }
  .det-sum{ font-size:11px; color:var(--text-muted); margin-top:3px; font-family:var(--font-mono); }
  .det-tip{ font-size:10.5px; color:var(--text-muted); text-align:center; margin-top:8px; }

  /* ---------- editor ---------- */
  .ed-row{ display:flex; align-items:center; gap:8px; padding:12px 0; border-bottom:1px solid var(--hairline); }
  .ed-row:last-of-type{ border-bottom:none; }
  .ed-main{ min-width:0; flex:1; cursor:pointer; }
  .ed-name{ font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ed-sub{ font-size:11px; color:var(--text-muted); margin-top:4px; font-variant-numeric:tabular-nums; }
  .ed-btn{
    width:34px; height:34px; flex:none; border-radius:var(--r-xs); padding:0;
    border:1px solid var(--hairline-strong); background:var(--surface-2); color:var(--text-secondary);
    font-family:var(--font); font-size:14px; line-height:1; cursor:pointer;
  }
  .ed-btn:active{ background:var(--surface-3); }
  .ed-btn:disabled{ opacity:.22; cursor:default; }
  .ed-btn.danger{ color:var(--danger); border-color:rgba(255,69,58,0.35); }
  .ed-field{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--hairline); }
  .ed-field:last-of-type{ border-bottom:none; }
  .ed-label{ flex:1; min-width:0; font-size:13px; }
  .ed-hint{ font-size:10.5px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
  .ed-input{
    width:118px; text-align:right; background:var(--surface-2); border:1px solid var(--hairline-strong);
    border-radius:var(--r-sm); color:var(--text); font-family:var(--font); font-size:13.5px; padding:10px 11px; flex:none;
  }
  .ed-input.wide{ width:150px; text-align:left; }
  .ed-input:focus{ outline:none; border-color:var(--accent); }
  .ed-step{ display:flex; align-items:center; gap:5px; flex:none; }
  .ed-num{ min-width:64px; text-align:center; font-family:var(--font-mono); font-size:13.5px; font-weight:650; }
  .ed-toggle{
    width:44px; height:26px; flex:none; border-radius:var(--r-xs); padding:0; cursor:pointer; position:relative;
    border:1px solid var(--hairline-strong); background:var(--surface-2); transition:background .14s, border-color .14s;
  }
  .ed-toggle.on{ background:var(--accent); border-color:var(--accent); }
  .ed-toggle::after{
    content:''; position:absolute; top:3px; left:3px; width:18px; height:18px;
    border-radius:2px; background:#fff; transition:left .14s;
  }
  .ed-toggle.on::after{ left:21px; }
  .ed-alt{ border:1px solid var(--hairline); border-radius:var(--r-sm); padding:4px 12px; margin-bottom:9px; background:var(--surface-2); }
  .ed-alt-head{ display:flex; align-items:center; gap:8px; padding:10px 0 4px; }
  .ed-alt-head .ed-input{ flex:1; width:auto; text-align:left; }
  .ed-warn{
    background:rgba(255,69,58,0.05); border:1px solid rgba(255,69,58,0.3); border-radius:var(--r-sm);
    padding:12px 13px; font-size:12px; color:var(--text-secondary); line-height:1.5; margin-bottom:12px;
  }
  .ed-note{ font-size:11px; color:var(--text-muted); line-height:1.55; margin:10px 0 0; }
  .ed-add{ width:100%; margin-top:12px; }
</style>

<script>
/* =========================================================
   PROGRAMMA
   ========================================================= */
const DEFAULT_PROGRAM = {
  legs: { label:"Legs", short:"Legs", exercises:[
    { id:"hack_squat", name:"Smith machine squat", sets:4, min:10, max:12, iso:false },
    { id:"leg_press", name:"Leg press", sets:3, min:10, max:12, iso:false },
    { id:"leg_extension", name:"Leg extension", sets:4, min:12, max:15, iso:true },
    { id:"lying_leg_curl", name:"Lying leg curl", sets:3, min:10, max:12, iso:true },

  back: { label:"Back + Hamstrings", short:"Back", exercises:[
    { id:"barbell_row", name:"Barbell row", sets:4, min:6, max:8, iso:false },
    { id:"lat_pulldown", name:"Lat pulldown", sets:3, min:8, max:10, iso:false },

  ]},

    { id:"incline_db_press", name:"Incline dumbbell press", sets:3, min:8, max:10, iso:false },
    { id:"cable_lateral", name:"Cable lateral raise", sets:3, min:12, max:15, iso:true },
    { id:"ez_curl", name:"EZ bar curl", sets:3, min:8, max:10, iso:true },
    { id:"incline_curl", name:"Incline dumbbell curl", sets:3, min:10, max:12, iso:true },
    { id:"overhead_triceps", name:"Overhead triceps extension", sets:3, min:8, max:10, iso:true },
    { id:"triceps_pushdown", name:"Triceps pushdown", sets:3, min:10, max:12, iso:true }
  ]}
};

// Incremento minimo caricabile per esercizio
const DEFAULT_INCREMENTS = {
  hack_squat:5, leg_press:5, leg_extension:2.5, lying_leg_curl:2.5, hip_adduction:2.5,
  bench_press:5, incline_db_press:2, cable_chest_fly:2.5, lateral_raise:2, skullcrusher:2.5,
  barbell_row:5, lat_pulldown:2.5, seated_cable_row:2.5, face_pull:2.5, rdl:5,
  seated_db_press:2, cable_lateral:2.5, ez_curl:2.5, incline_curl:2, overhead_triceps:2.5, triceps_pushdown:2.5
};
function increment(exo){ if(exo && exo._inc) return exo._inc; return INCREMENTS[exo.id] || 2.5; }

/* Alternative per quando la macchina e' occupata o vuoi variare.
   Ogni voce porta con se' incremento e natura (isolamento o compound),
   cosi' warmup, recuperi e progressione restano corretti. */
const DEFAULT_ALTERNATIVES = {
  hack_squat:[
    {id:'hack_squat_machine', name:'Hack squat', inc:5, iso:false},
    {id:'back_squat', name:'Back squat', inc:5, iso:false},
    {id:'pendulum_squat', name:'Pendulum squat', inc:5, iso:false},
    {id:'bulgarian', name:'Bulgarian split squat', inc:2, iso:false}
  ],
  leg_press:[
    {id:'v_squat', name:'V-squat', inc:5, iso:false},
    {id:'horizontal_leg_press', name:'Horizontal leg press', inc:5, iso:false},
    {id:'pendulum_squat', name:'Pendulum squat', inc:5, iso:false}
  ],
  leg_extension:[{id:'sissy_squat', name:'Sissy squat', inc:2.5, iso:true}],
  lying_leg_curl:[{id:'seated_ham_curl_alt', name:'Seated hamstring curl', inc:2.5, iso:true},
                  {id:'nordic_curl', name:'Nordic curl', inc:2.5, iso:true}],
  hip_adduction:[{id:'copenhagen', name:'Copenhagen plank', inc:2.5, iso:true}],
  bench_press:[
    {id:'db_bench', name:'Dumbbell bench press', inc:2, iso:false},
    {id:'smith_bench', name:'Smith machine bench press', inc:5, iso:false},
    {id:'chest_press', name:'Machine chest press', inc:5, iso:false}
  ],
  incline_db_press:[
    {id:'incline_bb', name:'Incline barbell press', inc:5, iso:false},
    {id:'incline_machine', name:'Incline machine press', inc:5, iso:false}
  ],
  skullcrusher:[
    {id:'ez_overhead_ext', name:'EZ bar overhead extension', inc:2.5, iso:true},
    {id:'db_skullcrusher', name:'Dumbbell skullcrusher', inc:2, iso:true},
    {id:'close_grip', name:'Close grip bench press', inc:5, iso:false},
    {id:'dips_tri', name:'Dips', inc:5, iso:false}
  ],
  lateral_raise:[
    {id:'cable_lat_alt', name:'Cable lateral raise', inc:2.5, iso:true},
    {id:'machine_lat', name:'Machine lateral raise', inc:2.5, iso:true}
  ],
  cable_chest_fly:[
    {id:'pec_deck', name:'Pec deck', inc:2.5, iso:true},
    {id:'db_fly', name:'Dumbbell fly', inc:2, iso:true},
    {id:'low_high_fly', name:'Low to high cable fly', inc:2.5, iso:true}
  ],
  barbell_row:[
    {id:'tbar_row', name:'T-bar row', inc:5, iso:false},
    {id:'chest_supported', name:'Chest supported row', inc:5, iso:false},
    {id:'pendlay', name:'Pendlay row', inc:5, iso:false}
  ],
  lat_pulldown:[
    {id:'pullup', name:'Pull-up', inc:2.5, iso:false},
    {id:'neutral_pulldown', name:'Neutral grip pulldown', inc:2.5, iso:false}
  ],
  seated_cable_row:[
    {id:'machine_row', name:'Machine row', inc:5, iso:false},
    {id:'db_row', name:'Single arm dumbbell row', inc:2, iso:false}
  ],
  face_pull:[
    {id:'reverse_pec', name:'Reverse pec deck', inc:2.5, iso:true},
    {id:'rear_delt_fly', name:'Rear delt fly', inc:2, iso:true}
  ],
  rdl:[
    {id:'db_rdl', name:'Dumbbell Romanian deadlift', inc:2, iso:false},
    {id:'good_morning', name:'Good morning', inc:5, iso:false},
    {id:'back_extension', name:'Back extension', inc:2.5, iso:true}
  ],
  seated_db_press:[
    {id:'barbell_ohp', name:'Barbell shoulder press', inc:2.5, iso:false},
    {id:'smith_ohp', name:'Smith machine shoulder press', inc:5, iso:false},
    {id:'machine_shoulder2', name:'Machine shoulder press', inc:5, iso:false},
    {id:'arnold', name:'Arnold press', inc:2, iso:false}
  ],
  cable_lateral:[{id:'db_lateral_alt', name:'Dumbbell lateral raise', inc:2, iso:true}],
  ez_curl:[
    {id:'db_curl', name:'Dumbbell curl', inc:2, iso:true},
    {id:'cable_curl', name:'Cable curl', inc:2.5, iso:true},
    {id:'preacher', name:'Preacher curl', inc:2.5, iso:true}
  ],
  incline_curl:[
    {id:'hammer_curl', name:'Hammer curl', inc:2, iso:true},
    {id:'spider_curl', name:'Spider curl', inc:2, iso:true}
  ],
  overhead_triceps:[
    {id:'rope_overhead', name:'Rope overhead extension', inc:2.5, iso:true},
    {id:'db_overhead', name:'Dumbbell overhead extension', inc:2, iso:true}
  ],
  triceps_pushdown:[
    {id:'rope_pushdown', name:'Rope pushdown', inc:2.5, iso:true},
    {id:'kickback', name:'Triceps kickback', inc:2, iso:true}
  ]
};

/* =========================================================
   CONFIGURAZIONE MODIFICABILE
   Scheda, incrementi, alternative e parametri di calcolo vivono
   nei dati salvati. L'editor cambia logData.config; applyConfig()
   ricostruisce PROGRAM / INCREMENTS / ALTERNATIVES / TUNING, cosi'
   il resto dell'app continua a leggerli esattamente come prima.
   ========================================================= */
const DEFAULT_TUNING = {
  deloadFactor: 0.6,        // quanto scendono i carichi durante lo scarico
  readinessStrength: 1,     // quanto pesa "come ti senti" (0 = ignoralo)
  progressionSteps: 1,      // scatti aggiunti quando chiudi il range di ripetizioni
  restWarmup: 45,
  /* Avevo accorciato questi valori leggendo male Singer 2024. La meta-analisi
     trova ampia sovrapposizione fra le durate e stime centrali che semmai
     favoriscono i recuperi piu' lunghi su braccio e coscia: accorciare non fa
     crescere di piu'. Ripristinati i valori originali. */
  restCompoundHeavy: 180,   // multiarticolare con range fino a 8 ripetizioni
  restCompound: 150,        // multiarticolare oltre le 8
  restIso: 90,              // isolamento fino a 14 ripetizioni
  restIsoHighRep: 60,       // isolamento da 15 ripetizioni in su
  maxJumpKg: 60,            // salto massimo ammesso fra due step di riscaldamento
  maxWarmups: 8
};

function cloneCfg(o){ return JSON.parse(JSON.stringify(o)); }

function defaultConfig(){
  return {
    days: Object.keys(DEFAULT_PROGRAM).map(function(k){
      return {
        key: k,
        label: DEFAULT_PROGRAM[k].label,
        short: DEFAULT_PROGRAM[k].short,
        exercises: DEFAULT_PROGRAM[k].exercises.map(function(e){
          return { id:e.id, name:e.name, sets:e.sets, min:e.min, max:e.max, iso:e.iso,
                   inc: DEFAULT_INCREMENTS[e.id] || 2.5, rest: 0 };
        })
      };
    }),
    alternatives: cloneCfg(DEFAULT_ALTERNATIVES),
    tuning: cloneCfg(DEFAULT_TUNING)
  };
}

let PROGRAM = {};
let INCREMENTS = {};
let ALTERNATIVES = {};
let TUNING = cloneCfg(DEFAULT_TUNING);

/* Lettura sicura di un giorno: lo storico puo' contenere giorni poi
   cancellati dall'editor, e una scheda modificata non deve far
   esplodere il riepilogo di sei mesi fa. */
function progDay(k){
  return PROGRAM[k] || { label: k || '—', short: k || '—', exercises: [] };
}

function applyConfig(){
  const cfg = logData.config;
  PROGRAM = {};
  INCREMENTS = {};
  cfg.days.forEach(function(d){
    PROGRAM[d.key] = {
      label: d.label,
      short: d.short || d.label,
      exercises: d.exercises.map(function(e){
        return { id:e.id, name:e.name, sets:e.sets, min:e.min, max:e.max,
                 iso:!!e.iso, rest: e.rest>0 ? e.rest : 0 };
      })
    };
    d.exercises.forEach(function(e){ INCREMENTS[e.id] = e.inc>0 ? e.inc : 2.5; });
  });
  ALTERNATIVES = cfg.alternatives || {};
  TUNING = cfg.tuning;
  const keys = Object.keys(PROGRAM);
  if(keys.length){
    if(!PROGRAM[currentDay]) currentDay = keys[0];
    if(!PROGRAM[dashboardDay]) dashboardDay = keys[0];
  }
}

/* Completa una configurazione salvata con i campi introdotti dopo:
   aggiornare l'app non deve mai azzerare la scheda dell'utente. */
function ensureConfig(){
  if(!logData.meta) logData.meta = {};
  if(!logData.config || !Array.isArray(logData.config.days) || !logData.config.days.length){
    logData.config = defaultConfig();
    return;
  }
  const cfg = logData.config;
  if(!cfg.alternatives) cfg.alternatives = {};
  cfg.tuning = Object.assign(cloneCfg(DEFAULT_TUNING), cfg.tuning || {});
  cfg.days.forEach(function(d){
    if(!Array.isArray(d.exercises)) d.exercises = [];
    if(!d.short) d.short = d.label;
    d.exercises.forEach(function(e){
      if(!(e.sets>0)) e.sets = 3;
      if(!(e.min>0)) e.min = 8;
      if(!(e.max>=e.min)) e.max = e.min + 2;
      if(!(e.inc>0)) e.inc = DEFAULT_INCREMENTS[e.id] || 2.5;
      if(!(e.rest>0)) e.rest = 0;
      e.iso = !!e.iso;
    });
  });
}

// Sostituzioni valide per la sessione in corso: {slotId: {id,name,inc,iso}}
let swaps = {};
let skipped = {};
let swapSheetFor = null;
let historyOpen = null;
let histExpanded = {};           // sessione aperta nello storico {date, day}

// Restituisce l'esercizio effettivo per uno slot, applicando l'eventuale scambio
function effExo(base){
  const sw = swaps[base.id];
  if(!sw) return base;
  return { id:base.id, name:sw.name, sets:base.sets, min:base.min, max:base.max,
           iso:sw.iso, rest:base.rest, _swapId:sw.id, _inc:sw.inc, _swapName:sw.name };
}

/* =========================================================
   STATO
   ========================================================= */
const STORAGE_KEY = "matteo-workout-v3";
let logData = { entries:{}, dayHistory:{} };
let liveInputs = {};
let appView = 'dashboard';
let currentDay = 'legs';
let dashboardDay = 'legs';
let dashboardDetailOpen = false;
let chartExercise = null;
let toolsOpen = false;
let discardConfirm = false;
let activeWorkout = null;
let restTimer = null;
let lastRecap = null;
let cardOverride = {};
let edDay = null;        // giorno aperto nell'editor
let edExo = null;        // esercizio aperto nell'editor
let edSection = null;    // null | 'calcolo' | 'recuperi'
let edConfirm = null;    // conferma di eliminazione in corso
let scrollTopWanted = false;  // cambio di schermata: riparti dall'alto
// settimana di scarico: riduce i carichi consigliati senza toccare lo storico
function deloadActive(){ return !!(logData.meta && logData.meta.deloadUntil && new Date(todayISO()) <= new Date(logData.meta.deloadUntil)); }
function deloadDaysLeft(){
  if(!deloadActive()) return 0;
  return Math.max(0, Math.round((new Date(logData.meta.deloadUntil) - new Date(todayISO()))/86400000));
}
function startDeload(){
  const end = new Date(); end.setDate(end.getDate()+7);
  if(!logData.meta) logData.meta = {};
  logData.meta.deloadUntil = new Date(end.getTime()-end.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function endDeload(){ if(logData.meta) delete logData.meta.deloadUntil; }
let activeField = null;   // {exoId, kind:'work'|'wu', index, field:'w'|'r'|'rir'}
let keypadBuffer = '';
let keypadFresh = false;   // la prima cifra sostituisce il valore gia' presente

/* =========================================================
   UTIL
   ========================================================= */
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function formatDate(){ return new Date().toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'}); }
function formatClock(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0');
}
function e1rm(w,r){ return (w>0 && r>0) ? w*(1+r/30) : 0; }
function roundToStep(v, step){ return Math.max(step, Math.round(v/step)*step); }
function tidy(n){ return Number.isInteger(n) ? String(n) : String(Math.round(n*10)/10); }
// In Italia i mezzi chili si scrivono con la virgola: internamente resta un
// numero con il punto, a schermo si mostra sempre con la virgola.
function fmtNum(n){ return tidy(n).replace('.', ','); }
function parseNum(txt){ return parseFloat(String(txt).replace(',', '.')) || 0; }
function exKey(day, id){ return day+'__'+id; }
function getEntries(day,id){ return logData.entries[exKey(day,id)] || []; }

/* Uno slot puo' contenere sessioni fatte con esercizi diversi (sostituzioni):
   150kg di Smith squat non sono un record di Hack squat. Qui si filtra per la
   variante davvero eseguita, cosi' grafici, record e suggerimenti restano puliti. */
function variantOf(exo){ return (exo && exo._swapName) ? exo._swapName : null; }
function entriesForVariant(day, exo){
  const v = variantOf(exo);
  return getEntries(day, exo.id).filter(e=> (e.swappedTo||null) === v);
}
function lastEntryForVariant(day, exo){
  const a = entriesForVariant(day, exo);
  return a.length ? a[a.length-1] : null;
}
function e1rmOf(st){
  const eff = st.r + (st.rir===null||st.rir===undefined ? 0 : st.rir);
  return st.w * (1 + eff/30);
}
function getLastEntry(day,id){ const a = getEntries(day,id); return a.length ? a[a.length-1] : null; }
function getBestE1rm(day,id,variant){
  let best = null;
  const list = (variant===undefined) ? getEntries(day,id)
             : getEntries(day,id).filter(e=>(e.swappedTo||null)===variant);
  list.forEach(e=>{
    (e.work||[]).forEach(s=>{
      const v = e1rm(s.w,s.r);
      if(v>0 && (!best || v>best.val)) best = {val:v, w:s.w, r:s.r, date:e.date};
    });
  });
  return best;
}

function ensureLive(exo){
  if(!liveInputs[exo.id]) liveInputs[exo.id] = { warmups:[], work:new Array(exo.sets).fill(null) };
  return liveInputs[exo.id];
}
function getWork(exo){ return ensureLive(exo).work; }
function getWarmups(exo){ return ensureLive(exo).warmups; }
function isSetDone(s){ return !!s && s.w>0 && s.r>0 && s.rir!==null && s.rir!==undefined; }
function isSetPartial(s){ return !!s && (s.w>0 || s.r>0) && !isSetDone(s); }
function isExerciseComplete(exo){
  const w = getWork(exo);
  for(let i=0;i<exo.sets;i++){ if(!isSetDone(w[i])) return false; }
  return true;
}
function firstUnfilled(exo){
  const w = getWork(exo);
  for(let i=0;i<exo.sets;i++){ if(!isSetDone(w[i])) return i; }
  return -1;
}

/* Storage a piu livelli: a seconda di come viene aperto il file,
   window.storage puo' non essere disponibile. In quel caso si passa a
   localStorage e, come ultima spiaggia, a una copia in memoria — cosi'
   l'app resta usabile invece di rispondere solo "errore". */
const memStore = {};
let storageMode = 'sconosciuto';

async function rawGet(key){
  if(typeof window !== 'undefined' && window.storage && window.storage.get){
    try{
      const r = await window.storage.get(key, false);
      storageMode = 'app';
      if(r && r.value!==undefined && r.value!==null) return r.value;
      return null;
    }catch(e){ /* chiave assente o API non utilizzabile: si prova il livello dopo */ }
  }
  try{
    const v = window.localStorage.getItem(key);
    if(v!==null){ storageMode = 'locale'; return v; }
  }catch(e){}
  if(memStore[key]!==undefined){ storageMode = 'memoria'; return memStore[key]; }
  return null;
}

async function rawSet(key, value){
  let persisted = false;
  if(typeof window !== 'undefined' && window.storage && window.storage.set){
    try{ await window.storage.set(key, value, false); persisted = true; storageMode = 'app'; }
    catch(e){}
  }
  if(!persisted){
    try{ window.localStorage.setItem(key, value); persisted = true; storageMode = 'locale'; }
    catch(e){}
  }
  memStore[key] = value;
  if(!persisted) storageMode = 'memoria';
  return persisted;
}

async function loadData(){
  try{
    const v = await rawGet(STORAGE_KEY);
    if(v){
      const p = JSON.parse(v);
      logData = { entries: p.entries||{}, dayHistory: p.dayHistory||{}, meta: p.meta||{}, config: p.config||null };
      migrateData();
    }
  }catch(e){ logData = { entries:{}, dayHistory:{}, meta:{} }; }
  ensureConfig();
  applyConfig();
}

/* Completa i dati gia' salvati con i campi nuovi senza toccare quelli
   esistenti: aggiornare l'app non deve mai far perdere lo storico. */
function migrateData(){
  Object.keys(logData.entries||{}).forEach(k=>{
    const arr = logData.entries[k];
    if(!Array.isArray(arr)){ delete logData.entries[k]; return; }
    arr.forEach(e=>{
      if(!e.work && e.sets){ e.work = e.sets; delete e.sets; }
      if(!Array.isArray(e.work)) e.work = [];
      if(!Array.isArray(e.warmups)) e.warmups = [];
      e.work.forEach(st=>{ if(st.rir===undefined) st.rir = null; });
      if(e.swappedTo===undefined) e.swappedTo = null;
    });
  });
  Object.keys(logData.dayHistory||{}).forEach(k=>{
    (logData.dayHistory[k]||[]).forEach(h=>{
      if(!h.duration) h.duration = '01:00:00';
      if(h.effort===undefined) h.effort = null;
      if(h.readiness===undefined) h.readiness = null;
    });
  });
  if(!logData.meta) logData.meta = {};
  logData.meta.version = 4;
}
async function saveData(){
  try{ return await rawSet(STORAGE_KEY, JSON.stringify(logData)); }
  catch(e){ return false; }
}

function showToast(msg, isErr){
  const old = document.getElementById('app-toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.id='app-toast'; t.className='toast'+(isErr?' error':''); t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 2200);
}

/* Regola sullo sforzo: vicino al cedimento si cresce di piu', ma sui
   multiarticolari il cedimento costa il doppio della fatica di 1 RIR senza dare
   crescita in piu', e quella fatica si mangia le serie successive. */
function effortCue(exo){
  return exo.iso
    ? 'Ultima serie a cedimento, le precedenti a 1 ripetizione dal limite.'
    : 'Ferma ogni serie 1-2 ripetizioni prima del cedimento.';
}
function cueFor(exo){
  if(exo._swapId) return EXERCISE_CUES[exo._swapId] || null;
  return EXERCISE_CUES[exo.id] || null;
}

function restSecondsFor(exo, isWarmup){
  if(isWarmup) return TUNING.restWarmup;
  if(exo.rest > 0) return exo.rest;        // valore fissato a mano per questo slot
  if(exo.iso) return exo.max >= 15 ? TUNING.restIsoHighRep : TUNING.restIso;
  return exo.max <= 8 ? TUNING.restCompoundHeavy : TUNING.restCompound;
}
function startRest(seconds){ restTimer = { endsAt: Date.now()+seconds*1000, total:seconds, notified:false }; }

/* Suono di fine recupero generato dal browser: nessun file da caricare.
   Su iOS l'audio parte solo dopo un'interazione dell'utente, quindi il
   contesto viene creato e sbloccato al primo tocco sull'app. */
let audioCtx = null;
function unlockAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(atTime, freq, dur){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, atTime);
  gain.gain.exponentialRampToValueAtTime(0.35, atTime+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, atTime+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(atTime); osc.stop(atTime+dur+0.02);
}
function playRestDone(){
  try{
    unlockAudio();
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    beep(t,        880, 0.12);
    beep(t+0.18,   880, 0.12);
    beep(t+0.36,  1175, 0.22);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([120,80,120]); }catch(e){}
}

/* =========================================================
   WARMUP — il numero di step lo decide la banda di carico,
   poi si aggiungono step finché nessun salto supera 60kg.
   ========================================================= */
const RAMPS = {
  1:[0.60], 2:[0.35,0.67], 3:[0.35,0.60,0.80],
  4:[0.30,0.50,0.70,0.85], 5:[0.25,0.45,0.62,0.76,0.88]
};
// Fino a 5 step uso la tabella tarata a mano; oltre (carichi estremi tipo leg
// press molto caricata) genero la rampa in modo che i salti restino sotto la soglia.
function rampPercents(n){
  if(RAMPS[n]) return RAMPS[n];
  const start = 0.25, end = 0.88, out = [];
  for(let i=0;i<n;i++) out.push(start + (end-start)*i/(n-1));
  return out;
}
function baseWarmupCount(top, iso){
  if(iso){ if(top<=50) return 0; if(top<=120) return 1; return 2; }
  if(top<=40) return 0;
  if(top<=70) return 1;
  if(top<=140) return 2;
  if(top<=220) return 3;
  return 4;
}
function rampJumps(p, top){
  const w = p.map(x=>top*x).concat([top]);
  const j=[];
  for(let i=1;i<w.length;i++) j.push(w[i]-w[i-1]);
  return j;
}
function warmupRamp(exo, top){
  if(!top || top<=0) return [];
  let n = baseWarmupCount(top, exo.iso);
  if(n===0) return [];
  while(n<TUNING.maxWarmups && Math.max.apply(null, rampJumps(rampPercents(n), top)) > TUNING.maxJumpKg) n++;
  const step = top>=100 ? 5 : increment(exo);
  const repsFor = p => p<0.45 ? 8 : (p<0.65 ? 5 : (p<0.8 ? 3 : 2));
  return rampPercents(n).map(p=>({ w: roundToStep(top*p, step), r: repsFor(p) }));
}

/* =========================================================
   PROGRESSIONE — doppia progressione vera.
   Stesso peso finché non tocchi il top del range; quando lo tocchi,
   sali di un incremento. Le serie successive restano allo stesso peso:
   nell'ipertrofia si perdono ripetizioni, non si scala il carico ogni set.
   Il peso scende solo se una serie cade sotto il minimo del range.
   ========================================================= */
/* ======================= MODELLO DI FATICA =======================
   La forza cala serie dopo serie, e quanto cala dipende dall'atleta e
   dall'esercizio. Invece di una costante fissa, il fattore viene IMPARATO
   dallo storico (rapporto tra massimali stimati di serie consecutive) e usato
   appena ci sono abbastanza dati; prima di allora si parte da valori di
   riferimento tarati su chi porta la prima serie vicino al cedimento.
   Sulle fonti, per chiarezza: i tempi di recupero vengono dalla letteratura
   (Schoenfeld 2016; Grgic 2018) e la stima del massimale e' la formula di
   Epley. Questi coefficienti di calo no: sono empirici, ed e' esattamente il
   motivo per cui vengono rimpiazzati dai dati reali appena disponibili. */
function defaultFatigue(rir){
  if(rir===null || rir===undefined) return 0.92;
  if(rir<=0) return 0.88;
  if(rir<=1) return 0.90;
  if(rir<=2) return 0.93;
  if(rir<=3) return 0.96;
  return 0.98;
}
function learnedFatigue(day, exo){
  const entries = entriesForVariant(day, exo).slice(-6);
  const ratios = [];
  entries.forEach(e=>{
    const sets = (e.work||[]).filter(st=>st.w>0 && st.r>0);
    for(let i=1;i<sets.length;i++){
      const prev = e1rmOf(sets[i-1]), cur = e1rmOf(sets[i]);
      if(prev>0 && cur>0){
        const r = cur/prev;
        if(r>0.6 && r<1.15) ratios.push(r);
      }
    }
  });
  if(ratios.length < 3) return null;
  ratios.sort((a,b)=>a-b);
  return ratios[Math.floor(ratios.length/2)];
}
function fatigueFor(day, exo, rir){
  const learned = learnedFatigue(day, exo);
  if(learned===null) return defaultFatigue(rir);
  const adj = defaultFatigue(rir) / 0.92;
  return Math.min(0.99, Math.max(0.78, learned * adj));
}

/* Correzione proporzionale: dal massimale stimato della serie appena fatta si
   ricava il peso che ti tiene dentro al range nella serie successiva. */
function weightForTargetReps(exo, w, r, rir, targetReps, fatigue){
  const inc = increment(exo);
  const effReps = r + (rir===null || rir===undefined ? 0 : rir);
  const e1 = w * (1 + effReps/30);
  const raw = (e1 * fatigue) / (1 + targetReps/30);
  let out = Math.round(raw/inc)*inc;
  const floor = Math.round((w*0.70)/inc)*inc;
  if(out < floor) out = floor;
  if(out > w) out = w;
  return Math.max(inc, out);
}

// "Come ti senti oggi": sposta di poco il carico di partenza della sessione
function baseWeightForToday(day, exo){
  const last = lastEntryForVariant(day, exo);
  if(!last || !last.work || !last.work[0] || !(last.work[0].w>0)) return null;
  const w = last.work[0].w, r = last.work[0].r, rir = last.work[0].rir;
  const inc = increment(exo);
  const round = v => Math.max(inc, Math.round(v/inc)*inc);
  if(deloadActive()) return round(w*TUNING.deloadFactor);
  const ready = 1;
  // Se il carico non cambia si restituisce quello esatto: arrotondare qui
  // sposterebbe un 94kg a 95 senza motivo. Si arrotonda solo quando si calcola
  // davvero un peso nuovo.
  const step = inc * (TUNING.progressionSteps>0 ? TUNING.progressionSteps : 1);
  if(r >= exo.max)  return ready===1 ? w + step : round((w + step) * ready);
  if(r < exo.min){
    const corrected = weightForTargetReps(exo, w, r, rir, exo.min+1, 1.0);
    return ready===1 ? corrected : round(corrected * ready);
  }
  return ready===1 ? w : round(w * ready);
}

function computeSuggestions(day, exo){
  const work = getWork(exo);
  const out = new Array(exo.sets).fill(null);
  const mid = Math.round((exo.min + exo.max)/2);
  let ref = baseWeightForToday(day, exo);

  for(let i=0;i<exo.sets;i++){
    const s = work[i];
    if(isSetDone(s)){
      // dalla serie appena fatta si stima quanto reggi nella prossima,
      // usando il calo abituale misurato su questo esercizio
      const fat = fatigueFor(day, exo, s.rir);
      const target = (s.r < exo.min) ? exo.min+1 : mid;
      ref = weightForTargetReps(exo, s.w, s.r, s.rir, target, fat);
      out[i] = null;
    } else {
      out[i] = ref;
    }
  }
  return out;
}
function goalTextFor(day, exo){
  const last = lastEntryForVariant(day, exo);
  const base = baseWeightForToday(day, exo);
  if(!last || base===null) return null;
  const lw = last.work[0].w, lr = last.work[0].r;
  if(lr >= exo.max){
    return 'Ultima volta <b>'+tidy(lw)+'kg × '+lr+'</b> — hai chiuso il range, oggi si sale a <b>'+tidy(base)+'kg</b>.';
  }
  return 'Ultima volta <b>'+tidy(lw)+'kg × '+lr+'</b> — resta a <b>'+tidy(base)+'kg</b> e punta a <b>'+exo.max+' rip</b> per salire.';
}

function topWorkWeight(day, exo, suggestions){
  const work = getWork(exo);
  if(work[0] && work[0].w>0) return work[0].w;
  if(suggestions && suggestions[0]) return suggestions[0];
  return 0;
}

function tonnageForDay(day){
  let t = 0;
  progDay(day).exercises.forEach(exo=>{
    getWork(exo).forEach(s=>{ if(s) t += (s.w||0)*(s.r||0); });
    getWarmups(exo).forEach(s=>{ if(s) t += (s.w||0)*(s.r||0); });
  });
  return Math.round(t);
}

/* =========================================================
   CICLO DI VITA ALLENAMENTO
   ========================================================= */
function startWorkout(day, readiness){
  swaps = {}; skipped = {}; swapSheetFor = null;
  activeField = null; keypadBuffer = ''; keypadFresh = false;
  activeWorkout = { day, elapsedMs:0, runningSince:Date.now(), readiness: readiness||null };
  currentDay = day;
  liveInputs = {};
  cardOverride = {};
  restTimer = null;
  discardConfirm = false;
  appView = 'workout';
  renderApp();
}
function resumeWorkout(){

function daysSince(dateStr){
  if(!dateStr) return null;
  return Math.floor((new Date(todayISO()).getTime() - new Date(dateStr).getTime())/86400000);
}
/* In minuscolo: l'etichetta compare quasi sempre in coda a una frase
   ("5 esercizi · 17 serie · mai fatto"), non da sola. */
function daysSinceLabel(dateStr){
  const d = daysSince(dateStr);
  if(d===null) return 'mai fatto';
  if(d<=0) return 'oggi';
  if(d===1) return 'ieri';
  return d+' giorni fa';
}
function capitalize(t){ return t ? t.charAt(0).toUpperCase()+t.slice(1) : t; }
function suggestedDay(){
  let best = null, bestDays = -1;
  Object.keys(PROGRAM).forEach(k=>{
    const h = logData.dayHistory[k] || [];
    const last = h.length ? h[h.length-1].date : null;
    const d = last===null ? 9999 : daysSince(last);
    if(d > bestDays){ bestDays = d; best = k; }
  });
  return best || 'legs';
}
/* I due numeri che decidono la crescita sono il volume di serie dure e quanto
   vicino al cedimento le porti. Il tonnellaggio no: sale anche solo aggiungendo
   serie leggere, quindi come termometro non dice niente.
   Confronto per giorni di calendario, non per millisecondi: altrimenti una
   sessione di 7 giorni fa cade dentro o fuori a seconda dell'ora. */
function weekStats(){
  let sessions=0, sets=0, rirSum=0, rirN=0;
  Object.keys(logData.dayHistory).forEach(k=>{
    (logData.dayHistory[k]||[]).forEach(e=>{
      const d = daysSince(e.date);
      if(d===null || d<0 || d>6) return;
      sessions++;
      const st = sessionStats(e.date, k);
      sets += st.sets;
      if(st.rir!==null){ rirSum += st.rir*st.sets; rirN += st.sets; }
    });
  });
  return {sessions, sets, rir: rirN ? Math.round(rirSum/rirN*10)/10 : null};
}

// Serie di "forza stimata" per un singolo esercizio.
// Uso l'1RM stimato (Epley) della serie migliore di ogni sessione: sale sia
// quando aggiungi kg sia quando aggiungi ripetizioni allo stesso peso — che e'
// esattamente come funziona la doppia progressione. Il peso grezzo invece
// resterebbe piatto per settimane mentre stai progredendo davvero.
function strengthSeries(day, exId, variant){
  const out = [];
  const list = (variant===undefined) ? getEntries(day, exId).filter(e=>!e.swappedTo)
             : getEntries(day, exId).filter(e=>(e.swappedTo||null)===variant);
  list.forEach(e=>{
    let best = 0, bw = 0, br = 0;
    (e.work||[]).forEach(s=>{
      const v = e1rm(s.w, s.r);
      if(v>best){ best=v; bw=s.w; br=s.r; }
    });
    if(best>0) out.push({date:e.date, val:best, w:bw, r:br});
  });
  return out;
}
function fmtShort(d){
  const dt = new Date(d);
  return dt.getDate()+'/'+(dt.getMonth()+1);
}

function buildLineChart(series){
  const W = 300, H = 110, padX = 6, padTop = 10, padBot = 20;
  const vals = series.map(p=>p.val);
  const mx = Math.max.apply(null, vals);
  const mn = Math.min.apply(null, vals);
  const span = Math.max(1, mx-mn);
  const lo = mn - span*0.25, hi = mx + span*0.25;
  const n = series.length;
  const x = i => padX + (W-padX*2) * (n===1?0.5:(i/(n-1)));
  const y = v => padTop + (H-padTop-padBot) * (1 - (v-lo)/(hi-lo));

  let line = '', area = '', dots = '';
  series.forEach((p,i)=>{
    const px = x(i).toFixed(1), py = y(p.val).toFixed(1);
    line += (i===0?'M':'L') + px + ' ' + py + ' ';
    dots += '<circle cx="'+px+'" cy="'+py+'" r="'+(i===n-1?3.5:2)+'" fill="'+(i===n-1?'#c81e3a':'rgba(242,242,243,0.4)')+'"/>';
  });
  area = line + 'L'+x(n-1).toFixed(1)+' '+(H-padBot)+' L'+x(0).toFixed(1)+' '+(H-padBot)+' Z';

  let labels = '';
  const firstD = fmtShort(series[0].date), lastD = fmtShort(series[n-1].date);
  labels += '<text x="'+padX+'" y="'+(H-6)+'" fill="rgba(245,245,246,0.36)" font-size="9" font-family="ui-monospace,monospace">'+firstD+'</text>';
  labels += '<text x="'+(W-padX)+'" y="'+(H-6)+'" text-anchor="end" fill="rgba(245,245,246,0.36)" font-size="9" font-family="ui-monospace,monospace">'+lastD+'</text>';

  return '<div class="line-wrap">'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="line-svg" id="line-svg">'+
      '<line x1="'+padX+'" y1="'+(H-padBot)+'" x2="'+(W-padX)+'" y2="'+(H-padBot)+'" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>'+
      '<path d="'+area+'" fill="rgba(200,30,58,0.06)"/>'+
      '<path d="'+line+'" fill="none" stroke="#c81e3a" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>'+
      dots + labels +
      '<line id="line-cursor" x1="0" y1="'+padTop+'" x2="0" y2="'+(H-padBot)+'" stroke="rgba(245,245,246,0.35)" stroke-width="1" style="display:none"/>'+
    '</svg>'+
  '</div>';
}

function setupLineChart(series){
  const svg = document.getElementById('line-svg');
  const foot = document.getElementById('chart-foot');
  if(!svg || !foot) return;
  const cursor = document.getElementById('line-cursor');
  const base = foot.textContent;
  let drag = false;
  function upd(clientX){
    const rect = svg.getBoundingClientRect();
    const rel = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));
    const i = Math.round(rel*(series.length-1));
    const p = series[i];
    const padX = 6, W = 300;
    const px = padX + (W-padX*2)*(series.length===1?0.5:(i/(series.length-1)));
    if(cursor){ cursor.setAttribute('x1',px); cursor.setAttribute('x2',px); cursor.style.display='block'; }
    foot.innerHTML = '<b>'+Math.round(p.val)+'kg</b> stimati · '+tidy(p.w)+'kg × '+p.r+' · '+fmtShort(p.date);
  }
  svg.addEventListener('pointerdown', e=>{ drag=true; svg.setPointerCapture(e.pointerId); upd(e.clientX); });
  svg.addEventListener('pointermove', e=>{ if(drag) upd(e.clientX); });
  svg.addEventListener('pointerup', ()=>{ drag=false; });
  svg.addEventListener('pointercancel', ()=>{ drag=false; if(cursor) cursor.style.display='none'; foot.textContent=base; });
}

/* =========================================================
   COACH — osservazioni generate dallo storico.
   Regole in ordine di priorità: prima quello che blocca la
   progressione, poi quello che la conferma.
   ========================================================= */
function buildInsights(){
  const out = [];
  const now = new Date(todayISO()).getTime();

  // 1. Stallo: stesso peso E ripetizioni non in crescita nelle ultime 3 sessioni
  Object.keys(PROGRAM).forEach(dayKey=>{
    progDay(dayKey).exercises.forEach(exo=>{
      const s = strengthSeries(dayKey, exo.id);
      if(s.length<3) return;
      const l = s.slice(-3);
      const sameW = l.every(p=>p.w===l[0].w);
      const noRepGain = l[2].r <= l[0].r;
      if(sameW && noRepGain){
        out.push({p:1, type:'warn', title:exo.name+' è fermo',
          text:'3 sessioni a '+tidy(l[0].w)+'kg senza guadagnare ripetizioni. Porta le serie più vicino al cedimento, oppure scarica una settimana e riparti.'});
      }
    });
  });

  // 2. Effort: RIR valutato per giorno, non globalmente. La media su tutti i
  // giorni nasconde il problema: un Push svogliato viene diluito dalle gambe
  // spinte bene. Il segnale utile e' "su QUESTO giorno stai mollando".
  Object.keys(PROGRAM).forEach(dayKey=>{
    let sum=0, n=0;
    progDay(dayKey).exercises.forEach(exo=>{
      getEntries(dayKey, exo.id).slice(-2).forEach(e=>{
        (e.work||[]).forEach(st=>{
          if(st.rir!==null && st.rir!==undefined && st.w>0){ sum+=st.rir; n++; }
        });
      });
    });
    if(n<6) return;
    const avg = sum/n;
    if(avg>2.4){
      out.push({p:2, type:'warn', title:'Poco sforzo su '+progDay(dayKey).label,
        text:'RIR medio '+(Math.round(avg*10)/10)+' nelle ultime sessioni. L\u2019ipertrofia aumenta man mano che ci si avvicina al cedimento: punta a 1-2.'});
    }
  });

  // 3. Giorno trascurato
  Object.keys(PROGRAM).forEach(dayKey=>{
    const h = logData.dayHistory[dayKey] || [];
    if(h.length===0) return;
    const d = Math.floor((now - new Date(h[h.length-1].date).getTime())/86400000);
    if(d>=10){
      out.push({p:3, type:'warn', title:progDay(dayKey).label+' indietro',
        text:'Non lo alleni da '+d+' giorni: il volume settimanale su questi gruppi sta scendendo.'});
    }
  });

  // 4. Range chiuso: pronto a salire
  Object.keys(PROGRAM).forEach(dayKey=>{
    progDay(dayKey).exercises.forEach(exo=>{
      const last = getLastEntry(dayKey, exo.id);
      if(!last || !last.work || !last.work[0]) return;
      if(last.work[0].r >= exo.max && last.work[0].w>0){
        out.push({p:4, type:'good', title:'Sali di carico su '+exo.name,
          text:'Hai chiuso il range a '+tidy(last.work[0].w)+'kg × '+last.work[0].r+'. La prossima parti da '+tidy(last.work[0].w+increment(exo))+'kg.'});
      }
    });
  });

  // 6. Frequenza settimanale
  const ws = weekStats();
  if(ws.sessions===0){
    const anyData = Object.keys(logData.dayHistory).some(k=>(logData.dayHistory[k]||[]).length>0);
    out.push({p:0, type:anyData?'warn':'info', title: anyData?'Settimana ferma':'Inizia a registrare',
      text: anyData ? 'Nessuna sessione negli ultimi 7 giorni.' : 'Registra la prima sessione: da lì partono progressione e carichi consigliati.'});
  }

  // 7. Deload dopo lunga progressione continua
  let longRun = 0;
  Object.keys(PROGRAM).forEach(dayKey=>{
    progDay(dayKey).exercises.forEach(exo=>{
      const s = strengthSeries(dayKey, exo.id);
      if(s.length>=8){
        const up = s.slice(-8).every((p,i,a)=> i===0 || p.val>=a[i-1].val*0.99);
        if(up) longRun++;
      }
    });
  });
  if(deloadActive()){
    out.unshift({p:-1, type:'info', title:'Settimana di scarico in corso',
      text:'Carichi ridotti per '+deloadDaysLeft()+' giorni. Tecnica pulita e niente cedimento.',
      action:'end-deload', actionLabel:'Termina ora'});
  } else if(longRun>=3){
    out.push({p:8, type:'info', title:'Valuta una settimana di scarico',
      text:'Progressione continua da 8+ sessioni su più esercizi. Una settimana di scarico non toglie ipertrofia e scarica la fatica accumulata.',
      action:'start-deload', actionLabel:'Attiva scarico'});
  }

  out.sort((a,b)=>a.p-b.p);
  return out.slice(0,3);
}

/* =========================================================
   TASTIERA NUMERICA INTERNA
   Sostituisce quella di sistema: non si apre e chiude di continuo,
   non fa saltare lo scroll e accetta la virgola.
   ========================================================= */
function getFieldModel(f){
  if(!f) return null;
  if(f.scope==='hist'){
    const arr = logData.entries[exKey(f.day, f.exoId)] || [];
    const entry = arr.filter(e=>e.date===f.date)[0];
    if(!entry) return null;
    const list = f.kind==='wu' ? (entry.warmups||[]) : (entry.work||[]);
    const obj = list[f.index];
    if(!obj) return null;
    const exoDef = progDay(f.day).exercises.filter(e=>e.id===f.exoId)[0];
    return {exo:exoDef, obj:obj, hist:true, day:f.day, date:f.date};
  }
  const exo = progDay(currentDay).exercises.filter(e=>e.id===f.exoId)[0];
  if(!exo) return null;
  if(f.kind==='wu'){
    const wu = getWarmups(exo);
    return wu[f.index] ? {exo:exo, obj:wu[f.index]} : null;
  }
  const work = getWork(exo);
  if(!work[f.index]) work[f.index] = {w:0, r:0, rir:null};
  return {exo:exo, obj:work[f.index]};
}
/* Alla selezione il campo mostra il valore attuale ma resta "fresco": la prima
   cifra lo sostituisce, dalla seconda in poi si accoda. Cancella invece entra
   in modifica sul valore esistente, che serve per correggere un refuso. */
function pressKey(k){
  if(k==='back'){ keypadFresh = false; keypadBuffer = keypadBuffer.slice(0,-1); return; }
  if(k===','){
    if(keypadFresh){ keypadBuffer = '0'; keypadFresh = false; }
    if(keypadBuffer.indexOf('.')===-1) keypadBuffer = (keypadBuffer===''?'0':keypadBuffer)+'.';
    return;
  }
  if(keypadFresh){ keypadBuffer = k; keypadFresh = false; return; }
  if(keypadBuffer.length<6) keypadBuffer += k;
}
function focusField(f){
  activeField = f;
  if(!f){ keypadBuffer = ''; keypadFresh = false; return; }
  const cv = currentFieldValue();
  keypadBuffer = (cv==='0') ? '' : cv;
  keypadFresh = keypadBuffer !== '';
}
function currentFieldValue(){
  const m = getFieldModel(activeField);
  if(!m) return '';
  const v = m.obj[activeField.field];
  return (v===null || v===undefined || v===0) ? '' : String(v);
}
function commitBuffer(){
  const m = getFieldModel(activeField);
  if(!m) return;
  const val = keypadBuffer==='' ? 0 : parseNum(keypadBuffer);
  if(m.hist){
    // correzione di una sessione gia' salvata: aggiorno anche il totale
    m.obj[activeField.field] = val;
    recalcSessionTonnage(m.day, m.date);
    saveData();
    return;
  }
  const wasDone = activeField.kind==='work' ? isSetDone(m.obj) : false;
  m.obj[activeField.field] = val;
  if(activeField.kind==='work'){
    const work = getWork(m.exo);
    const o = work[activeField.index];
    if(o && !(o.w>0) && !(o.r>0) && (o.rir===null||o.rir===undefined)) work[activeField.index] = null;
    if(!wasDone && isSetDone(work[activeField.index])) startRest(restSecondsFor(m.exo, false));
  } else {
    if(m.obj.w>0 && m.obj.r>0) startRest(restSecondsFor(m.exo, true));
  }
}
function setRir(v){
  const m = getFieldModel(activeField);
  if(!m || activeField.kind!=='work') return;
  const work = getWork(m.exo);
  if(!work[activeField.index]) work[activeField.index] = {w:0,r:0,rir:null};
  const wasDone = isSetDone(work[activeField.index]);
  work[activeField.index].rir = v;
  if(!wasDone && isSetDone(work[activeField.index])) startRest(restSecondsFor(m.exo, false));
}
function recalcSessionTonnage(day, date){
  let t = 0;
  progDay(day).exercises.forEach(exo=>{
    const e = getEntries(day, exo.id).filter(x=>x.date===date)[0];
    if(!e) return;
    (e.work||[]).forEach(st=>{ t += (st.w||0)*(st.r||0); });
    (e.warmups||[]).forEach(st=>{ t += (st.w||0)*(st.r||0); });
  });
  const rec = (logData.dayHistory[day]||[]).filter(x=>x.date===date)[0];
  if(rec) rec.tonnage = Math.round(t);
}

function nextField(){
  const f = activeField;
  if(!f) return null;
  if(f.scope==='hist') return null;   // nello storico si corregge un valore per volta
  const exo = progDay(currentDay).exercises.filter(e=>e.id===f.exoId)[0];
  if(!exo) return null;
  if(f.field==='w') return {exoId:f.exoId, kind:f.kind, index:f.index, field:'r'};
  if(f.field==='r' && f.kind==='work') return {exoId:f.exoId, kind:'work', index:f.index, field:'rir'};
  if(f.field==='rir' || (f.field==='r' && f.kind==='wu')){
    const limit = f.kind==='wu' ? getWarmups(exo).length : exo.sets;
    if(f.index+1 < limit) return {exoId:f.exoId, kind:f.kind, index:f.index+1, field:'w'};
    if(f.kind==='wu' && exo.sets>0) return {exoId:f.exoId, kind:'work', index:0, field:'w'};
  }
  return null;
}
function makeCell(exoId, kind, index, field, value, placeholder){
  const cell = document.createElement('div');
  const isActive = activeField && activeField.exoId===exoId && activeField.kind===kind
                   && activeField.index===index && activeField.field===field;
  cell.className = 'cell'+(isActive?' cell-active':'');
  if(isActive){
    cell.innerHTML = '<span'+(keypadFresh?' class="pending"':'')+'>'+
      (keypadBuffer===''?'':keypadBuffer.replace('.', ','))+'</span><span class="caret"></span>';
  } else if(value!==null && value!==undefined && value!==0 && value!==''){
    cell.textContent = field==='w' ? fmtNum(value) : String(value);
  } else {
    cell.innerHTML = '<span class="ph">'+placeholder+'</span>';
  }
  cell.addEventListener('click', ()=>{
    if(activeField) commitBuffer();
    focusField({exoId:exoId, kind:kind, index:index, field:field});
    renderApp();
  });
  return cell;
}
